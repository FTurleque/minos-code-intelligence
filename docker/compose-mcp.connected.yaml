name: "${MINOS_COMPOSE_PROJECT}"

# Resource ceilings (audit S11), one definition per role, overridable from the runtime .env.
# Merged into each service with `<<: *limits-<role>`. `memswap_limit` equals `mem_limit`: no swap.
# `cpus` defaults to 0 = no CPU ceiling: a hard default above the host's CPU count makes the Docker
# daemon refuse to create the container ("range of CPUs is from 0.01 to N"). Set MINOS_<ROLE>_CPUS
# (for example 2) in the runtime .env to cap a role on a shared host.
# docker/compose-mcp.prod.yaml and docker/compose-mcp.connected.yaml carry the same blocks; a gate
# (scripts/quality/check-compose-limits.py) refuses any divergence. Values and the measurements
# behind them: docs/user/docker-runtime.md, "Limites de ressources".
x-limits-query: &limits-query
  cpus: "${MINOS_MCP_CPUS:-0}"
  mem_limit: "${MINOS_MCP_MEM_LIMIT:-3g}"
  memswap_limit: "${MINOS_MCP_MEM_LIMIT:-3g}"
  pids_limit: "${MINOS_MCP_PIDS_LIMIT:-1024}"
x-limits-admin: &limits-admin
  cpus: "${MINOS_ADMIN_CPUS:-0}"
  mem_limit: "${MINOS_ADMIN_MEM_LIMIT:-2g}"
  memswap_limit: "${MINOS_ADMIN_MEM_LIMIT:-2g}"
  pids_limit: "${MINOS_ADMIN_PIDS_LIMIT:-256}"
x-limits-job: &limits-job
  cpus: "${MINOS_JOB_CPUS:-0}"
  mem_limit: "${MINOS_JOB_MEM_LIMIT:-512m}"
  memswap_limit: "${MINOS_JOB_MEM_LIMIT:-512m}"
  pids_limit: "${MINOS_JOB_PIDS_LIMIT:-128}"
x-limits-postgres: &limits-postgres
  cpus: "${MINOS_POSTGRES_CPUS:-0}"
  mem_limit: "${MINOS_POSTGRES_MEM_LIMIT:-1g}"
  memswap_limit: "${MINOS_POSTGRES_MEM_LIMIT:-1g}"
  pids_limit: "${MINOS_POSTGRES_PIDS_LIMIT:-128}"
x-limits-ollama: &limits-ollama
  cpus: "${MINOS_OLLAMA_CPUS:-0}"
  mem_limit: "${MINOS_OLLAMA_MEM_LIMIT:-2g}"
  memswap_limit: "${MINOS_OLLAMA_MEM_LIMIT:-2g}"
  pids_limit: "${MINOS_OLLAMA_PIDS_LIMIT:-256}"

services:
  minos-mcp:
    <<: *limits-query
    image: "${MINOS_IMAGE}"
    container_name: "${MINOS_CONTAINER_NAME}"
    entrypoint: [sleep, infinity]
    init: true
    depends_on:
      minos-postgres:
        condition: service_healthy
        required: false
      minos-ollama:
        condition: service_healthy
        required: false
    environment:
      MINOS_HOME: /var/lib/minos
      MINOS_RUNTIME_LOCATION: docker
      MINOS_SEMANTIC_PROVIDER: "${MINOS_SEMANTIC_PROVIDER:-disabled}"
      MINOS_SEMANTIC_MODEL: "${MINOS_SEMANTIC_MODEL:-}"
      MINOS_SEMANTIC_DIMENSIONS: "${MINOS_SEMANTIC_DIMENSIONS:-}"
      MINOS_SEMANTIC_ENDPOINT: "${MINOS_SEMANTIC_ENDPOINT:-}"
      MINOS_SEMANTIC_TIMEOUT_SECONDS: "${MINOS_SEMANTIC_TIMEOUT_SECONDS:-}"
    working_dir: /workspace/projects
    volumes:
      - type: bind
        source: "${MINOS_DATA_DIR}"
        target: /var/lib/minos
        read_only: true
      - type: volume
        source: minos-provider-tools
        target: /var/lib/minos/tools
        read_only: true
      - type: bind
        source: "${MINOS_PROJECTS_DIR}"
        target: /workspace/projects
        read_only: true
    networks: [minos-runtime]
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m,mode=1777
      # PostgresCodeKnowledgeSnapshotStore creates MINOS_HOME/postgresql-snapshot-scratch in
      # its constructor, but this plane mounts MINOS data read-only by design -- so selecting
      # the PostgreSQL backend made the MCP server fail to bootstrap with a FileSystemException
      # before it could answer a single request. The scratch area is ephemeral per-process
      # working space, so a tmpfs is its correct home: the data mount stays read-only and the
      # scratch never outlives the container. Owned by the container's unprivileged uid with
      # private permissions to satisfy PrivateLocalStorage's own checks.
      #
      # The mountpoint itself must already exist on the data bind (runc cannot create one
      # inside a read-only mount). It is not created here by data-bootstrap: that plane runs as
      # root with only CHOWN/FOWNER, so without DAC_OVERRIDE it cannot write into the 0700
      # directory it just chown'd to uid 10001. Instead the ephemeral admin plane -- which runs
      # as 10001 with the data mount writable, and always precedes this plane in
      # prod-mcp-release.ps1's Install/Validate -- lets MINOS create it through its own
      # PrivateLocalStorage invariant, which is also what keeps the permissions correct.
      - /var/lib/minos/postgresql-snapshot-scratch:rw,nosuid,nodev,noexec,size=256m,mode=0700,uid=10001,gid=10001
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    stop_grace_period: 10s
    labels:
      io.minos.installation: "${MINOS_COMPOSE_PROJECT}"
      io.minos.version: "${MINOS_VERSION}"
      io.minos.revision: "${MINOS_GIT_COMMIT}"
      io.minos.runtime-plane: query
      io.minos.network-policy: internal-services-only

  minos-admin:
    <<: *limits-admin
    image: "${MINOS_IMAGE}"
    entrypoint: [java, -cp, /opt/minos/minos.jar, com.minos.cli.MinosLauncher]
    init: true
    environment:
      MINOS_HOME: /var/lib/minos
      MINOS_RUNTIME_LOCATION: docker
      MINOS_SEMANTIC_PROVIDER: "${MINOS_SEMANTIC_PROVIDER:-disabled}"
      MINOS_SEMANTIC_MODEL: "${MINOS_SEMANTIC_MODEL:-}"
      MINOS_SEMANTIC_DIMENSIONS: "${MINOS_SEMANTIC_DIMENSIONS:-}"
      MINOS_SEMANTIC_ENDPOINT: "${MINOS_SEMANTIC_ENDPOINT:-}"
      MINOS_SEMANTIC_TIMEOUT_SECONDS: "${MINOS_SEMANTIC_TIMEOUT_SECONDS:-}"
      HOME: /var/lib/minos/cache/home
      COURSIER_CACHE: /var/lib/minos/cache/coursier
      MAVEN_OPTS: -Dmaven.repo.local=/var/lib/minos/cache/maven/repository
      JAVA_TOOL_OPTIONS: -Djava.io.tmpdir=/run/minos-native -Djna.tmpdir=/run/minos-native
      DOTNET_CLI_HOME: /var/lib/minos/cache/dotnet-home
      NUGET_PACKAGES: /var/lib/minos/cache/nuget
    working_dir: /workspace/projects
    volumes:
      - type: bind
        source: "${MINOS_DATA_DIR}"
        target: /var/lib/minos
      - type: volume
        source: minos-provider-tools
        target: /var/lib/minos/tools
        read_only: true
      - type: bind
        source: "${MINOS_PROJECTS_DIR}"
        target: /workspace/projects
        read_only: true
    networks: [minos-runtime, minos-admin-egress]
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=128m,mode=1777
      - /run/minos-native:rw,nosuid,nodev,exec,size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: "no"
    labels:
      io.minos.installation: "${MINOS_COMPOSE_PROJECT}"
      io.minos.version: "${MINOS_VERSION}"
      io.minos.revision: "${MINOS_GIT_COMMIT}"
      io.minos.runtime-plane: admin

  minos-bootstrap:
    <<: *limits-job
    image: "${MINOS_IMAGE}"
    entrypoint: [java, -cp, /opt/minos/minos.jar, com.minos.cli.DockerRuntimeBootstrap]
    command: [configure-project-paths, "${MINOS_HOST_PROJECTS_ROOT}", /workspace/projects]
    init: true
    network_mode: none
    environment:
      MINOS_HOME: /var/lib/minos
      MINOS_RUNTIME_LOCATION: docker
    volumes:
      - type: bind
        source: "${MINOS_DATA_DIR}"
        target: /var/lib/minos
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: "no"

  # Mirrors the base profile's data-bootstrap. The M30 configurator swaps this connected file
  # in as the active runtime compose, so every service the base workflow runs must exist here
  # too -- omitting it made prod-mcp-release.ps1's Install/Validate fail with "no such
  # service: minos-data-bootstrap" on any run after managed PostgreSQL/Ollama was configured.
  minos-data-bootstrap:
    <<: *limits-job
    image: "${MINOS_IMAGE}"
    entrypoint: [/bin/sh, -c]
    command:
      - |
        set -eu
        chown 10001:10001 /var/lib/minos
        chmod 700 /var/lib/minos
        echo "MINOS Docker data root ownership prepared."
    user: "0:0"
    init: true
    network_mode: none
    volumes:
      - type: bind
        source: "${MINOS_DATA_DIR}"
        target: /var/lib/minos
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=16m,mode=1777
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER]
    security_opt: [no-new-privileges:true]
    restart: "no"
    labels:
      io.minos.installation: "${MINOS_COMPOSE_PROJECT}"
      io.minos.version: "${MINOS_VERSION}"
      io.minos.revision: "${MINOS_GIT_COMMIT}"
      io.minos.runtime-plane: data-bootstrap

  minos-tools-bootstrap:
    <<: *limits-job
    image: "${MINOS_IMAGE}"
    entrypoint: [/bin/sh, -c]
    command:
      - |
        set -eu
        marker=/var/lib/minos/tools/.minos-image-revision
        if [ -f "$$marker" ] && [ "$$(cat "$$marker")" = "$${MINOS_GIT_COMMIT}" ]; then
          echo "MINOS Docker provider tools already match image revision $${MINOS_GIT_COMMIT}."
          exit 0
        fi
        find /var/lib/minos/tools -mindepth 1 -maxdepth 1 -exec rm -rf {} +
        cp -a /opt/minos/provider-tools/. /var/lib/minos/tools/
        printf '%s\n' "$${MINOS_GIT_COMMIT}" > "$$marker"
    user: "0:0"
    init: true
    network_mode: none
    environment:
      MINOS_GIT_COMMIT: "${MINOS_GIT_COMMIT}"
    volumes:
      - type: volume
        source: minos-provider-tools
        target: /var/lib/minos/tools
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: "no"

  minos-provider-probe:
    <<: *limits-job
    image: "${MINOS_IMAGE}"
    entrypoint: [/bin/sh, -c]
    command:
      - |
        set -eu
        java -version
        javac -version
        mvn --version
        scip-java --version >/dev/null
        /var/lib/minos/tools/scip-typescript/0.4.0/node_modules/.bin/scip-typescript --help >/dev/null
        /var/lib/minos/tools/scip-python/0.6.6/node_modules/.bin/scip-python --help >/dev/null
        scip-clang --version >/dev/null 2>&1
        dotnet --version
        /var/lib/minos/tools/scip-dotnet/0.2.14/scip-dotnet --help >/dev/null
        go version
        /var/lib/minos/tools/scip-go/0.2.7/scip-go --help >/dev/null
        rustc --version
        cargo --version
        rust-analyzer --version >/dev/null 2>&1
        echo "MINOS Docker offline provider probe SUCCESS"
    user: "10001:10001"
    init: true
    network_mode: none
    environment:
      MINOS_HOME: /var/lib/minos
      MINOS_RUNTIME_LOCATION: docker
      COURSIER_CACHE: /tmp/minos-coursier-cache
      JAVA_TOOL_OPTIONS: -Djava.io.tmpdir=/run/minos-native -Djna.tmpdir=/run/minos-native
      DOTNET_CLI_HOME: /tmp/minos-dotnet-home
      NUGET_PACKAGES: /tmp/minos-nuget
    volumes:
      - type: volume
        source: minos-provider-tools
        target: /var/lib/minos/tools
        read_only: true
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=128m,mode=1777
      - /run/minos-native:rw,nosuid,nodev,exec,size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: "no"

  minos-postgres:
    <<: *limits-postgres
    profiles: [postgresql]
    # The ONLY place that names this image (docker/scripts/configure-m30-docker-services.ps1 and the
    # PostgreSQL integration tests read it from here). <tag>@<index digest>: the digest is the pin,
    # the tag is what a human or Dependabot reads. Gate: scripts/quality/check-image-pins.py.
    image: "${MINOS_POSTGRES_IMAGE:-pgvector/pgvector:0.8.2-pg17@sha256:feb68f4f15446397d8cac7f4fe48fe4586de83160d1fc48b46283312d1a33966}"
    environment:
      POSTGRES_DB: "${MINOS_POSTGRES_DATABASE:-minos}"
      POSTGRES_USER: "${MINOS_POSTGRES_USER:-minos}"
      POSTGRES_PASSWORD_FILE: /run/secrets/minos-postgres-password
    volumes:
      - type: volume
        source: minos-postgres-data
        target: /var/lib/postgresql/data
      - type: bind
        source: "${MINOS_POSTGRES_PASSWORD_FILE}"
        target: /run/secrets/minos-postgres-password
        read_only: true
    networks: [minos-runtime]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m,mode=1777
      - /var/run/postgresql:rw,nosuid,nodev,noexec,size=16m
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    labels:
      io.minos.installation: "${MINOS_COMPOSE_PROJECT}"
      io.minos.runtime-plane: storage

  # Ollama runs as the unprivileged uid 10002 (audit S11). Model volumes created by earlier
  # versions are owned by root (they were mounted on /root/.ollama): this one-shot service, which
  # reuses the MINOS image rather than a second copy of the Ollama image, hands the volume to
  # 10002 before Ollama starts. It touches nothing when the ownership already matches, so a fresh
  # volume (empty) and an already migrated one cost one `find`. The mount keeps the layout Ollama
  # expects under HOME (`~/.ollama`), so models already pulled are found as they are.
  minos-ollama-bootstrap:
    <<: *limits-job
    profiles: [ollama]
    image: "${MINOS_IMAGE}"
    entrypoint: [/bin/sh, -c]
    command:
      - |
        set -eu
        target=/home/ollama/.ollama
        if [ -n "$$(find "$$target" -xdev \( ! -user 10002 -o ! -group 10002 \) -print -quit)" ]; then
          chown -R 10002:10002 "$$target"
          echo "MINOS Ollama model volume ownership handed to uid 10002."
        else
          echo "MINOS Ollama model volume ownership already matches uid 10002."
        fi
    user: "0:0"
    init: true
    network_mode: none
    volumes:
      - type: volume
        source: minos-ollama-models
        target: /home/ollama/.ollama
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=16m,mode=1777
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER]
    security_opt: [no-new-privileges:true]
    restart: "no"
    labels:
      io.minos.installation: "${MINOS_COMPOSE_PROJECT}"
      io.minos.runtime-plane: semantic-bootstrap

  minos-ollama:
    <<: *limits-ollama
    profiles: [ollama]
    # The ONLY place that names this image (see minos-postgres). Gate: scripts/quality/check-image-pins.py.
    image: "${MINOS_OLLAMA_IMAGE:-ollama/ollama:0.32.0@sha256:57f573b47f1f71ebb445789f279fe3e596a8beab182f7cf486db9205bad87c5a}"
    # Unprivileged: no root inside the container, no capability, no privilege gain. HOME is the
    # only writable place Ollama needs besides /tmp, and it is the model volume itself.
    user: "10002:10002"
    depends_on:
      minos-ollama-bootstrap:
        condition: service_completed_successfully
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      HOME: /home/ollama
    volumes:
      - type: volume
        source: minos-ollama-models
        target: /home/ollama/.ollama
    networks: [minos-runtime]
    healthcheck:
      test: [CMD, ollama, list]
      interval: 5s
      timeout: 5s
      retries: 30
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=128m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    labels:
      io.minos.installation: "${MINOS_COMPOSE_PROJECT}"
      io.minos.runtime-plane: semantic

networks:
  minos-runtime:
    internal: true
    labels:
      io.minos.installation: "${MINOS_COMPOSE_PROJECT}"
      io.minos.network-policy: internal-only
  minos-admin-egress:
    labels:
      io.minos.installation: "${MINOS_COMPOSE_PROJECT}"
      io.minos.network-policy: admin-dependency-egress

volumes:
  minos-provider-tools:
    labels:
      io.minos.installation: "${MINOS_COMPOSE_PROJECT}"
      io.minos.runtime-plane: provider-tools
  minos-postgres-data:
    external: true
    name: "${MINOS_POSTGRES_VOLUME}"
  minos-ollama-models:
    external: true
    name: "${MINOS_OLLAMA_VOLUME}"
