version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 10
    groups:
      maven-runtime:
        dependency-type: "production"
      maven-development:
        dependency-type: "development"

  - package-ecosystem: "gradle"
    directory: "/minos-intellij"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:15"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 10
    groups:
      intellij-plugin-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:30"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns:
          - "*"

  # Base images of docker/Dockerfile.mcp and docker/Dockerfile.mcp.release, written as
  # <image>:<tag>@sha256:<digest> (enforced by scripts/quality/check-image-pins.py). Dependabot
  # follows the tag and rewrites tag and digest together; a reference with a digest and no tag
  # would be moved to `latest`. The compose files are covered by the docker-compose entry below.
  - package-ecosystem: "docker"
    directory: "/docker"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:45"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 10
    groups:
      docker-base-images:
        patterns:
          - "*"
    ignore:
      # The JRE/JDK major must match `maven.compiler.release` (24): a major bump is a deliberate change.
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major"]

  # Managed-service images (pgvector, ollama) are the ${VAR:-<image>:<tag>@sha256:<digest>} defaults of
  # docker/compose-mcp.connected.yaml. The docker-compose ecosystem only reads files named like
  # [docker-]compose[-x][.x].yaml (at most one dotted segment, FILENAME_REGEX of dependabot-core's
  # docker_compose/file_fetcher.rb): `compose-mcp.prod.yaml` and `compose-mcp.connected.yaml` are seen, the
  # former `compose.mcp.*.yaml` (two dotted segments) were not. scripts/quality/check-image-pins.py fails
  # if a compose file under docker/ is named outside that pattern or if this entry disappears.
  # It rewrites tag and digest together (and refreshes the digest of an unchanged tag); the tag suffix
  # (`-pg17`) is part of what it compares, so a PostgreSQL major is never proposed. It does not know the
  # reason for a bump: the PR must pass the qualification (docs/developer/supply-chain.md).
  - package-ecosystem: "docker-compose"
    directory: "/docker"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 10
    groups:
      docker-compose-images:
        patterns:
          - "*"
