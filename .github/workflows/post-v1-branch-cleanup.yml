name: Post-v1 branch cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/post-v1-branch-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    name: Delete stale merged branches
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Delete stale remote branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          branches=(
            'docs/m28-production-convergence-roadmap'
            'fix-hosted-token-tamper-determinism'
            'm21-production-integrity'
            'm21-s2-ci-hardening-august'
            'm21-s2-ci-recovery-august'
            'm21-s2-ci-recovery-main'
            'm28-post-merge-reconciliation'
            'pre-m28-audit-remediation'
            'release/v1.0.0'
            'release/v1.0.0-guard-fix'
            'chore/post-v1-cleanup'
          )

          for branch in "${branches[@]}"; do
            ref="repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}"
            if gh api "$ref" >/dev/null 2>&1; then
              echo "Deleting ${branch}"
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
            else
              echo "Already absent: ${branch}"
            fi
          done

      - name: Verify lifecycle branches remain
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.ref + " -> " + .object.sha'
          gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/develop" --jq '.ref + " -> " + .object.sha'
