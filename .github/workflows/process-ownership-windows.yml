name: Process Ownership Windows Validation

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'minos-intellij/**'
      - '.github/workflows/process-ownership-windows.yml'
  push:
    branches: [main, develop]
    paths:
      - 'minos-intellij/**'
      - '.github/workflows/process-ownership-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: process-ownership-windows-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  process-ownership-windows:
    name: Process ownership / Windows
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          gradle-version: '9.6.1'
          cache-provider: basic

      - name: Run process ownership tests
        working-directory: minos-intellij
        run: gradle --no-daemon test --tests com.minos.intellij.protocol.MinosProcessSupervisorTest

      - name: Print failing JUnit diagnostics
        if: failure()
        shell: powershell
        run: |
          Get-ChildItem -Path 'minos-intellij/build/test-results/test' -Filter '*.xml' -ErrorAction SilentlyContinue |
            ForEach-Object {
              Write-Host "===== $($_.FullName) ====="
              Get-Content -Raw $_.FullName
            }
