name: Post-audit final remediation validation

on:
  push:
    branches: [fix/post-audit-remediation-20260814]
    paths: [.github/workflows/post-audit-final-validation.yml]

permissions:
  contents: read

jobs:
  reactor:
    name: Full reactor (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/post-audit-remediation-20260814
          fetch-depth: 0
      - name: Set up Java 24
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '24'
          cache: maven
      - name: Set up Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Supply-chain, remediation and architecture gates
        run: |
          python scripts/quality/check-workflow-pins.py
          python scripts/remediation/check-p0-p2.py
          python scripts/remediation/check-minos-01.py
          python scripts/architecture/check-module-boundaries.py
      - name: Install and authorize Linux worker sandbox runtime
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap util-linux apparmor apparmor-profiles
          profile='/usr/share/apparmor/extra-profiles/bwrap-userns-restrict'
          test -f "$profile"
          sudo cp "$profile" /etc/apparmor.d/minos-bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/minos-bwrap-userns-restrict
          bash scripts/ci/delegate-linux-cgroup.sh
      - name: Maven clean verify (Linux, PostgreSQL required)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp -Dminos.postgresql.tests.required=true clean verify
          python scripts/quality/check-jacoco.py
          python scripts/docs/product-facts.py --check
      - name: Maven clean verify (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          .\mvnw.cmd -B -ntp clean verify
          python scripts/quality/check-jacoco.py --skip-scope m30-postgresql-pgvector
          python scripts/docs/product-facts.py --check

  npm-locks:
    name: Docker npm lockfile reproducibility
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/post-audit-remediation-20260814
          fetch-depth: 0
      - name: Verify lockfiles with npm ci
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version
          root="$RUNNER_TEMP/minos-npm-lock-validation"
          ts="$root/typescript"
          py="$root/python"
          mkdir -p "$ts" "$py"
          printf '{"private":true,"dependencies":{"@sourcegraph/scip-typescript":"0.4.0"}}\n' > "$ts/package.json"
          cp minos-provider-scip/src/main/resources/com/minos/adapter/scip/runtime/scip-typescript-package-lock.json "$ts/package-lock.json"
          npm ci --prefix "$ts" --no-audit --no-fund --ignore-scripts
          test -x "$ts/node_modules/.bin/scip-typescript"
          printf '{"private":true,"dependencies":{"@sourcegraph/scip-python":"0.6.6"}}\n' > "$py/package.json"
          cp minos-provider-scip/src/main/resources/com/minos/adapter/scip/runtime/scip-python-package-lock.json "$py/package-lock.json"
          npm ci --prefix "$py" --no-audit --no-fund --ignore-scripts
          test -x "$py/node_modules/.bin/scip-python"
          grep -F 'npm ci --prefix "$ts_root" --no-audit --no-fund --ignore-scripts' docker/Dockerfile.mcp.release
          grep -F 'npm ci --prefix "$py_root" --no-audit --no-fund --ignore-scripts' docker/Dockerfile.mcp.release

  intellij:
    name: IntelliJ plugin (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/post-audit-remediation-20260814
          fetch-depth: 0
      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          gradle-version: '9.6.1'
          cache-provider: basic
      - name: Test and verify plugin structure
        working-directory: minos-intellij
        run: gradle --no-daemon test buildPlugin verifyPluginProjectConfiguration verifyPluginStructure
      - name: Assert strong production launch contract
        shell: bash
        run: |
          grep -F 'MinosStrongProcessLauncher.start(builder, settings.minosHome)' minos-intellij/src/main/java/com/minos/intellij/protocol/MinosCliClient.java
          if grep -F 'new MinosProcessSupervisor(builder.start())' minos-intellij/src/main/java/com/minos/intellij/protocol/MinosCliClient.java; then
            exit 1
          fi
