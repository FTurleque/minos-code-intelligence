name: Report MINOS v1.0.1 publication status

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/report-v1.0.1-publication-status.yml'

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Report publication state to issue 106
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          runs="$(gh run list --repo "$repo" --workflow 'Publish MINOS v1.0.1 one-shot' --limit 5 --json databaseId,status,conclusion,headSha,url,createdAt,updatedAt 2>&1 || true)"
          tag="$(git ls-remote "https://github.com/$repo.git" refs/tags/v1.0.1 | awk '{print $1}' || true)"
          release="$(gh release view v1.0.1 --repo "$repo" --json name,tagName,targetCommitish,url,isDraft,isPrerelease,createdAt,publishedAt,assets,body 2>&1 || true)"
          body=$(cat <<EOF
          ## Publication v1.0.1 — diagnostic automatique détaillé

          Reporter run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          **Workflow de publication (5 derniers runs)**
          \`\`\`json
          $runs
          \`\`\`

          **Tag distant v1.0.1 (SHA brut)**
          \`\`\`
          ${tag:-<absent>}
          \`\`\`

          **GitHub Release v1.0.1 — métadonnées et assets avant remplacement éventuel**
          \`\`\`json
          $release
          \`\`\`
          EOF
          )
          gh issue comment 106 --repo "$repo" --body "$body"
