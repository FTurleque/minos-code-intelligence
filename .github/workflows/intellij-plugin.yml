name: IntelliJ Plugin Validation

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'minos-intellij/**'
      - 'minos-cli/**'
      - 'minos-integration-git/**'
      - 'docs/user/intellij-plugin.md'
      - 'docs/roadmap/M18_EXECUTION.md'
      - 'scripts/m18/**'
      - '.github/workflows/intellij-plugin.yml'
  push:
    branches: [main, develop]
    paths:
      - 'minos-intellij/**'
      - 'minos-cli/**'
      - 'minos-integration-git/**'
      - 'docs/user/intellij-plugin.md'
      - 'docs/roadmap/M18_EXECUTION.md'
      - 'scripts/m18/**'
      - '.github/workflows/intellij-plugin.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: intellij-plugin-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plugin:
    name: IntelliJ 2026.1 / Java 21
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          gradle-version: '9.6.1'
          cache-provider: basic

      - name: Verify no MINOS engine dependency leaks into plugin
        shell: bash
        run: |
          if grep -R --line-number --fixed-strings 'implementation("com.minos:' minos-intellij; then
            echo 'The IntelliJ plugin must remain an external client and cannot depend on com.minos:* artifacts.' >&2
            exit 1
          fi

      - name: Unit tests and plugin build
        working-directory: minos-intellij
        run: gradle --no-daemon test buildPlugin verifyPluginProjectConfiguration verifyPluginStructure

      - name: IntelliJ Plugin Verifier
        working-directory: minos-intellij
        run: gradle --no-daemon verifyPlugin

      - name: Upload plugin and verification reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6fb58ed0dc250532a479d7789f # v6
        with:
          name: minos-intellij-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 30
          path: |
            minos-intellij/build/distributions/*.zip
            minos-intellij/build/reports/**
            minos-intellij/build/test-results/**

  process-ownership-windows:
    name: Process ownership / Windows
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          gradle-version: '9.6.1'
          cache-provider: basic

      - name: Run process ownership tests
        working-directory: minos-intellij
        run: gradle --no-daemon test --tests com.minos.intellij.protocol.MinosProcessSupervisorTest

      - name: Upload process ownership reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: minos-intellij-process-ownership-windows-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 30
          path: |
            minos-intellij/build/reports/tests/**
            minos-intellij/build/test-results/**

  m18-final-windows:
    name: M18 final Windows exact-head gate
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/m18-minos-intellij'
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout exact M18 head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Java 24
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '24'

      - name: Set up Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          gradle-version: '9.6.1'
          cache-provider: basic

      - name: Run complete M18 exact-head qualification
        shell: powershell
        run: .\scripts\m18\run-final.ps1 -ExpectedHead '${{ github.event.pull_request.head.sha }}'

      - name: Upload M18 final diagnostics and plugin ZIP
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: m18-final-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 30
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
            target/site/jacoco-aggregate/**
            minos-intellij/build/distributions/*.zip
            minos-intellij/build/reports/**
            minos-intellij/build/test-results/**
