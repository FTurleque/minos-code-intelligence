name: IntelliJ Plugin Validation

on:
  # No `paths:` filter here on purpose (AUD-DEP-09): a required check of a path-filtered workflow stays pending on
  # every pull request that does not touch those paths. The `changes` job computes the plugin scope instead
  # (scripts/ci/plugin-gate.py) and the `gate` job always reports a verdict.
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: intellij-plugin-${{ github.event.pull_request.number || github.ref }}
  # Never cancel a push-triggered run on develop/main: only a duplicate PR run is obsolete.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Plugin scope
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      plugin: ${{ steps.scope.outputs.plugin }}

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      # Is the plugin concerned by this change? Any doubt answers "true" (the plugin is then tested).
      - name: Compute the plugin scope
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/ci/plugin-gate.py scope --event "$EVENT" --base "$BASE" --head "$HEAD" --output "$GITHUB_OUTPUT"

  plugin:
    needs: changes
    if: ${{ needs.changes.outputs.plugin == 'true' }}
    name: IntelliJ 2026.1 / Java 21
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      # MINOS-AUD-H09 : la version vient du wrapper (minos-intellij/gradle/wrapper, SHA-256 de la distribution
      # vérifié) ; setup-gradle valide aussi le gradle-wrapper.jar contre les sommes publiées par Gradle.
      - name: Set up Gradle (wrapper)
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          cache-provider: basic

      - name: Verify no MINOS engine dependency leaks into plugin
        shell: bash
        run: |
          if grep -R --line-number --fixed-strings 'implementation("com.minos:' minos-intellij; then
            echo 'The IntelliJ plugin must remain an external client and cannot depend on com.minos:* artifacts.' >&2
            exit 1
          fi

      - name: Unit tests and plugin build
        working-directory: minos-intellij
        run: ./gradlew --no-daemon test buildPlugin verifyPluginProjectConfiguration verifyPluginStructure

      - name: IntelliJ Plugin Verifier
        working-directory: minos-intellij
        run: ./gradlew --no-daemon verifyPlugin

      - name: Upload plugin and verification reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: minos-intellij-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 30
          path: |
            minos-intellij/build/distributions/*.zip
            minos-intellij/build/reports/**
            minos-intellij/build/test-results/**

  windows-ownership:
    needs: changes
    if: ${{ needs.changes.outputs.plugin == 'true' }}
    name: Windows process ownership / Java 21
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      # MINOS-AUD-H09 : la version vient du wrapper (minos-intellij/gradle/wrapper, SHA-256 de la distribution
      # vérifié) ; setup-gradle valide aussi le gradle-wrapper.jar contre les sommes publiées par Gradle.
      - name: Set up Gradle (wrapper)
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          cache-provider: basic

      - name: Run IntelliJ unit tests on Windows
        working-directory: minos-intellij
        shell: pwsh
        run: ./gradlew.bat --no-daemon test

      - name: Upload Windows ownership diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: minos-intellij-windows-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 30
          path: |
            minos-intellij/build/reports/**
            minos-intellij/build/test-results/**

  # Always runs and is the only plugin check meant to be required: it passes when the plugin is out of scope
  # (jobs skipped) and fails when a job it waited for failed, was cancelled, or was skipped although it was needed.
  gate:
    name: IntelliJ plugin (gate)
    if: ${{ always() }}
    needs: [changes, plugin, windows-ownership]
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Decide the plugin gate
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          SCOPE: ${{ needs.changes.outputs.plugin }}
          PLUGIN_RESULT: ${{ needs.plugin.result }}
          WINDOWS_RESULT: ${{ needs.windows-ownership.result }}
        run: >-
          python scripts/ci/plugin-gate.py verdict --changes "$CHANGES_RESULT" --scope "$SCOPE"
          --plugin "$PLUGIN_RESULT" --windows-ownership "$WINDOWS_RESULT"
