name: IntelliJ Plugin Validation

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'minos-intellij/**'
      - 'minos-cli/**'
      - 'minos-integration-git/**'
      - 'docs/user/intellij-plugin.md'
      - 'docs/roadmap/M18_EXECUTION.md'
      - 'scripts/m18/**'
      - '.github/workflows/intellij-plugin.yml'
  push:
    branches: [main, develop]
    paths:
      - 'minos-intellij/**'
      - 'minos-cli/**'
      - 'minos-integration-git/**'
      - 'docs/user/intellij-plugin.md'
      - 'docs/roadmap/M18_EXECUTION.md'
      - 'scripts/m18/**'
      - '.github/workflows/intellij-plugin.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: intellij-plugin-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plugin:
    name: IntelliJ 2026.1 / Java 21
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          gradle-version: '9.6.1'
          cache-provider: basic

      - name: Verify no MINOS engine dependency leaks into plugin
        shell: bash
        run: |
          if grep -R --line-number --fixed-strings 'implementation("com.minos:' minos-intellij; then
            echo 'The IntelliJ plugin must remain an external client and cannot depend on com.minos:* artifacts.' >&2
            exit 1
          fi

      - name: Unit tests and plugin build
        working-directory: minos-intellij
        run: gradle --no-daemon test buildPlugin verifyPluginProjectConfiguration verifyPluginStructure

      - name: IntelliJ Plugin Verifier
        working-directory: minos-intellij
        run: gradle --no-daemon verifyPlugin

      - name: Upload plugin and verification reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: minos-intellij-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 30
          path: |
            minos-intellij/build/distributions/*.zip
            minos-intellij/build/reports/**
            minos-intellij/build/test-results/**

  windows-ownership:
    name: Windows process ownership / Java 21
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          gradle-version: '9.6.1'
          cache-provider: basic

      - name: Run IntelliJ unit tests on Windows
        working-directory: minos-intellij
        shell: pwsh
        run: gradle --no-daemon test

      - name: Upload Windows ownership diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: minos-intellij-windows-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 30
          path: |
            minos-intellij/build/reports/**
            minos-intellij/build/test-results/**
