name: Temporary managed-provider ownership patch

on:
  push:
    branches: [fix/post-audit-p2-followup-20260814]
    paths: [.github/workflows/post-audit-source-patch.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/post-audit-p2-followup-20260814
          fetch-depth: 0
      - name: Surface required ownership capability in all managed SCIP runtime statuses
        shell: python
        run: |
          from pathlib import Path

          java = Path('minos-provider-scip/src/main/java/com/minos/adapter/scip/runtime/ManagedScipProviderRuntimeManager.java')
          python = Path('minos-provider-scip/src/main/java/com/minos/adapter/scip/runtime/ManagedScipPythonRuntimeManager.java')
          poly = Path('minos-provider-scip/src/main/java/com/minos/adapter/scip/runtime/ManagedPolyglotScipRuntimeManager.java')

          def replace_once(path, before, after):
              text = path.read_text(encoding='utf-8')
              count = text.count(before)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}')
              path.write_text(text.replace(before, after, 1), encoding='utf-8')

          replace_once(java,
          '''    public ProviderRuntimeStatus inspect(String providerId) {
                  return switch (providerId) {
                      case SCIP_TYPESCRIPT_ID -> inspectTypeScript();
                      case SCIP_JAVA_ID -> inspectJava();
                      default -> throw new IllegalArgumentException("unknown managed provider: " + providerId);
                  };
              }
          ''',
          '''    public ProviderRuntimeStatus inspect(String providerId) {
                  ProviderRuntimeStatus status = switch (providerId) {
                      case SCIP_TYPESCRIPT_ID -> inspectTypeScript();
                      case SCIP_JAVA_ID -> inspectJava();
                      default -> throw new IllegalArgumentException("unknown managed provider: " + providerId);
                  };
                  return StrongOwnedProcessExecutors.qualifyOwnership(status, home);
              }
          ''')

          replace_once(python,
          '''        return new ProviderRuntimeStatus(PROVIDER_ID, VERSION, state,
                          installed ? Optional.of(executable) : Optional.empty(), diagnostics, false);
          ''',
          '''        ProviderRuntimeStatus status = new ProviderRuntimeStatus(PROVIDER_ID, VERSION, state,
                          installed ? Optional.of(executable) : Optional.empty(), diagnostics, false);
                  return StrongOwnedProcessExecutors.qualifyOwnership(status, home);
          ''')

          replace_once(poly,
          '''    public ProviderRuntimeStatus inspect(String providerId) {
                  return switch (requireProvider(providerId)) {
                      case ScipIndexerCatalog.SCIP_CLANG_ID -> inspectClang();
                      case ScipIndexerCatalog.SCIP_DOTNET_ID -> inspectDotnet();
                      case ScipIndexerCatalog.SCIP_GO_ID -> inspectGo();
                      case ScipIndexerCatalog.RUST_ANALYZER_SCIP_ID -> inspectRust();
                      default -> throw new IllegalArgumentException("unsupported polyglot provider: " + providerId);
                  };
              }
          ''',
          '''    public ProviderRuntimeStatus inspect(String providerId) {
                  ProviderRuntimeStatus status = switch (requireProvider(providerId)) {
                      case ScipIndexerCatalog.SCIP_CLANG_ID -> inspectClang();
                      case ScipIndexerCatalog.SCIP_DOTNET_ID -> inspectDotnet();
                      case ScipIndexerCatalog.SCIP_GO_ID -> inspectGo();
                      case ScipIndexerCatalog.RUST_ANALYZER_SCIP_ID -> inspectRust();
                      default -> throw new IllegalArgumentException("unsupported polyglot provider: " + providerId);
                  };
                  return StrongOwnedProcessExecutors.qualifyOwnership(status, home);
              }
          ''')
      - name: Commit exact source transformation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add minos-provider-scip/src/main/java/com/minos/adapter/scip/runtime/ManagedScipProviderRuntimeManager.java \
                  minos-provider-scip/src/main/java/com/minos/adapter/scip/runtime/ManagedScipPythonRuntimeManager.java \
                  minos-provider-scip/src/main/java/com/minos/adapter/scip/runtime/ManagedPolyglotScipRuntimeManager.java
          git diff --cached --check
          git commit -m "fix: surface strong ownership capability in managed runtimes"
          git push origin HEAD:fix/post-audit-p2-followup-20260814
