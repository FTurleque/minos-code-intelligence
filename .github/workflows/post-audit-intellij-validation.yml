name: Post-audit IntelliJ ownership validation

on:
  push:
    branches: [fix/post-audit-remediation-20260814]
    paths: [.github/workflows/post-audit-intellij-validation.yml]

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/post-audit-remediation-20260814
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          gradle-version: '9.6.1'
          cache-provider: basic

      - name: Unit tests and plugin structure
        working-directory: minos-intellij
        run: gradle --no-daemon test buildPlugin verifyPluginProjectConfiguration verifyPluginStructure

      - name: Assert production launch is strong
        shell: bash
        run: |
          grep -F 'MinosStrongProcessLauncher.start(builder, settings.minosHome)' minos-intellij/src/main/java/com/minos/intellij/protocol/MinosCliClient.java
          if grep -F 'new MinosProcessSupervisor(builder.start())' minos-intellij/src/main/java/com/minos/intellij/protocol/MinosCliClient.java; then
            echo 'Production IntelliJ launch still bypasses strong ownership.' >&2
            exit 1
          fi
