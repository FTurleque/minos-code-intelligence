name: Temporary Sonar Diagnostics

# TEMPORARY. Exists only on the throwaway validation branch for PR #198 so the cumulative
# SonarQube Cloud quality gate can be read against main. Never merge this workflow.

on:
  push:
    branches:
      - agent/validate-sonar-main-5-20260815
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Query SonarQube Cloud diagnostics APIs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone

          SONAR = "https://sonarcloud.io"
          PROJECT = "FTurleque_atlas"
          PR = "198"
          REPO = "FTurleque/minos-code-intelligence"

          started = datetime.now(timezone.utc)

          def json_get(url, headers=None):
              request = urllib.request.Request(url, headers=headers or {})
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  if error.code in (403, 404):
                      return None
                  raise

          def sonar_get(path, params):
              return json_get(SONAR + path + "?" + urllib.parse.urlencode(params))

          def parse_analysis_date(value):
              if not value:
                  return None
              # SonarQube emits e.g. 2026-08-15T17:28:08+0000
              try:
                  return datetime.strptime(value, "%Y-%m-%dT%H:%M:%S%z")
              except ValueError:
                  return None

          # 1. Wait for an analysis newer than this job, so we never grade a stale scan.
          analysis_date = None
          for attempt in range(60):
              listing = sonar_get("/api/project_pull_requests/list", {"project": PROJECT}) or {}
              entry = next(
                  (item for item in listing.get("pullRequests", []) if str(item.get("key")) == PR),
                  None,
              )
              analysis_date = parse_analysis_date((entry or {}).get("analysisDate"))
              if analysis_date and analysis_date >= started:
                  print(f"fresh analysis available: {analysis_date.isoformat()}")
                  break
              print(f"attempt {attempt + 1}: analysis={analysis_date} started={started.isoformat()} - waiting")
              time.sleep(20)
          else:
              print("WARNING: timed out waiting for a fresh analysis; reporting whatever is current")

          # 2. Quality gate verdict, condition by condition.
          status = sonar_get("/api/qualitygates/project_status", {
              "projectKey": PROJECT,
              "pullRequest": PR,
          }) or {}
          print("=== QUALITY GATE ===")
          print(json.dumps(status.get("projectStatus", {}), indent=2, sort_keys=True))

          # 3. The new-code measures the gate is graded on.
          metrics = [
              "new_duplicated_lines_density",
              "new_duplicated_lines",
              "new_lines",
              "new_reliability_rating",
              "new_security_rating",
              "new_maintainability_rating",
              "new_bugs",
              "new_vulnerabilities",
              "new_violations",
              "new_security_hotspots",
              "new_coverage",
          ]
          measures = sonar_get("/api/measures/component", {
              "component": PROJECT,
              "pullRequest": PR,
              "metricKeys": ",".join(metrics),
          }) or {}
          print("=== NEW CODE MEASURES ===")
          print(json.dumps({
              measure.get("metric"): (measure.get("period") or {}).get("value", measure.get("value"))
              for measure in (measures.get("component", {}) or {}).get("measures", [])
          }, indent=2, sort_keys=True))

          # 4. Every unresolved vulnerability, so Security A is proven rather than assumed.
          issues = sonar_get("/api/issues/search", {
              "componentKeys": PROJECT,
              "pullRequest": PR,
              "types": "VULNERABILITY",
              "resolved": "false",
              "ps": "500",
          }) or {}
          print("=== VULNERABILITIES ===")
          print(json.dumps({
              "total": issues.get("total", 0),
              "issues": [
                  {
                      "key": issue.get("key"),
                      "rule": issue.get("rule"),
                      "severity": issue.get("severity"),
                      "component": issue.get("component"),
                      "line": issue.get("line"),
                      "message": issue.get("message"),
                  }
                  for issue in issues.get("issues", [])
              ],
          }, indent=2, sort_keys=True))

          # 5. Every unresolved bug, so Reliability A is proven rather than assumed.
          bugs = sonar_get("/api/issues/search", {
              "componentKeys": PROJECT,
              "pullRequest": PR,
              "types": "BUG",
              "resolved": "false",
              "ps": "500",
          }) or {}
          print("=== BUGS ===")
          print(json.dumps({
              "total": bugs.get("total", 0),
              "issues": [
                  {
                      "key": issue.get("key"),
                      "rule": issue.get("rule"),
                      "severity": issue.get("severity"),
                      "component": issue.get("component"),
                      "line": issue.get("line"),
                      "message": issue.get("message"),
                  }
                  for issue in bugs.get("issues", [])
              ],
          }, indent=2, sort_keys=True))

          # 6. CPD blocks for the Java files this PR actually touches, ranked by duplicated lines.
          token = os.environ["GH_TOKEN"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": "Bearer " + token,
              "X-GitHub-Api-Version": "2022-11-28",
          }
          changed = []
          page = 1
          while True:
              batch = json_get(
                  f"https://api.github.com/repos/{REPO}/pulls/{PR}/files?per_page=100&page={page}",
                  headers,
              ) or []
              changed.extend(item["filename"] for item in batch if item.get("filename", "").endswith(".java"))
              if len(batch) < 100:
                  break
              page += 1

          rows = []
          for path in changed:
              data = sonar_get("/api/duplications/show", {
                  "key": PROJECT + ":" + path,
                  "pullRequest": PR,
              })
              if not data or not data.get("duplications"):
                  continue
              block_lines = 0
              groups = []
              for duplication in data.get("duplications", []):
                  group = []
                  for occurrence in duplication.get("blocks", []):
                      size = int(occurrence.get("size", 0) or 0)
                      block_lines += size
                      group.append({
                          "from": occurrence.get("from"),
                          "size": size,
                          "_ref": occurrence.get("_ref"),
                      })
                  groups.append(group)
              files = {
                  ref: value.get("key")
                  for ref, value in (data.get("files") or {}).items()
              }
              rows.append({
                  "path": path,
                  "reported_block_lines": block_lines,
                  "duplications": groups,
                  "files": files,
              })

          rows.sort(key=lambda row: (-row["reported_block_lines"], row["path"]))
          print("=== CPD BLOCKS FOR GITHUB-CHANGED JAVA FILES ===")
          print(json.dumps(rows, indent=2, sort_keys=True))
          PY
