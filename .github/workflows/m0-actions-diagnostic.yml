name: M0 GitHub Actions Diagnostic

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/m0-actions-diagnostic.yml'

permissions:
  contents: read

jobs:
  linux:
    name: Linux runner probe
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Set up Java 24
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '24'
      - name: Set up Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Probe runner
        shell: bash
        run: |
          set -euo pipefail
          echo "RUNNER_OS=$RUNNER_OS"
          uname -a
          java -version
          python --version
          git --version
          docker version || true
          git rev-parse HEAD
      - name: Upload diagnostic marker
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: m0-linux-${{ github.sha }}-${{ github.run_attempt }}
          retention-days: 7
          path: .github/workflows/m0-actions-diagnostic.yml

  windows:
    name: Windows runner probe
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Set up Java 24
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '24'
      - name: Set up Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Probe runner
        shell: powershell
        run: |
          Write-Host "RUNNER_OS=$env:RUNNER_OS"
          Get-ComputerInfo | Select-Object WindowsProductName, WindowsVersion, OsBuildNumber
          java -version
          python --version
          git --version
          docker version
          git rev-parse HEAD
      - name: Upload diagnostic marker
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: m0-windows-${{ github.sha }}-${{ github.run_attempt }}
          retention-days: 7
          path: .github/workflows/m0-actions-diagnostic.yml
