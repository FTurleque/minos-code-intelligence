name: Sync post-audit remediation branch

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/sync-post-audit-remediation.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_BRANCH: agent/post-audit-remediation
    steps:
      - name: Merge current develop into remediation branch
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git config user.name 'MINOS Branch Sync'
          git config user.email 'actions@users.noreply.github.com'
          git config core.autocrlf false
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags origin develop "${TARGET_BRANCH}"
          git checkout -B "${TARGET_BRANCH}" "origin/${TARGET_BRANCH}"
          git merge --no-edit origin/develop
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
