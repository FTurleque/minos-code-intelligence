name: MNC remediation one-shot
# staging-revision: 4

on:
  pull_request:
    branches: [develop]
    paths:
      - .github/workflows/mnc-remediation-once.yml

permissions:
  contents: write

concurrency:
  group: mnc-remediation-once-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  remediate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact remediation staging head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Assert branch and exact staging head
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BRANCH: fix/mnc-complete-remediation
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "${{ github.event.pull_request.head.ref }}" = "$EXPECTED_BRANCH"
          test "$(git merge-base HEAD origin/develop)" = "ea98e615681fd1df61de04418518fb8bb02adf26"

      - name: Set up Java 24
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '24'
          cache: maven

      - name: Set up Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Install Linux sandbox qualification runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap util-linux apparmor apparmor-profiles
          profile='/usr/share/apparmor/extra-profiles/bwrap-userns-restrict'
          if [ -f "$profile" ]; then
            sudo cp "$profile" /etc/apparmor.d/minos-bwrap-userns-restrict
            sudo apparmor_parser -r /etc/apparmor.d/minos-bwrap-userns-restrict
          fi

      - name: Apply MNC production fixes
        shell: bash
        run: |
          set -euo pipefail
          python scripts/remediation/repair-mnc-staging.py
          python scripts/remediation/apply-mnc-core.py
          python scripts/remediation/apply-mnc-bounds.py
          python scripts/remediation/apply-mnc-supply-lifecycle.py
          python scripts/remediation/generate-mnc-npm-locks.py
          python scripts/remediation/add-mnc-regression-tests.py
          python scripts/remediation/finalize-mnc-staging.py

      - name: Reject forbidden residual patterns
        shell: bash
        run: |
          set -euo pipefail
          ! grep -F 'sandbox.add("/");' minos-runtime-local/src/main/java/com/minos/runtime/LinuxBubblewrapWorkerSandboxBackend.java
          ! grep -F 'Files.readAllBytes(manifestFile)' minos-runtime-local/src/main/java/com/minos/runtime/DistributedArtifactBundleStore.java
          ! grep -F 'return run(MinosApplication.open(home)' minos-cli/src/main/java/com/minos/cli/MinosCliRunner.java
          grep -F 'registerProjectWithResult' minos-cli/src/main/java/com/minos/cli/LocalRemoteIndexOperations.java
          grep -F 'npm, "ci"' minos-provider-scip/src/main/java/com/minos/adapter/scip/runtime/ManagedScipProviderRuntimeManager.java
          grep -F '"ci",' minos-provider-scip/src/main/java/com/minos/adapter/scip/runtime/ManagedScipPythonRuntimeManager.java

      - name: Static repository gates before Maven
        shell: bash
        run: |
          set -euo pipefail
          python scripts/quality/check-workflow-pins.py
          python scripts/remediation/check-p0-p2.py
          python scripts/architecture/check-module-boundaries.py
          python scripts/docs/product-facts.py --check
          git diff --check

      - name: Maven clean verify
        id: maven
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          chmod +x mvnw
          ./mvnw -B -ntp clean verify 2>&1 | tee /tmp/mnc-maven.log
          exit ${PIPESTATUS[0]}

      - name: Publish concise Maven failure diagnostic
        if: steps.maven.outcome == 'failure'
        shell: bash
        env:
          TARGET_BRANCH: fix/mnc-complete-remediation
        run: |
          set -euo pipefail
          {
            echo "MNC Maven failure diagnostic"
            echo "staging-head=${{ github.event.pull_request.head.sha }}"
            echo
            echo "--- Maven error lines ---"
            grep -E '^\[ERROR\]|^Caused by:|Tests run: .*Failures: [1-9]|Tests run: .*Errors: [1-9]' /tmp/mnc-maven.log | tail -n 160 || true
            echo
            echo "--- Maven tail ---"
            tail -n 220 /tmp/mnc-maven.log
          } > mnc-ci-failure.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mnc-ci-failure.txt
          git commit -m 'chore: capture MNC Maven failure diagnostic'
          git push origin "HEAD:${TARGET_BRANCH}"
          exit 1

      - name: Targeted JaCoCo gate
        shell: bash
        run: python scripts/quality/check-jacoco.py

      - name: Remove one-shot staging artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/mnc-integrity-probe.yml
          rm -f .github/workflows/mnc-remediation-once.yml
          rm -f scripts/remediation/apply-mnc-core.py
          rm -f scripts/remediation/apply-mnc-bounds.py
          rm -f scripts/remediation/apply-mnc-supply-lifecycle.py
          rm -f scripts/remediation/generate-mnc-npm-locks.py
          rm -f scripts/remediation/add-mnc-regression-tests.py
          rm -f scripts/remediation/finalize-mnc-staging.py
          rm -f scripts/remediation/repair-mnc-staging.py
          rm -f mnc-ci-failure.txt
          git diff --check

      - name: Commit and push qualified remediation
        shell: bash
        env:
          TARGET_BRANCH: fix/mnc-complete-remediation
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No remediation changes were produced' >&2
            exit 1
          fi
          git commit -m 'fix: complete MNC audit remediation'
          git push origin "HEAD:${TARGET_BRANCH}"
