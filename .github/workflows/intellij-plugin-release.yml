name: Publish IntelliJ Plugin

on:
  release:
    types: [published]

# The default token is read-only for every job. Only the publish job, which does nothing but
# download the already-built plugin artifact and attach it to the release, escalates to
# contents: write. Resolving the release commit and building the plugin never run with a
# privileged token.
permissions:
  contents: read

concurrency:
  group: intellij-plugin-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  build:
    name: Resolve release commit and build IntelliJ plugin (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      commit: ${{ steps.resolve.outputs.commit }}
      zip_name: ${{ steps.artifact.outputs.name }}

    steps:
      - name: Resolve and verify the release's immutable commit
        id: resolve
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
          TARGET: ${{ github.event.release.target_commitish }}
        run: |
          set -euo pipefail
          # A release must record the exact commit it represents, not a mutable branch name: a tag
          # reference alone is weaker than a resolved-and-verified SHA if the tag can later be
          # moved or recreated to point somewhere else.
          if ! printf '%s' "$TARGET" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "Release target_commitish is not a resolved 40-character commit SHA: '$TARGET'. Refusing to build from a mutable reference." >&2
            exit 1
          fi
          REF_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}")"
          OBJECT_SHA="$(printf '%s' "$REF_JSON" | jq -r '.object.sha')"
          OBJECT_TYPE="$(printf '%s' "$REF_JSON" | jq -r '.object.type')"
          if [ "$OBJECT_TYPE" = "tag" ]; then
            # Annotated tag: peel the tag object to the commit it actually points at.
            OBJECT_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${OBJECT_SHA}" | jq -r '.object.sha')"
          fi
          if [ -z "$OBJECT_SHA" ] || [ "$OBJECT_SHA" = "null" ]; then
            echo "Unable to resolve git tag $TAG to a commit." >&2
            exit 1
          fi
          if [ "$OBJECT_SHA" != "$TARGET" ]; then
            echo "Git tag $TAG currently resolves to commit $OBJECT_SHA but the published release records target commit $TARGET. Refusing to build a possibly-moved tag." >&2
            exit 1
          fi
          echo "commit=$TARGET" >> "$GITHUB_OUTPUT"

      - name: Checkout the exact verified release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.resolve.outputs.commit }}
          fetch-depth: 0

      - name: Confirm exact-head
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ steps.resolve.outputs.commit }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          if [ "$head" != "$EXPECTED_COMMIT" ]; then
            echo "Exact-head mismatch: checked out $head, expected $EXPECTED_COMMIT" >&2
            exit 1
          fi
          echo "Building IntelliJ plugin from verified commit $head (tag $TAG)"

      - name: Set up Java 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          gradle-version: '9.6.1'
          cache-provider: basic

      - name: Resolve plugin version from release tag
        id: version
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="$(printf '%s' "$TAG" | sed -E 's/^[^0-9]*//')"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$TAG" ] && ! printf '%s' "$VERSION" | grep -Eq '^[0-9]'; then
            echo "Cannot derive a numeric plugin version from release tag: $TAG" >&2
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build and verify plugin
        working-directory: minos-intellij
        env:
          MINOS_VERSION: ${{ steps.version.outputs.value }}
        run: >-
          gradle --no-daemon
          "-PminosVersion=$MINOS_VERSION"
          test buildPlugin verifyPluginProjectConfiguration verifyPluginStructure verifyPlugin

      - name: Create SHA-256 checksum
        id: artifact
        shell: bash
        run: |
          ZIP="$(find minos-intellij/build/distributions -maxdepth 1 -type f -name '*.zip' -print -quit)"
          if [ -z "$ZIP" ]; then
            echo 'IntelliJ plugin ZIP was not produced.' >&2
            exit 1
          fi
          sha256sum "$ZIP" > "$ZIP.sha256"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "checksum=$ZIP.sha256" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$ZIP")" >> "$GITHUB_OUTPUT"

      - name: Publier le plugin vérifié pour le job de publication
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: intellij-plugin-${{ github.event.release.tag_name }}
          if-no-files-found: error
          retention-days: 1
          path: |
            ${{ steps.artifact.outputs.zip }}
            ${{ steps.artifact.outputs.checksum }}

  publish:
    name: Attach verified plugin to GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Télécharger le plugin déjà construit et vérifié
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: intellij-plugin-${{ github.event.release.tag_name }}

      - name: Attach plugin to GitHub Release
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
          ZIP_NAME: ${{ needs.build.outputs.zip_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          # No --clobber on this nominal path: a release is expected to receive each asset exactly
          # once, and silently replacing an existing asset would undermine release immutability. A
          # genuine recovery from a partially failed run is a deliberate, separate, manual action
          # (re-run with `gh release upload "$TAG" "$ZIP_NAME" "$ZIP_NAME.sha256" --clobber --repo
          # "$REPOSITORY"`), never an automatic part of this workflow.
          gh release upload "$TAG" "$ZIP_NAME" "$ZIP_NAME.sha256" --repo "$REPOSITORY"
