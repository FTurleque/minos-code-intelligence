name: Publish IntelliJ Plugin

# AUD-DEP-07: a release created by release-windows.yml with the workflow token triggers no `release:` event, so the
# plugin is attached by a call of that workflow (workflow_call), never by an event. workflow_dispatch replays the
# attachment for an existing release (a release created by hand, or a failed call); the commit is then read on the
# release. There is no `release:` trigger: it would attach the plugin a second time (check-ci-wiring.py, rule 5).
on:
  workflow_call:
    inputs:
      tag:
        description: 'Tag of the published release, for example v1.3.0'
        required: true
        type: string
      commit:
        description: 'Commit the caller published the release on (40-character SHA)'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag d'une release publiée à laquelle attacher le plugin, par exemple v1.3.0"
        required: true
        type: string

# The default token is read-only for every job. Only the publish job, which does nothing but
# download the already-built plugin artifact and attach it to the release, escalates to
# contents: write. Resolving the release commit and building the plugin never run with a
# privileged token.
permissions:
  contents: read

concurrency:
  group: intellij-plugin-release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  build:
    name: Resolve release commit and build IntelliJ plugin (read-only)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      commit: ${{ steps.resolve.outputs.commit }}
      zip_name: ${{ steps.artifact.outputs.name }}

    steps:
      - name: Resolve and verify the release's immutable commit
        id: resolve
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          # Empty on a workflow_dispatch replay: the commit is then the one recorded on the release.
          EXPECTED_COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          # The tag names a GitHub API path below: a release tag of this repository, nothing else.
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "Not a release tag of this repository: '$TAG' (expected vX.Y.Z or vX.Y.Z-suffix)." >&2
            exit 1
          fi
          TARGET="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq '.targetCommitish')"
          if [ -n "$EXPECTED_COMMIT" ] && [ "$TARGET" != "$EXPECTED_COMMIT" ]; then
            echo "Release $TAG records target commit '$TARGET' but the release workflow published it on $EXPECTED_COMMIT." >&2
            exit 1
          fi
          # A release must record the exact commit it represents, not a mutable branch name: a tag
          # reference alone is weaker than a resolved-and-verified SHA if the tag can later be
          # moved or recreated to point somewhere else.
          if ! printf '%s' "$TARGET" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "Release target_commitish is not a resolved 40-character commit SHA: '$TARGET'. Refusing to build from a mutable reference." >&2
            exit 1
          fi
          REF_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}")"
          OBJECT_SHA="$(printf '%s' "$REF_JSON" | jq -r '.object.sha')"
          OBJECT_TYPE="$(printf '%s' "$REF_JSON" | jq -r '.object.type')"
          if [ "$OBJECT_TYPE" = "tag" ]; then
            # Annotated tag: peel the tag object to the commit it actually points at.
            OBJECT_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${OBJECT_SHA}" | jq -r '.object.sha')"
          fi
          if [ -z "$OBJECT_SHA" ] || [ "$OBJECT_SHA" = "null" ]; then
            echo "Unable to resolve git tag $TAG to a commit." >&2
            exit 1
          fi
          if [ "$OBJECT_SHA" != "$TARGET" ]; then
            echo "Git tag $TAG currently resolves to commit $OBJECT_SHA but the published release records target commit $TARGET. Refusing to build a possibly-moved tag." >&2
            exit 1
          fi
          echo "commit=$TARGET" >> "$GITHUB_OUTPUT"

      - name: Checkout the exact verified release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ steps.resolve.outputs.commit }}
          fetch-depth: 0

      - name: Confirm exact-head
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ steps.resolve.outputs.commit }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          if [ "$head" != "$EXPECTED_COMMIT" ]; then
            echo "Exact-head mismatch: checked out $head, expected $EXPECTED_COMMIT" >&2
            exit 1
          fi
          echo "Building IntelliJ plugin from verified commit $head (tag $TAG)"

      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      # MINOS-AUD-H09 / AUD-DEP-05 : la version vient du wrapper (minos-intellij/gradle/wrapper, SHA-256 de la
      # distribution vérifié), comme dans intellij-plugin.yml ; setup-gradle ne sert qu'au cache et valide aussi le
      # gradle-wrapper.jar contre les sommes publiées par Gradle. Aucun gradle-version (check-toolchain-baseline.py).
      - name: Set up Gradle (wrapper)
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          cache-provider: basic

      - name: Resolve plugin version from release tag
        id: version
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          VERSION="$(printf '%s' "$TAG" | sed -E 's/^[^0-9]*//')"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$TAG" ] && ! printf '%s' "$VERSION" | grep -Eq '^[0-9]'; then
            echo "Cannot derive a numeric plugin version from release tag: $TAG" >&2
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build and verify plugin
        working-directory: minos-intellij
        env:
          MINOS_VERSION: ${{ steps.version.outputs.value }}
        run: >-
          ./gradlew --no-daemon
          "-PminosVersion=$MINOS_VERSION"
          test buildPlugin verifyPluginProjectConfiguration verifyPluginStructure verifyPlugin

      - name: Create SHA-256 checksum
        id: artifact
        shell: bash
        run: |
          ZIP="$(find minos-intellij/build/distributions -maxdepth 1 -type f -name '*.zip' -print -quit)"
          if [ -z "$ZIP" ]; then
            echo 'IntelliJ plugin ZIP was not produced.' >&2
            exit 1
          fi
          sha256sum "$ZIP" > "$ZIP.sha256"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "checksum=$ZIP.sha256" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$ZIP")" >> "$GITHUB_OUTPUT"

      - name: Publier le plugin vérifié pour le job de publication
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: intellij-plugin-${{ inputs.tag }}
          if-no-files-found: error
          retention-days: 1
          path: |
            ${{ steps.artifact.outputs.zip }}
            ${{ steps.artifact.outputs.checksum }}

  publish:
    name: Attach verified plugin to GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Télécharger le plugin déjà construit et vérifié
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: intellij-plugin-${{ inputs.tag }}

      - name: Attach plugin to GitHub Release
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          ZIP_NAME: ${{ needs.build.outputs.zip_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          # No --clobber on this nominal path: a release is expected to receive each asset exactly
          # once, and silently replacing an existing asset would undermine release immutability. A
          # genuine recovery from a partially failed run is a deliberate, separate, manual action
          # (re-run with `gh release upload "$TAG" "$ZIP_NAME" "$ZIP_NAME.sha256" --clobber --repo
          # "$REPOSITORY"`), never an automatic part of this workflow.
          gh release upload "$TAG" "$ZIP_NAME" "$ZIP_NAME.sha256" --repo "$REPOSITORY"
