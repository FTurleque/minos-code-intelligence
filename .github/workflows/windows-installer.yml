name: Windows Installer Validation

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'packaging/windows/**'
      - 'scripts/install/**'
      - 'scripts/release/**'
      - 'scripts/m14/MinosNativeMcpSmoke.java'
      - 'docker/**'
      - 'pom.xml'
      - 'minos-*/pom.xml'
      - 'docs/releases/1.0.1.md'
      - 'docs/user/production-installation.md'
      - '.github/workflows/windows-installer.yml'
  push:
    branches: [main, develop]
    paths:
      - 'packaging/windows/**'
      - 'scripts/install/**'
      - 'scripts/release/**'
      - 'scripts/m14/MinosNativeMcpSmoke.java'
      - 'docker/**'
      - 'pom.xml'
      - 'minos-*/pom.xml'
      - 'docs/releases/1.0.1.md'
      - 'docs/user/production-installation.md'
      - '.github/workflows/windows-installer.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Cross the GitHub Actions -> PowerShell boundary only through env vars, never through direct
  # ${{ }} interpolation inside a run: block -- see release-windows.yml for the full rationale.
  EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  INNO_SETUP_VERSION: '6.7.1'

jobs:
  candidate:
    name: Build and smoke Windows 1.0.1 candidate
    runs-on: windows-2022
    timeout-minutes: 75

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Java 24
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '24'
          cache: maven

      - name: Set up Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --version=$env:INNO_SETUP_VERSION --yes --no-progress
          # Resolve the exact binary the choco package above just installed -- do NOT search PATH or
          # any other Inno Setup install location. A stray pre-existing Inno Setup 7 (or any other
          # ISCC.exe reachable via PATH/chocolatey shim) must never be able to silently take over
          # compilation of the candidate setup.exe just because it happened to be found first.
          $isccPath = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $isccPath -PathType Leaf)) {
            throw "Expected ISCC.exe was not installed by 'choco install innosetup --version=$env:INNO_SETUP_VERSION' at $isccPath."
          }
          # Inno Setup's ISCC.exe does not reliably stamp FileVersion (observed as 0.0.0.0 on the
          # 6.7.1 chocolatey package); ProductVersion is what actually carries the release number,
          # so check both and accept either.
          $versionInfo = (Get-Item -LiteralPath $isccPath).VersionInfo
          $reportedVersions = @($versionInfo.ProductVersion, $versionInfo.FileVersion) | Where-Object { $_ }
          if (-not ($reportedVersions | Where-Object { $_ -like "$($env:INNO_SETUP_VERSION)*" })) {
            throw "ISCC.exe at $isccPath reports ProductVersion='$($versionInfo.ProductVersion)' FileVersion='$($versionInfo.FileVersion)', expected $env:INNO_SETUP_VERSION. Refusing to build the candidate setup with an unverified Inno Setup compiler."
          }
          Write-Host "Qualified ISCC: $isccPath (ProductVersion=$($versionInfo.ProductVersion) FileVersion=$($versionInfo.FileVersion))"
          "ISCC_PATH=$isccPath" >> $env:GITHUB_ENV

      - name: Build exact-head non-published candidate
        shell: powershell
        run: .\scripts\release\build-local-windows-candidate.ps1 -Version 1.0.1 -SkipMavenVerify -IsccPath $env:ISCC_PATH -RequiredIsccVersion $env:INNO_SETUP_VERSION

      - name: Install, handshake and uninstall isolated candidate
        shell: powershell
        run: |
          $head = (git rev-parse HEAD).Trim()
          if ($head -ne $env:EXPECTED_HEAD) { throw "Exact-head mismatch before smoke validation: checkout=$head expected=$env:EXPECTED_HEAD" }
          .\scripts\release\publish-windows-release.ps1 -Version 1.0.1 -TargetCommit $head -SkipBuild -ValidateOnly

      - name: Verify candidate artifacts
        shell: powershell
        run: |
          $expected = @(
            'target\dist\MINOS-1.0.1-windows-x64-setup.exe',
            'target\dist\MINOS-1.0.1-windows-x64-setup.exe.sha256',
            'target\dist\minos-1.0.1-windows-x64.zip',
            'target\dist\minos-1.0.1-windows-x64.zip.sha256',
            'target\dist\minos-1.0.1.cdx.json',
            'target\dist\minos-1.0.1.cdx.json.sha256',
            'target\dist\MINOS-1.0.1-THIRD-PARTY-NOTICES.txt',
            'target\dist\MINOS-1.0.1-THIRD-PARTY-NOTICES.txt.sha256'
          )
          $missing = @($expected | Where-Object { -not (Test-Path -LiteralPath $_ -PathType Leaf) })
          if ($missing.Count -gt 0) { throw "Missing Windows candidate artifacts: $($missing -join ', ')" }
          Write-Host 'MINOS WINDOWS INSTALLER EXACT-HEAD VALIDATION SUCCESS' -ForegroundColor Green

      - name: Upload Windows candidate diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: minos-windows-installer-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            target/dist/MINOS-1.0.1-windows-x64-setup.exe
            target/dist/MINOS-1.0.1-windows-x64-setup.exe.sha256
            target/dist/minos-1.0.1-windows-x64.zip
            target/dist/minos-1.0.1-windows-x64.zip.sha256
            target/dist/minos-1.0.1.cdx.json
            target/dist/minos-1.0.1.cdx.json.sha256
            target/dist/MINOS-1.0.1-THIRD-PARTY-NOTICES.txt
            target/dist/MINOS-1.0.1-THIRD-PARTY-NOTICES.txt.sha256
            target/dist/.installer/**
