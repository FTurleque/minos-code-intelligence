name: Windows Installer Validation

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'packaging/windows/**'
      - 'scripts/install/**'
      - 'scripts/release/**'
      - 'scripts/m14/MinosNativeMcpSmoke.java'
      - 'docker/**'
      - 'pom.xml'
      - 'minos-*/pom.xml'
      - 'docs/releases/1.0.1.md'
      - 'docs/user/production-installation.md'
      - '.github/workflows/windows-installer.yml'
  push:
    branches: [main, develop]
    paths:
      - 'packaging/windows/**'
      - 'scripts/install/**'
      - 'scripts/release/**'
      - 'scripts/m14/MinosNativeMcpSmoke.java'
      - 'docker/**'
      - 'pom.xml'
      - 'minos-*/pom.xml'
      - 'docs/releases/1.0.1.md'
      - 'docs/user/production-installation.md'
      - '.github/workflows/windows-installer.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  candidate:
    name: Build and smoke Windows 1.0.1 candidate
    runs-on: windows-latest
    timeout-minutes: 75

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v7
        with:
          # PR workflows normally checkout GitHub's synthetic merge ref. Release
          # provenance must instead identify the exact branch HEAD being qualified.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Java 24
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '24'
          cache: maven

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          $iscc = @(
            (Get-Command ISCC.exe -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source -ErrorAction SilentlyContinue),
            'C:\Program Files (x86)\Inno Setup 7\ISCC.exe',
            'C:\Program Files\Inno Setup 7\ISCC.exe',
            'C:\Program Files (x86)\Inno Setup 6\ISCC.exe',
            'C:\Program Files\Inno Setup 6\ISCC.exe',
            'C:\ProgramData\chocolatey\bin\ISCC.exe'
          ) | Where-Object { $_ -and (Test-Path -LiteralPath $_) } | Select-Object -First 1
          if (-not $iscc) { throw 'Inno Setup installation did not expose ISCC.exe.' }
          Write-Host "ISCC: $iscc"

      - name: Build exact-head non-published candidate
        shell: powershell
        run: |
          .\scripts\release\build-local-windows-candidate.ps1 -Version 1.0.1 -SkipMavenVerify

      - name: Install, handshake and uninstall isolated candidate
        shell: powershell
        run: |
          $head = (git rev-parse HEAD).Trim()
          if ($head -ne '${{ github.event.pull_request.head.sha || github.sha }}') {
            throw "Exact-head mismatch before smoke validation: checkout=$head expected=${{ github.event.pull_request.head.sha || github.sha }}"
          }
          .\scripts\release\publish-windows-release.ps1 `
            -Version 1.0.1 `
            -TargetCommit $head `
            -SkipBuild `
            -ValidateOnly

      - name: Verify candidate artifacts
        shell: powershell
        run: |
          $expected = @(
            'target\dist\MINOS-1.0.1-windows-x64-setup.exe',
            'target\dist\MINOS-1.0.1-windows-x64-setup.exe.sha256',
            'target\dist\.smoke\MINOS-1.0.1-windows-x64-smoke-setup.exe',
            'target\dist\minos-1.0.1-windows-x64.zip',
            'target\dist\minos-1.0.1.cdx.json',
            'target\dist\MINOS-1.0.1-THIRD-PARTY-NOTICES.txt'
          )
          $missing = @($expected | Where-Object { -not (Test-Path -LiteralPath $_ -PathType Leaf) })
          if ($missing.Count -gt 0) { throw "Missing Windows candidate artifacts: $($missing -join ', ')" }
          Write-Host 'MINOS WINDOWS INSTALLER EXACT-HEAD VALIDATION SUCCESS' -ForegroundColor Green

      - name: Upload Windows candidate diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: minos-windows-installer-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            target/dist/MINOS-1.0.1-windows-x64-setup.exe
            target/dist/MINOS-1.0.1-windows-x64-setup.exe.sha256
            target/dist/.smoke/MINOS-1.0.1-windows-x64-smoke-setup.exe
            target/dist/.smoke/MINOS-1.0.1-windows-x64-smoke-setup.exe.sha256
            target/dist/minos-1.0.1-windows-x64.zip
            target/dist/minos-1.0.1-windows-x64.zip.sha256
            target/dist/minos-1.0.1.cdx.json
            target/dist/minos-1.0.1.cdx.json.sha256
            target/dist/MINOS-1.0.1-THIRD-PARTY-NOTICES.txt
            target/dist/MINOS-1.0.1-THIRD-PARTY-NOTICES.txt.sha256
            target/dist/.installer/**
