name: Post-audit IntelliJ Windows diagnostic

on:
  push:
    branches: [fix/post-audit-remediation-20260814]
    paths: [.github/workflows/post-audit-intellij-windows-diagnostic.yml]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/post-audit-remediation-20260814
          fetch-depth: 0
      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          gradle-version: '9.6.1'
          cache-provider: basic
      - name: Run focused Windows ownership test with diagnostics
        working-directory: minos-intellij
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          gradle --no-daemon test --tests 'com.minos.intellij.protocol.MinosStrongProcessLauncherTest.immediateDetachedChildCannotEscapeWindowsJobObject' --info
          $Exit = $LASTEXITCODE
          Get-ChildItem -Recurse build\test-results\test\*.xml | ForEach-Object { Get-Content -LiteralPath $_.FullName }
          exit $Exit
