name: Import post-audit remediation onto qualified develop

on:
  push:
    branches: [agent/post-audit-remediation-final]
    paths:
      - '.github/workflows/import-post-audit-remediation.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_BRANCH: agent/post-audit-remediation-final
      SOURCE_BRANCH: agent/post-audit-remediation
    steps:
      - name: Merge remediation while preserving qualified develop CI on conflicts
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git config user.name 'MINOS Remediation Import'
          git config user.email 'actions@users.noreply.github.com'
          git config core.autocrlf false
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags origin "${TARGET_BRANCH}" "${SOURCE_BRANCH}"
          git checkout -B "${TARGET_BRANCH}" "origin/${TARGET_BRANCH}"
          git merge -X ours --no-edit "origin/${SOURCE_BRANCH}"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
