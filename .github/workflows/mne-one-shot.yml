name: MNE remediation one-shot

on:
  push:
    branches: [fix/mne-complete-remediation]

permissions:
  contents: write

concurrency:
  group: mne-one-shot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout exact staging head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Assert exact staging HEAD
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git branch --show-current)" = "fix/mne-complete-remediation"

      - name: Set up Java 24
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '24'
          cache: maven

      - name: Set up Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Qualify and pin scip-dotnet nupkg
        shell: bash
        run: |
          set -euo pipefail
          url='https://api.nuget.org/v3-flatcontainer/scip-dotnet/0.2.14/scip-dotnet.0.2.14.nupkg'
          package="$RUNNER_TEMP/scip-dotnet.0.2.14.nupkg"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 "$url" --output "$package"
          dotnet nuget verify --all "$package"
          sha="$(sha256sum "$package" | awk '{print $1}')"
          test "${#sha}" -eq 64
          echo "MNE_DOTNET_NUPKG_SHA256=$sha" >> "$GITHUB_ENV"
          echo "Qualified scip-dotnet nupkg SHA-256: $sha"

      - name: Apply guarded MNE transformations
        run: |
          python scripts/remediation/fix-mne-staging.py
          python scripts/remediation/apply-mne-snapshots.py
          python scripts/remediation/apply-mne-semantic.py
          python scripts/remediation/apply-mne-runtime.py
          python scripts/remediation/apply-mne-security.py

      - name: Static remediation gates
        run: |
          python scripts/quality/check-workflow-pins.py
          python scripts/remediation/check-p0-p2.py
          python scripts/remediation/check-mnd.py
          python scripts/remediation/check-mne.py
          python scripts/architecture/check-module-boundaries.py
          python scripts/docs/product-facts.py --check
          git diff --check

      - name: Prepare Maven Wrapper
        run: chmod +x mvnw

      - name: Maven clean verify with PostgreSQL required
        run: ./mvnw -B -ntp -Dminos.postgresql.tests.required=true clean verify

      - name: Targeted JaCoCo gate
        run: python scripts/quality/check-jacoco.py

      - name: Remove staging-only remediation machinery
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            scripts/remediation/fix-mne-staging.py \
            scripts/remediation/apply-mne-snapshots.py \
            scripts/remediation/apply-mne-semantic.py \
            scripts/remediation/apply-mne-runtime.py \
            scripts/remediation/apply-mne-security.py \
            .github/workflows/mne-one-shot.yml
          git diff --check
          test ! -e .github/workflows/mne-one-shot.yml

      - name: Commit qualified remediation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          git diff --cached --quiet && { echo 'No remediation changes to commit'; exit 1; }
          git commit -m 'fix: complete MNE audit remediation'
          git push origin HEAD:fix/mne-complete-remediation
