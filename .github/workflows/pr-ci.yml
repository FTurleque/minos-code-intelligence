name: PR Validation

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  vulnerability-scan:
    name: Dependency vulnerability gate
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@3adb4b14a2b0623876d18d863a498b785fb3752d # v2.3.8
    with:
      scan-args: |-
        --recursive
        --exclude=fixtures/**
        ./
      fail-on-vuln: true
    permissions:
      actions: read
      contents: read
      security-events: write

  verify:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Assert exact candidate HEAD (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SHA"

      - name: Assert exact candidate HEAD (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:EXPECTED_SHA) {
            throw "Exact-head mismatch: actual=$actual expected=$env:EXPECTED_SHA"
          }

      - name: Require main ancestry in every candidate
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            echo 'main is not an ancestor of the candidate HEAD. Synchronize main into develop before continuing.' >&2
            exit 1
          fi

      - name: Set up Java 24
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '24'
          cache: maven

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Immutable workflow supply-chain gate
        run: python scripts/quality/check-workflow-pins.py

      - name: Audit remediation v2 invariants
        if: runner.os != 'Windows'
        run: python scripts/remediation/check-audit-remediation-v2.py

      - name: Inno Setup provenance rules
        shell: pwsh
        run: ./scripts/release/test-iscc-provenance.ps1

      - name: P0-P2 audit remediation consistency
        run: python scripts/remediation/check-p0-p2.py

      - name: MINOS-01 worker resource containment gate
        run: python scripts/remediation/check-minos-01.py

      - name: Maven module-boundary fitness gate
        run: python scripts/architecture/check-module-boundaries.py

      - name: Install and authorize Linux worker sandbox runtime
        if: runner.os != 'Windows'
        timeout-minutes: 10
        shell: bash
        run: bash scripts/ci/install-linux-sandbox-toolchain.sh

      - name: Delegate a cgroup v2 job boundary to the worker sandbox
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/ci/delegate-linux-cgroup.sh

      - name: Prepare Maven Wrapper (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: chmod +x mvnw

      - name: Maven clean verify (Unix, PostgreSQL required)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci/delegate-linux-cgroup.sh --attach-pid $$
          ./mvnw -B -ntp -Dminos.postgresql.tests.required=true clean verify

      - name: Maven clean verify (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: .\mvnw.cmd -B -ntp clean verify

      - name: Targeted JaCoCo gate (full)
        if: runner.os != 'Windows'
        run: python scripts/quality/check-jacoco.py

      # Off by default: SonarCloud currently runs as Automatic Analysis (GitHub App), which cannot
      # import coverage. This step gives an operator an explicit, opt-in path to CI-based analysis
      # with real JaCoCo coverage once SONAR_TOKEN is provisioned and Automatic Analysis is turned
      # off in the SonarCloud project settings (the two modes are mutually exclusive). See
      # docs/STATUS.md "SonarCloud" for the activation steps. No effect while the variable is unset.
      - name: SonarCloud CI-based analysis (opt-in)
        if: runner.os != 'Windows' && vars.SONAR_CI_ANALYSIS_ENABLED == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./mvnw -B -ntp org.sonarsource.scanner.maven:sonar-maven-plugin:5.1.0.4751:sonar \
            -Dsonar.projectKey=FTurleque_atlas \
            -Dsonar.organization=fturleque \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco-aggregate/jacoco.xml

      - name: Targeted JaCoCo gate (Windows, PostgreSQL scope qualified on Linux)
        if: runner.os == 'Windows'
        run: python scripts/quality/check-jacoco.py --skip-scope m30-postgresql-pgvector

      - name: Product facts consistency
        run: python scripts/docs/product-facts.py --check

      - name: Upload verification diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: pr-validation-${{ runner.os }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
            target/site/jacoco-aggregate/**
            target/m15-quality/**
