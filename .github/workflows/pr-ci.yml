name: PR Validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number || github.ref }}
  # Never cancel a push-triggered run on main: only a duplicate PR run is obsolete.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  vulnerability-scan:
    name: Dependency vulnerability gate
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@d3c1414ded37de590f207572e37a7d180f1d0ef7 # commit sans tag (v2.7.0 + 2 commits), appelle osv-scanner-action v2.7.0
    with:
      # The scanner recognises an npm lockfile by its file name (package-lock.json). The two lockfiles shipped
      # with the product are prefixed with the name of their tool, so --recursive does not see them: each is
      # passed explicitly, parsed as a package-lock.json (AUD-DEP-03). scripts/quality/check-ci-wiring.py fails
      # when a lockfile under a src/main/resources directory is missing from this list.
      # AUD-DEP-04: minos-intellij/gradle.lockfile (what the plugin ships and tests with) is scanned. The lock of the
      # plugin's build script classpath (buildscript-gradle.lockfile) and gradle/verification-metadata.xml are scanned
      # too: --experimental-exclude only excludes directories. Jackson and jsoup are raised there by build.gradle.kts;
      # undertow-core, with no fixed version, is the only exception (minos-intellij/osv-scanner.toml, expiring).
      scan-args: |-
        --recursive
        --experimental-exclude=g:**/fixtures/**
        --lockfile=package-lock.json:minos-provider-scip/src/main/resources/com/minos/adapter/scip/runtime/scip-python-package-lock.json
        --lockfile=package-lock.json:minos-provider-scip/src/main/resources/com/minos/adapter/scip/runtime/scip-typescript-package-lock.json
        ./
      fail-on-vuln: true
    permissions:
      actions: read
      contents: read
      security-events: write

  # Every static/textual invariant gate that does not need a Maven build, run exactly once
  # (Python-only, no Java/Maven setup) instead of once per OS or once per now-retired
  # remediation workflow. Formerly split across pr-ci's own OS matrix plus
  # mnd-remediation.yml, mne-remediation.yml, post-mne-remediation.yml and
  # post-228-hardening.yml (see docs/project/audits/archive/2026-09/CI-HYGIENE-SUIVI.md for the inventory that
  # justified each merge).
  invariants:
    name: Static invariants (single run)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Assert exact candidate HEAD
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - name: Immutable workflow supply-chain gate (actions by SHA, Inno Setup provenance, no floating runner image)
        run: python scripts/quality/check-workflow-pins.py

      - name: Immutable workflow supply-chain gate self-test
        run: python scripts/quality/test_check_workflow_pins.py -v

      - name: Single execution gate (Maven verify, product facts, JaCoCo and sandbox toolchain run once per OS, here only)
        run: python scripts/quality/check-single-execution.py

      - name: Single execution gate self-test
        run: python scripts/quality/test_check_single_execution.py -v

      - name: Container image pin gate (image:tag@sha256, one source per managed-service image)
        run: python scripts/quality/check-image-pins.py

      - name: Container image pin gate self-test
        run: python scripts/quality/test_check_image_pins.py -v

      - name: Compose resource limits gate (CPU, memory and PID ceiling on every service)
        run: python scripts/quality/check-compose-limits.py

      - name: Compose resource limits gate self-test
        run: python scripts/quality/test_check_compose_limits.py -v

      - name: Toolchain baseline gate (the Gradle wrapper and the policy state one version, no workflow installs Gradle)
        run: python scripts/quality/check-toolchain-baseline.py

      - name: Toolchain baseline gate self-test
        run: python scripts/quality/test_check_toolchain_baseline.py -v

      - name: Installation secret file tests (declared skipped here, executed on Windows in the verify job)
        run: python scripts/install/test_secret_file_acl.py -v

      - name: Installation storage selection tests (declared skipped here, executed on Windows in the verify job)
        run: python scripts/install/test_runtime_settings_storage.py -v

      - name: Development launcher tests (declared skipped here, executed on Windows in the verify job)
        run: python scripts/install/test_dev_launcher.py -v

      - name: Docker lifecycle query-image tests (pwsh here, Windows PowerShell 5.1 and pwsh in the verify job)
        run: python scripts/install/test_mcp_lifecycle_query_image.py -v

      - name: Docker lifecycle pgAdmin tests (compose shape and refusals here, the enabling flow on Windows in the verify job)
        run: python scripts/install/test_mcp_lifecycle_pgadmin.py -v

      - name: MCP client backup tests (static count check here, backups executed on Windows in the verify job)
        run: python scripts/install/test_mcp_client_backups.py -v

      - name: Docker script context tests (runtime .env and image build context; whole verification script in the verify job)
        run: python scripts/install/test_docker_script_contexts.py -v

      - name: Installer progress protocol tests (pwsh here, Windows PowerShell 5.1 and pwsh in the verify job)
        run: python scripts/install/test_setup_progress.py -v

      - name: Delegated cgroup root validation tests (provisioning scripts run with a recording sudo)
        run: python scripts/deploy/test_cgroup_root_validation.py -v

      - name: PostgreSQL test server script tests (recording docker; bash and pwsh)
        run: python scripts/dev/test_start_test_postgres.py -v

      - name: Shipped tools gate (one description shared by Java, the Docker image and the Windows distribution)
        run: python scripts/quality/check-tools-manifest.py

      - name: Shipped tools gate and payload builder self-tests
        run: |
          python scripts/quality/test_check_tools_manifest.py -v
          python scripts/release/test_build_embedded_tools.py -v

      # The watch itself queries an advisory service and runs on a schedule (embedded-tools-advisories.yml):
      # an advisory published during the week must not fail an unrelated pull request. Only its self-test,
      # which uses simulated answers and no network, runs here; it also proves that the tables of the script
      # know every entry of the catalogue and every jar of the classpath lock.
      - name: Embedded tools advisory watch self-test (simulated answers, no network)
        run: python scripts/quality/check-embedded-tools-advisories.py --self-test

      # AUD-DEP-11: the comparison of two builds, on simulated archives (the real double build is reproducible-build.yml).
      - name: Reproducible build comparison self-test
        run: python scripts/quality/check-reproducible-build.py --self-test

      # AUD-DEP-02: every POSIX shell script is pinned to LF by .gitattributes and recorded without carriage returns.
      - name: POSIX script line endings gate (eol=lf attribute and LF index for every shell script)
        run: python scripts/quality/check-posix-script-eol.py

      - name: POSIX script line endings gate self-test (temporary Git repositories)
        run: python scripts/quality/check-posix-script-eol.py --self-test

      - name: Maven module-boundary fitness gate
        run: python scripts/architecture/check-module-boundaries.py

      - name: Module-boundary checker self-test (A2 POM rules, policy source, main wiring)
        run: python scripts/architecture/test_check_module_boundaries.py -v

      - name: Module-boundary checker self-test (A3 packages, A7 reactor, A8 cycles, A15 unreferenced types)
        run: python scripts/architecture/test_check_module_boundaries_packages.py -v

      - name: Module-boundary checker self-test (A2 sources, A10, A14, A16, A18 to A20, storage isolation)
        run: python scripts/architecture/test_check_module_boundaries_adapters.py -v

      - name: Module-boundary checker self-test (A11 to A13 ratchets)
        run: python scripts/architecture/test_check_module_boundaries_ratchets.py -v

      - name: Module-boundary checker self-test (A11 MinosApplication facade)
        run: python scripts/architecture/test_check_module_boundaries_facade.py -v

      - name: Module-boundary checker self-test (A9 documentation, A17 ArchUnit policy, generated document)
        run: python scripts/architecture/test_check_module_boundaries_documents.py -v

      - name: Architecture gate runner self-test
        run: python scripts/architecture/test_gate_runner.py -v

      - name: Private I/O primitives gate (no raw createDirectories, write, newInputStream or channel lock)
        run: python scripts/architecture/check-private-io.py

      - name: Private I/O gate self-test (one witness mutation per forbidden call)
        run: python scripts/architecture/test_check_private_io.py -v

      - name: Current documentation consistency
        run: python scripts/docs/check-current-docs.py

      - name: Product facts consistency
        run: python scripts/docs/product-facts.py --check

      # OpenSpec schema detailed-uml: durable capability dossiers stay consistent with the reference specs.
      - name: Capability dossiers consistency
        run: python scripts/docs/check-capability-dossiers.py

      - name: Capability dossiers checker self-test (one refused mutation per rule)
        run: python scripts/docs/test_check_capability_dossiers.py -v

      - name: Milestone artifact reference guard
        run: python scripts/quality/check-milestone-artifact-references.py

      - name: CI wiring gate (required checks resolve to jobs that can report; every gate self-test runs here)
        run: python scripts/quality/check-ci-wiring.py

      # AUD-QUA-01: the plugin's copy of the Job Object launcher against the one the engine assembles.
      - name: Job Object launcher parity gate
        run: python scripts/quality/check-job-object-launcher-parity.py

      - name: Job Object launcher parity gate self-test
        run: python scripts/quality/test_check_job_object_launcher_parity.py -v

      # AUD-QUA-09: functions copied between shipped, install, release and CI scripts stay identical.
      - name: Twin script functions gate
        run: python scripts/quality/check-twin-script-functions.py

      - name: Twin script functions gate self-test
        run: python scripts/quality/test_check_twin_script_functions.py -v

      # The guard of .claude/hooks reads the branch of the directory a push runs in: both worktree directions.
      - name: Claude Code push guard self-test (temporary Git repositories and worktrees)
        run: python scripts/quality/test_guard_bash_hook.py -v

      # The other hooks judge a file, or a session, in the working tree that holds it.
      - name: Claude Code worktree hooks self-test (protected paths, gate reminders, session context)
        run: python scripts/quality/test_claude_hooks_worktree.py -v

      - name: CI wiring, ruleset comparison, plugin gate and Docker gate self-tests
        run: |
          python scripts/quality/test_check_ci_wiring.py -v
          python scripts/quality/test_verify_ruleset.py -v
          python scripts/ci/test_plugin_gate.py -v
          python scripts/ci/test_docker_gate.py -v
          python scripts/ci/test_fetch_verified.py -v

      - name: JaCoCo gate self-test (decision logic on synthetic reports; the gate itself runs in the verify jobs)
        run: python scripts/quality/check-jacoco.py --self-test

      - name: Milestone artifact reference guard self-test
        run: python scripts/quality/check-milestone-artifact-references.py --self-test

      - name: Bounded helpers gate (a bounded-arithmetic helper is named after its overflow behaviour)
        run: python scripts/quality/check-bounded-helpers.py

      - name: Bounded helpers gate self-test
        run: python scripts/quality/check-bounded-helpers.py --self-test

      - name: Milestone identifiers gate (no milestone number in a production name)
        run: python scripts/quality/check-milestone-identifiers.py

      - name: Milestone identifiers gate self-test
        run: python scripts/quality/check-milestone-identifiers.py --self-test

      - name: Comment language gate (no file mixes French and English comments; per-module counters only go down)
        run: python scripts/quality/check-comment-language.py

      - name: Comment language gate self-test
        run: python scripts/quality/check-comment-language.py --self-test

      - name: Mutation status table follows the reactor modules
        run: python scripts/quality/audit-report-summary.py mutation-status --check

      - name: Mutation status table check self-test
        run: python scripts/quality/audit-report-summary.py mutation-status --self-test

      - name: Partial-result consumer gate (heuristic, see its docstring for what it cannot see)
        run: python scripts/quality/check-partial-result-consumers.py

      - name: Partial-result consumer gate self-test, shared-list and script-function tests
        run: |
          python scripts/quality/check-partial-result-consumers.py --self-test
          python scripts/lib/test_minos_exit_code.py -v

      - name: MND remediation invariants
        run: python scripts/remediation/check-mnd.py

      - name: MNE remediation invariants
        run: python scripts/remediation/check-mne.py

      - name: Post-MNE structural remediation invariants (includes the active milestone gates)
        run: python scripts/remediation/check-post-mne.py

      - name: Post-228 static invariants
        run: python scripts/remediation/check-post228-hardening.py

      - name: Audit remediation v2 invariants
        run: python scripts/remediation/check-audit-remediation-v2.py

      - name: P0-P2 audit remediation consistency
        run: python scripts/remediation/check-p0-p2.py

      - name: MINOS-01 worker resource containment gate
        run: python scripts/remediation/check-minos-01.py

      - name: Inno Setup provenance rules
        shell: pwsh
        run: ./scripts/release/test-iscc-provenance.ps1

      # AUD-DEP-06: the release signature guard and the recomputed checksums (PowerShell 7 here, 5.1 under Windows
      # below), and the Authenticode state of the release manifest.
      - name: Release signature guard and manifest state tests
        shell: pwsh
        run: |
          ./scripts/release/test-release-signature.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/release/test_release_manifest.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Docker upgrade evidence checker unit tests
        run: python scripts/release/test_check_docker_upgrade_evidence.py -v

      # AUD-TST-04: a test restricted to one system uses @EnabledOnOs (counted as skipped), never an early return.
      - name: Test platform guards gate
        run: python scripts/quality/check-test-platform-guards.py

      - name: Test platform guards gate self-test
        run: python scripts/quality/check-test-platform-guards.py --self-test

      # AUD-TST-02: the explorer page is parsed and executed under the Node of the runner image (no npm package).
      - name: Node version used by the explorer front gate
        run: node --version

      - name: Explorer front gate (app.js parses, node:test files run against the real script in a fake DOM)
        run: python scripts/quality/check-explorer-front.py

      - name: Explorer front gate self-test (mutated copies must fail)
        run: python scripts/quality/check-explorer-front.py --self-test

      # AUD-TST-09: each literal gate refuses one in-memory mutation per fact it asserts.
      - name: Literal gate self-tests (shared mutation driver and the gates built on it)
        run: |
          python scripts/quality/test_literal_gate.py -v
          python scripts/docs/check-current-docs.py --self-test
          python scripts/quality/check-current-docs-vertical-extension.py --self-test
          python scripts/quality/check-advanced-provider-consistency.py --self-test
          python scripts/quality/check-hosted-control-plane-consistency.py --self-test
          python scripts/quality/check-java-ast-provider-consistency.py --self-test
          python scripts/quality/check-polyglot-provider-consistency.py --self-test
          python scripts/quality/check-remote-distributed-consistency.py --self-test
          python scripts/quality/check-runtime-dynamic-consistency.py --self-test
          python scripts/quality/check-semantic-retrieval-consistency.py --self-test
          python scripts/quality/check-vertical-decomposition-consistency.py --self-test

  # The ONLY Maven build of a pull request, and so the only executor of the JaCoCo gate, the
  # Linux sandbox toolchain and the delegated cgroup. The path-filtered
  # M19 and M20 workflows used to repeat this exact job on a subset of paths (audit C2); they were
  # retired because nothing they asserted was missing here (docs/project/audits/archive/2026-09/S23-SUIVI.md, "Lot 3").
  # scripts/quality/check-single-execution.py keeps a second copy from coming back.
  verify:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      # AUD-DEP-13, AUD-DEP-14: the PostgreSQL test image (the pinned default of MINOS_POSTGRES_IMAGE) is read before
      # the Docker Hub login, so no code of the repository runs while the token is on disk.
      - name: Read the PostgreSQL test image
        id: postgres-test-image
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          set -euo pipefail
          image="$(bash scripts/dev/start-test-postgres.sh --print-image)"
          echo "image=${image}" >> "$GITHUB_OUTPUT"

      # Docker Hub limits anonymous pulls per runner address (429 toomanyrequests on 2026-10-09 stopped base images,
      # pgvector for the PostgreSQL tests, and the Docker qualifications). With the repository secrets
      # DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (a read-only access token), the next step pulls the PostgreSQL test
      # image authenticated, then logs out before any test runs; without them (forks, secrets not created) this step
      # is skipped and the next one pulls anonymously.
      - name: Log in to Docker Hub (when the secrets exist)
        if: ${{ runner.os == 'Linux' && env.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # AUD-DEP-13: the image is pulled, then the Docker Hub token is removed before any repository code, Maven plugin
      # or test runs. A failed logout fails the step.
      - name: Pull the PostgreSQL test image, then log out of Docker Hub
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        env:
          IMAGE: ${{ steps.postgres-test-image.outputs.image }}
        run: |
          set -euo pipefail
          log_out() { docker logout || { echo "logging out of Docker Hub failed: the token would stay readable" >&2; exit 1; }; }
          trap log_out EXIT
          test -n "$IMAGE"
          docker pull "$IMAGE"

      # AUD-DEP-14: the PostgreSQL tests connect to this server; no test starts a container. The password is generated
      # here, masked, and reaches Maven through MINOS_TEST_POSTGRES_PASSWORD only (never a command-line argument).
      - name: Start the PostgreSQL test server
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: bash scripts/dev/start-test-postgres.sh --github-env

      - name: Assert exact candidate HEAD (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SHA"

      - name: Assert exact candidate HEAD (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:EXPECTED_SHA) {
            throw "Exact-head mismatch: actual=$actual expected=$env:EXPECTED_SHA"
          }

      - name: Require main ancestry in every candidate
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            echo 'main is not an ancestor of the candidate HEAD. Update the branch from main before continuing.' >&2
            exit 1
          fi

      - name: Set up Java 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - name: Install and authorize Linux worker sandbox runtime
        if: runner.os != 'Windows'
        timeout-minutes: 10
        shell: bash
        run: bash scripts/ci/install-linux-sandbox-toolchain.sh --with-packaged-jdk

      - name: Delegate a cgroup v2 job boundary to the worker sandbox
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/ci/delegate-linux-cgroup.sh

      - name: Prepare Maven Wrapper (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: chmod +x mvnw

      - name: Maven clean verify (Unix, PostgreSQL required)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci/delegate-linux-cgroup.sh --attach-pid $$
          ./mvnw -B -ntp -Dminos.postgresql.tests.required=true "-Dminos.postgresql.test.url=${MINOS_TEST_POSTGRES_URL}" "-Dminos.postgresql.test.user=${MINOS_TEST_POSTGRES_USER}" -Dminos.sandbox.tests.required=true clean verify

      # ADR SEC-0076: a real scip-java index of the trusted fixture, built offline under the required Linux sandbox
      # from a qualification Maven repository populated outside it; the repository must come out unchanged.
      - name: Offline Maven index under the Linux sandbox (scip-java, designated repository)
        if: runner.os != 'Windows'
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci/delegate-linux-cgroup.sh --attach-pid $$
          bash scripts/ci/qualify-linux-offline-maven-index.sh

      - name: Maven clean verify (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: .\mvnw.cmd -B -ntp "-Dminos.sandbox.tests.required=true" clean verify

      - name: Targeted JaCoCo gate (full)
        if: runner.os != 'Windows'
        run: python scripts/quality/check-jacoco.py

      # AUD-SEC-12, AUD-SEC-13: the installation scripts and the development launcher are Windows code that no
      # Maven module runs. Their tests are skipped in the invariants job (Ubuntu) and really run here.
      - name: Installation secret file and development launcher tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python scripts/install/test_secret_file_acl.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # The native MINOS home of an installation with PostgreSQL managed by Docker keeps local storage.
          python scripts/install/test_runtime_settings_storage.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/install/test_dev_launcher.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # AUD-DEP-15: the Docker lifecycle script is started by the installer under Windows PowerShell 5.1.
          python scripts/install/test_mcp_lifecycle_query_image.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # The optional pgAdmin service: private secret files, role applied before the service starts, removal.
          python scripts/install/test_mcp_lifecycle_pgadmin.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Back-to-back backups of MCP client configurations each keep their own file.
          python scripts/install/test_mcp_client_backups.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # The Docker helper scripts under Windows PowerShell 5.1 and pwsh, and verify-run-configurations.ps1 when Compose answers.
          python scripts/install/test_docker_script_contexts.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # The installer progress emitters of the shipped configuration scripts, under Windows PowerShell 5.1 and pwsh.
          python scripts/install/test_setup_progress.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # AUD-DEP-06: the release scripts run under Windows PowerShell 5.1 too; the real Get-AuthenticodeSignature.
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File scripts/release/test-release-signature.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Targeted JaCoCo gate (Windows, PostgreSQL scope qualified on Linux)
        if: runner.os == 'Windows'
        run: python scripts/quality/check-jacoco.py --skip-scope m30-postgresql-pgvector

      # The JaCoCo report of every module on this operating system, for the SonarCloud job below. Linux cannot
      # run the AppContainer and Job Object code, Windows cannot run bubblewrap and cgroup: each side covers
      # what the other cannot. The scanner reads coverage module by module, from a path relative to the module:
      # the aggregate report of the reactor root is not attached to any source file (regression of 2026-10-12,
      # when only that aggregate was published and every new line counted as uncovered). The XML names packages
      # and source files, never a path of the runner.
      - name: Upload the JaCoCo report of every module
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jacoco-modules-${{ runner.os }}
          # A re-run of this job replaces the reports of the previous attempt: the analysis reads the latest.
          overwrite: true
          if-no-files-found: ignore
          retention-days: 3
          path: '**/target/site/jacoco/jacoco.xml'

      # The class files of every module of the reactor, main and test, for the SonarCloud job below (AUD-DEP-05): the
      # analysis no longer compiles anything, so it runs no code of the pull request. These are the classes the Linux
      # JaCoCo reports were measured on. Class files only: the scanner reads no resource. The analysis job treats them
      # as data (nothing of them is executed).
      - name: Upload the class files of every module for the analysis
        if: ${{ always() && runner.os == 'Linux' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sonar-binaries-${{ runner.os }}
          overwrite: true
          if-no-files-found: ignore
          retention-days: 3
          # minos-app builds into the target/ directory of the repository root (minos-app/pom.xml, <directory>).
          path: |
            minos-*/target/classes/**/*.class
            minos-*/target/test-classes/**/*.class
            target/classes/**/*.class
            target/test-classes/**/*.class

      - name: Upload verification diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-validation-${{ runner.os }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
            target/site/jacoco-aggregate/**
            target/m15-quality/**
            target/m21-quality/**

  # CI-based SonarCloud analysis (Automatic Analysis is off in the SonarCloud project: the two modes are
  # mutually exclusive). It runs after both Verify jobs and imports the coverage of both operating systems;
  # until 2026-10-12 it ran inside the Ubuntu Verify job with the Linux reports alone, so code that only
  # Windows can execute counted as uncovered. No effect while the repository variable is unset.
  # AUD-DEP-05: this job receives SONAR_TOKEN, so it runs no code of the repository (no Maven wrapper, no script of
  # scripts/, no local action; check-workflow-pins.py refuses any). It compiles nothing: the class files come from
  # Verify (ubuntu-24.04), the JaCoCo reports from both Verify jobs, and the checked-out tree, the classes and the
  # reports are read as data by the pinned scanner action. The analysis parameters are written in this workflow, and
  # a sonar-project.properties of the tree is refused before the analysis (the pull request does not choose the host).
  # When a Verify job failed and left no report, the analysis still runs with the reports that exist, so that issues
  # are reported; the Linux reports and the class files are required.
  sonar:
    name: SonarCloud analysis (Linux and Windows coverage)
    needs: verify
    if: ${{ !cancelled() && vars.SONAR_CI_ANALYSIS_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      # One step per artifact, each in its own directory outside the modules. Reports are absent when a Verify job
      # failed before its tests ended: the download then fails and the next step decides what to do without them.
      - name: Download the Linux JaCoCo reports
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: jacoco-modules-Linux
          path: coverage-reports/linux

      - name: Download the Windows JaCoCo reports
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: jacoco-modules-Windows
          path: coverage-reports/windows

      - name: Download the class files of Verify (ubuntu-24.04)
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sonar-binaries-Linux
          path: sonar-binaries

      - name: Check that the analysis token is available
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SONAR_TOKEN:-}" ]; then
            echo "SONAR_TOKEN is not available to this run. GitHub does not give the repository secrets to Dependabot" >&2
            echo "pull requests or to forks: for Dependabot, add SONAR_TOKEN to the Dependabot secrets of the repository." >&2
            exit 1
          fi

      # No secret here. The scanner reads sonar-project.properties from its base directory: one brought by the pull
      # request is refused, so the host, the proxy and the project that go with the token are those of this workflow.
      # The scanner patterns below name the modules as minos-*: the reactor must be exactly those directories, each
      # with its class files, so that no module is analysed without binaries or left out silently.
      - name: Check the analysis inputs
        shell: bash
        run: |
          set -euo pipefail
          configuration="$(find . -path ./.git -prune -o -name sonar-project.properties -print)"
          if [ -n "$configuration" ]; then
            echo "The checked-out tree contains a scanner configuration (sonar-project.properties), refused: the analysis" >&2
            echo "parameters are written in .github/workflows/pr-ci.yml only." >&2
            printf '%s\n' "$configuration" >&2
            exit 1
          fi
          mapfile -t modules < <(sed -n 's|^[[:space:]]*<module>\([^<]*\)</module>[[:space:]]*$|\1|p' pom.xml)
          if [ "${#modules[@]}" -eq 0 ]; then
            echo "No module read from the root pom.xml." >&2
            exit 1
          fi
          for module in "${modules[@]}"; do
            if ! [[ "$module" =~ ^minos-[a-z0-9-]+$ ]]; then
              echo "Module '$module' does not match the minos-* pattern the analysis parameters use." >&2
              exit 1
            fi
            # A module that builds into the target/ directory of the repository root (minos-app) publishes from there.
            build="$module/target"
            if grep -qF '<directory>${maven.multiModuleProjectDirectory}/target</directory>' "$module/pom.xml"; then
              build="target"
            fi
            if [ -d "$module/src/main/java" ] && [ -z "$(find "sonar-binaries/$build/classes" -name '*.class' -print -quit 2>/dev/null)" ]; then
              echo "No class file of $module: Verify (ubuntu-24.04) did not publish the classes the scanner needs." >&2
              exit 1
            fi
          done
          for sources in minos-*/src/main/java; do
            [ -d "$sources" ] || continue
            module="${sources%%/*}"
            if [ "$module" != "minos-intellij" ] && ! printf '%s\n' "${modules[@]}" | grep -qx "$module"; then
              echo "$module has Java sources but is not a module of the reactor: add it to the analysis or exclude it." >&2
              exit 1
            fi
          done
          # count <directory> <find test>...: files below a directory, 0 when the download left no directory.
          count() {
            local directory="$1"
            shift
            if [ -d "$directory" ]; then find "$directory" -type f "$@" | wc -l; else echo 0; fi
          }
          linux_reports="$(count coverage-reports/linux -name jacoco.xml)"
          linux_placed="$(count coverage-reports/linux \( -path 'coverage-reports/linux/minos-*/target/site/jacoco/jacoco.xml' \
            -o -path 'coverage-reports/linux/target/site/jacoco/jacoco.xml' \))"
          windows_reports="$(count coverage-reports/windows -name jacoco.xml)"
          windows_placed="$(count coverage-reports/windows \( -path 'coverage-reports/windows/minos-*/target/site/jacoco/jacoco.xml' \
            -o -path 'coverage-reports/windows/target/site/jacoco/jacoco.xml' \))"
          echo "JaCoCo reports given to the scanner: linux=$linux_placed windows=$windows_placed"
          if [ "$linux_placed" -eq 0 ]; then
            echo "No Linux JaCoCo report: Verify (ubuntu-24.04) did not produce any." >&2
            exit 1
          fi
          if [ "$linux_reports" -ne "$linux_placed" ] || [ "$windows_reports" -ne "$windows_placed" ]; then
            echo "A JaCoCo report lies outside minos-*/target/site/jacoco/ and target/site/jacoco/: the scanner patterns would not read it." >&2
            exit 1
          fi
          if [ "$windows_placed" -eq 0 ]; then
            echo "::warning::No Windows JaCoCo report: Windows-only code will count as uncovered."
          fi

      # The scanner action is pinned by commit SHA; it downloads the scanner CLI and checks its GPG signature before
      # running it (skipSignatureVerification keeps its default, false). No sonar.java.libraries yet: the analysis
      # runs without the compile classpath, and the scanner says so in its log (limit written in supply-chain.md).
      # The fixed parameters come last, so that nothing before them can override them.
      - name: SonarCloud CI-based analysis
        uses: SonarSource/sonarqube-scan-action@70bad232163b09d998ea0707ee80c0ec80798c16 # v8.5.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >-
            -Dsonar.sources=.
            -Dsonar.inclusions=minos-*/src/main/java/**
            -Dsonar.tests=.
            -Dsonar.test.inclusions=minos-*/src/test/java/**
            -Dsonar.exclusions=minos-intellij/**
            -Dsonar.test.exclusions=minos-intellij/**
            -Dsonar.java.binaries=sonar-binaries/minos-*/target/classes,sonar-binaries/target/classes
            -Dsonar.java.test.binaries=sonar-binaries/minos-*/target/test-classes,sonar-binaries/target/test-classes
            -Dsonar.coverage.jacoco.xmlReportPaths=coverage-reports/linux/minos-*/target/site/jacoco/jacoco.xml,coverage-reports/linux/target/site/jacoco/jacoco.xml,coverage-reports/windows/minos-*/target/site/jacoco/jacoco.xml,coverage-reports/windows/target/site/jacoco/jacoco.xml
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.organization=fturleque
            -Dsonar.projectKey=FTurleque_atlas
