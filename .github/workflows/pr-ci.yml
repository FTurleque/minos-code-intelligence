name: PR Validation

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  vulnerability-scan:
    name: Dependency vulnerability gate
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@3adb4b14a2b0623876d18d863a498b785fb3752d # v2.3.8
    with:
      scan-args: |-
        --recursive
        --exclude=fixtures/**
        ./
      fail-on-vuln: true
    permissions:
      actions: read
      contents: read
      security-events: write

  verify:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Assert exact candidate HEAD (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SHA"

      - name: Assert exact candidate HEAD (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:EXPECTED_SHA) {
            throw "Exact-head mismatch: actual=$actual expected=$env:EXPECTED_SHA"
          }

      - name: Set up Java 24
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '24'
          cache: maven

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Immutable workflow supply-chain gate
        run: python scripts/quality/check-workflow-pins.py

      - name: P0-P2 audit remediation consistency
        run: python scripts/remediation/check-p0-p2.py

      - name: MINOS-01 worker resource containment gate
        run: python scripts/remediation/check-minos-01.py

      - name: Maven module-boundary fitness gate
        run: python scripts/architecture/check-module-boundaries.py

      # Provisioning the sandbox toolchain is a ~15s apt install, observed stalling for tens of
      # minutes on GitHub-hosted runners when the Azure Ubuntu mirror is degraded. apt has no overall
      # timeout on a stalled mirror, so bound each transfer -- but keep Retries LOW on purpose: the
      # runner uses a mirrorlist, and retrying a dead mirror only burns the budget the working
      # fallback (archive.ubuntu.com) needs. Fail over fast, then let the fallback finish.
      # timeout-minutes is the backstop for a genuine outage of every mirror.
      - name: Install and authorize Linux worker sandbox runtime
        if: runner.os != 'Windows'
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 update
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 install --yes --no-install-recommends \
            bubblewrap util-linux apparmor apparmor-profiles
          command -v bwrap
          command -v prlimit
          command -v unshare
          command -v setpriv
          profile='/usr/share/apparmor/extra-profiles/bwrap-userns-restrict'
          test -f "$profile"
          sudo cp "$profile" /etc/apparmor.d/minos-bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/minos-bwrap-userns-restrict

      - name: Delegate a cgroup v2 job boundary to the worker sandbox
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/ci/delegate-linux-cgroup.sh

      - name: Prepare Maven Wrapper (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: chmod +x mvnw

      # --attach-pid places THIS step's shell inside the delegated subtree while the helper is still
      # privileged, so Maven (and the sandbox tests it runs) inherit the boundary without the MINOS
      # account ever holding write access to the root cgroup.procs. Each `run:` block is a separate
      # shell, so the attach must happen in the same step as the workload.
      - name: Maven clean verify (Unix, PostgreSQL required)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci/delegate-linux-cgroup.sh --attach-pid $$
          ./mvnw -B -ntp -Dminos.postgresql.tests.required=true clean verify

      - name: Maven clean verify (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: .\mvnw.cmd -B -ntp clean verify

      - name: Targeted JaCoCo gate (full)
        if: runner.os != 'Windows'
        run: python scripts/quality/check-jacoco.py

      - name: Targeted JaCoCo gate (Windows, PostgreSQL scope qualified on Linux)
        if: runner.os == 'Windows'
        run: python scripts/quality/check-jacoco.py --skip-scope m30-postgresql-pgvector

      - name: Product facts consistency
        run: python scripts/docs/product-facts.py --check

      - name: Upload verification diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: pr-validation-${{ runner.os }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
            target/site/jacoco-aggregate/**
            target/m15-quality/**

  m28-final-linux:
    name: M28 final Linux exact-head gate
    if: github.event_name == 'pull_request' && ((github.head_ref == 'pre-m28-audit-remediation' && github.base_ref == 'develop') || (github.head_ref == 'develop' && github.base_ref == 'main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact M28 head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Set up Java 24
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '24'
          cache: maven
      - name: Set up Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      # See the Verify job: bounded per-transfer apt timeouts with deliberately low retries so a
      # degraded mirror is abandoned quickly in favour of the mirrorlist fallback.
      - name: Install and authorize Linux worker sandbox runtime
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 update
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 install --yes --no-install-recommends \
            bubblewrap util-linux apparmor apparmor-profiles
          command -v bwrap
          command -v prlimit
          profile='/usr/share/apparmor/extra-profiles/bwrap-userns-restrict'
          test -f "$profile"
          sudo cp "$profile" /etc/apparmor.d/minos-bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/minos-bwrap-userns-restrict
      - name: Delegate a cgroup v2 job boundary to the worker sandbox
        shell: bash
        run: bash scripts/ci/delegate-linux-cgroup.sh
      - name: Prepare Maven Wrapper
        run: chmod +x mvnw
      # See the Verify job: --attach-pid keeps the privileged migration in the provisioning helper
      # instead of granting the MINOS account root cgroup.procs access.
      - name: Run complete M28 Linux exact-head qualification
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci/delegate-linux-cgroup.sh --attach-pid $$
          bash scripts/remediation/run-final.sh "" 1000
      - name: Upload M28 Linux diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: m28-linux-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 30
          path: |
            target/qualification/m28/**
            target/site/jacoco-aggregate/**
            **/target/surefire-reports/**
            **/target/failsafe-reports/**

  m28-final-windows:
    name: M28 final Windows exact-head gate
    if: github.event_name == 'pull_request' && ((github.head_ref == 'pre-m28-audit-remediation' && github.base_ref == 'develop') || (github.head_ref == 'develop' && github.base_ref == 'main'))
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Checkout exact M28 head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Set up Java 24
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '24'
          cache: maven
      - name: Set up Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Run complete M28 Windows exact-head qualification
        shell: powershell
        run: .\scripts\remediation\run-final.ps1 -ProgramGraphFiles 1000
      - name: Upload M28 Windows diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: m28-windows-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 30
          path: |
            target/qualification/m28/**
            target/site/jacoco-aggregate/**
            **/target/surefire-reports/**
            **/target/failsafe-reports/**

  m15-final-exact-head:
    name: M15 final Windows exact-head gate
    if: github.event_name == 'pull_request' && github.head_ref == 'm15-finalize-s7-s11'
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Checkout exact M15 head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Assert exact M15 HEAD
        shell: powershell
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:EXPECTED_SHA) {
            throw "Exact-head mismatch: actual=$actual expected=$env:EXPECTED_SHA"
          }
      - name: Set up Java 24
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '24'
          cache: maven
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Run complete M15 final qualification
        shell: powershell
        run: .\scripts\m15\run-final.ps1
      - name: Upload final M15 diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: m15-final-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 30
          path: |
            target/m15-baseline/**
            target/m15-final/**
            target/m15-quality/**
            target/site/jacoco-aggregate/**
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
