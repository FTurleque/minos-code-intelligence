name: PR Validation

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number || github.ref }}
  # Never cancel a push-triggered run on develop/main: only a duplicate PR run is obsolete.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  vulnerability-scan:
    name: Dependency vulnerability gate
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@8ac9e5ce44cc7178e0e04229a91bdcc003166e57 # v2.3.8
    with:
      # The scanner recognises an npm lockfile by its file name (package-lock.json). The two lockfiles shipped
      # with the product are prefixed with the name of their tool, so --recursive does not see them: each is
      # passed explicitly, parsed as a package-lock.json (AUD-DEP-03). scripts/quality/check-ci-wiring.py fails
      # when a lockfile under a src/main/resources directory is missing from this list.
      scan-args: |-
        --recursive
        --experimental-exclude=g:**/fixtures/**
        --lockfile=package-lock.json:minos-provider-scip/src/main/resources/com/minos/adapter/scip/runtime/scip-python-package-lock.json
        --lockfile=package-lock.json:minos-provider-scip/src/main/resources/com/minos/adapter/scip/runtime/scip-typescript-package-lock.json
        ./
      fail-on-vuln: true
    permissions:
      actions: read
      contents: read
      security-events: write

  # Every static/textual invariant gate that does not need a Maven build, run exactly once
  # (Python-only, no Java/Maven setup) instead of once per OS or once per now-retired
  # remediation workflow. Formerly split across pr-ci's own OS matrix plus
  # mnd-remediation.yml, mne-remediation.yml, post-mne-remediation.yml and
  # post-228-hardening.yml (see docs/audit/archive/2026-09/CI-HYGIENE-SUIVI.md for the inventory that
  # justified each merge).
  invariants:
    name: Static invariants (single run)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Assert exact candidate HEAD
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Immutable workflow supply-chain gate
        run: python scripts/quality/check-workflow-pins.py

      - name: Single execution gate (Maven verify, product facts, JaCoCo and sandbox toolchain run once per OS, here only)
        run: python scripts/quality/check-single-execution.py

      - name: Single execution gate self-test
        run: python scripts/quality/test_check_single_execution.py -v

      - name: Container image pin gate (image:tag@sha256, one source per managed-service image)
        run: python scripts/quality/check-image-pins.py

      - name: Container image pin gate self-test
        run: python scripts/quality/test_check_image_pins.py -v

      - name: Compose resource limits gate (CPU, memory and PID ceiling on every service)
        run: python scripts/quality/check-compose-limits.py

      - name: Compose resource limits gate self-test
        run: python scripts/quality/test_check_compose_limits.py -v

      - name: Toolchain baseline gate (the Gradle wrapper, the policy and the release workflows state one version)
        run: python scripts/quality/check-toolchain-baseline.py

      - name: Toolchain baseline gate self-test
        run: python scripts/quality/test_check_toolchain_baseline.py -v

      - name: Installation secret file tests (declared skipped here, executed on Windows in the verify job)
        run: python scripts/install/test_secret_file_acl.py -v

      - name: Development launcher tests (declared skipped here, executed on Windows in the verify job)
        run: python scripts/install/test_dev_launcher.py -v

      - name: Docker lifecycle query-image tests (pwsh here, Windows PowerShell 5.1 and pwsh in the verify job)
        run: python scripts/install/test_mcp_lifecycle_query_image.py -v

      - name: Delegated cgroup root validation tests (provisioning scripts run with a recording sudo)
        run: python scripts/deploy/test_cgroup_root_validation.py -v

      - name: Shipped tools gate (one description shared by Java, the Docker image and the Windows distribution)
        run: python scripts/quality/check-tools-manifest.py

      - name: Shipped tools gate and payload builder self-tests
        run: |
          python scripts/quality/test_check_tools_manifest.py -v
          python scripts/release/test_build_embedded_tools.py -v

      # The watch itself queries an advisory service and runs on a schedule (embedded-tools-advisories.yml):
      # an advisory published during the week must not fail an unrelated pull request. Only its self-test,
      # which uses simulated answers and no network, runs here; it also proves that the tables of the script
      # know every entry of the catalogue and every jar of the classpath lock.
      - name: Embedded tools advisory watch self-test (simulated answers, no network)
        run: python scripts/quality/check-embedded-tools-advisories.py --self-test

      - name: Maven module-boundary fitness gate
        run: python scripts/architecture/check-module-boundaries.py

      - name: Module-boundary checker self-test (A3 packages, A7 reactor)
        run: python scripts/architecture/test_check_module_boundaries.py -v

      - name: Private I/O primitives gate (no raw createDirectories, write, newInputStream or channel lock)
        run: python scripts/architecture/check-private-io.py

      - name: Private I/O gate self-test (one witness mutation per forbidden call)
        run: python scripts/architecture/test_check_private_io.py -v

      - name: Current documentation consistency
        run: python scripts/docs/check-current-docs.py

      - name: Product facts consistency
        run: python scripts/docs/product-facts.py --check

      - name: Milestone artifact reference guard
        run: python scripts/quality/check-milestone-artifact-references.py

      - name: CI wiring gate (required checks resolve to jobs that can report; every gate self-test runs here)
        run: python scripts/quality/check-ci-wiring.py

      - name: CI wiring, ruleset comparison and plugin gate self-tests
        run: |
          python scripts/quality/test_check_ci_wiring.py -v
          python scripts/quality/test_verify_ruleset.py -v
          python scripts/ci/test_plugin_gate.py -v

      - name: JaCoCo gate self-test (decision logic on synthetic reports; the gate itself runs in the verify jobs)
        run: python scripts/quality/check-jacoco.py --self-test

      - name: Milestone artifact reference guard self-test
        run: python scripts/quality/check-milestone-artifact-references.py --self-test

      - name: Partial-result consumer gate (heuristic, see its docstring for what it cannot see)
        run: python scripts/quality/check-partial-result-consumers.py

      - name: Partial-result consumer gate self-test, shared-list and script-function tests
        run: |
          python scripts/quality/check-partial-result-consumers.py --self-test
          python scripts/lib/test_minos_exit_code.py -v

      - name: MND remediation invariants
        run: python scripts/remediation/check-mnd.py

      - name: MNE remediation invariants
        run: python scripts/remediation/check-mne.py

      - name: Post-MNE structural remediation invariants (includes the active milestone gates)
        run: python scripts/remediation/check-post-mne.py

      - name: Post-228 static invariants
        run: python scripts/remediation/check-post228-hardening.py

      - name: Audit remediation v2 invariants
        run: python scripts/remediation/check-audit-remediation-v2.py

      - name: P0-P2 audit remediation consistency
        run: python scripts/remediation/check-p0-p2.py

      - name: MINOS-01 worker resource containment gate
        run: python scripts/remediation/check-minos-01.py

      - name: Inno Setup provenance rules
        shell: pwsh
        run: ./scripts/release/test-iscc-provenance.ps1

      - name: Docker upgrade evidence checker unit tests
        run: python scripts/release/test_check_docker_upgrade_evidence.py -v

  # The ONLY Maven build of a pull request, and so the only executor of the JaCoCo gate, the
  # Linux sandbox toolchain and the delegated cgroup. The path-filtered
  # M19 and M20 workflows used to repeat this exact job on a subset of paths (audit C2); they were
  # retired because nothing they asserted was missing here (docs/audit/archive/2026-09/S23-SUIVI.md, "Lot 3").
  # scripts/quality/check-single-execution.py keeps a second copy from coming back.
  verify:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}

    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      # Docker Hub limits anonymous pulls per runner address (429 toomanyrequests on 2026-10-09 stopped base images,
      # pgvector for the PostgreSQL tests, and the Docker qualifications). With the repository secrets
      # DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (a read-only access token), pulls are authenticated, Testcontainers
      # included; without them (forks, secrets not created) this step is skipped and pulls stay anonymous.
      - name: Log in to Docker Hub (when the secrets exist)
        if: ${{ runner.os == 'Linux' && env.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Assert exact candidate HEAD (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SHA"

      - name: Assert exact candidate HEAD (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:EXPECTED_SHA) {
            throw "Exact-head mismatch: actual=$actual expected=$env:EXPECTED_SHA"
          }

      - name: Require main ancestry in every candidate
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            echo 'main is not an ancestor of the candidate HEAD. Synchronize main into develop before continuing.' >&2
            exit 1
          fi

      - name: Set up Java 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install and authorize Linux worker sandbox runtime
        if: runner.os != 'Windows'
        timeout-minutes: 10
        shell: bash
        run: bash scripts/ci/install-linux-sandbox-toolchain.sh

      - name: Delegate a cgroup v2 job boundary to the worker sandbox
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/ci/delegate-linux-cgroup.sh

      - name: Prepare Maven Wrapper (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: chmod +x mvnw

      - name: Maven clean verify (Unix, PostgreSQL required)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci/delegate-linux-cgroup.sh --attach-pid $$
          ./mvnw -B -ntp -Dminos.postgresql.tests.required=true -Dminos.sandbox.tests.required=true clean verify

      - name: Maven clean verify (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: .\mvnw.cmd -B -ntp "-Dminos.sandbox.tests.required=true" clean verify

      - name: Targeted JaCoCo gate (full)
        if: runner.os != 'Windows'
        run: python scripts/quality/check-jacoco.py

      # AUD-SEC-12, AUD-SEC-13: the installation scripts and the development launcher are Windows code that no
      # Maven module runs. Their tests are skipped in the invariants job (Ubuntu) and really run here.
      - name: Installation secret file and development launcher tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python scripts/install/test_secret_file_acl.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/install/test_dev_launcher.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # AUD-DEP-15: the Docker lifecycle script is started by the installer under Windows PowerShell 5.1.
          python scripts/install/test_mcp_lifecycle_query_image.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Targeted JaCoCo gate (Windows, PostgreSQL scope qualified on Linux)
        if: runner.os == 'Windows'
        run: python scripts/quality/check-jacoco.py --skip-scope m30-postgresql-pgvector

      # The JaCoCo report of every module on this operating system, for the SonarCloud job below. Linux cannot
      # run the AppContainer and Job Object code, Windows cannot run bubblewrap and cgroup: each side covers
      # what the other cannot. The scanner reads coverage module by module, from a path relative to the module:
      # the aggregate report of the reactor root is not attached to any source file (regression of 2026-10-12,
      # when only that aggregate was published and every new line counted as uncovered). The XML names packages
      # and source files, never a path of the runner.
      - name: Upload the JaCoCo report of every module
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jacoco-modules-${{ runner.os }}
          # A re-run of this job replaces the reports of the previous attempt: the analysis reads the latest.
          overwrite: true
          if-no-files-found: ignore
          retention-days: 3
          path: '**/target/site/jacoco/jacoco.xml'

      - name: Upload verification diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-validation-${{ runner.os }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
            target/site/jacoco-aggregate/**
            target/m15-quality/**

  # CI-based SonarCloud analysis (Automatic Analysis is off in the SonarCloud project: the two modes are
  # mutually exclusive). It runs after both Verify jobs and imports the coverage of both operating systems;
  # until 2026-10-12 it ran inside the Ubuntu Verify job with the Linux reports alone, so code that only
  # Windows can execute counted as uncovered. It compiles the candidate again (no test is run: the tests ran
  # in Verify) because the scanner needs the class files. No effect while the repository variable is unset.
  # Each module receives its Linux report at target/site/jacoco/jacoco.xml and its Windows report at
  # target/site/jacoco-windows/jacoco.xml: the scanner resolves both paths from the module directory.
  # When a Verify job failed and left no report, the analysis still runs with the reports that exist, so that
  # issues are reported; the Linux reports are required, and the job fails if the scanner imported fewer
  # reports than there are modules with one (a silent zero-coverage analysis is refused).
  sonar:
    name: SonarCloud analysis (Linux and Windows coverage)
    needs: verify
    if: ${{ !cancelled() && vars.SONAR_CI_ANALYSIS_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # One step per operating system, each in its own directory. Reports are absent when a Verify job failed
      # before its tests ended: the download then fails and the analysis step decides what to do without them.
      - name: Download the Linux JaCoCo reports
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: jacoco-modules-Linux
          path: coverage-reports/linux

      - name: Download the Windows JaCoCo reports
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: jacoco-modules-Windows
          path: coverage-reports/windows

      - name: SonarCloud CI-based analysis
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SONAR_TOKEN:-}" ]; then
            echo "SONAR_TOKEN is not available to this run. GitHub does not give the repository secrets to Dependabot" >&2
            echo "pull requests or to forks: for Dependabot, add SONAR_TOKEN to the Dependabot secrets of the repository." >&2
            exit 1
          fi
          # Puts every downloaded report inside its module, where the scanner looks for it.
          place_reports() {
            local source="$1" directory="$2" count=0 report module
            if [ -d "$source" ]; then
              while IFS= read -r report; do
                module="${report#"$source"/}"
                module="${module%%/*}"
                if [ -f "$module/pom.xml" ]; then
                  mkdir -p "$module/target/site/$directory"
                  cp "$report" "$module/target/site/$directory/jacoco.xml"
                  count=$((count + 1))
                fi
              done < <(find "$source" -type f -path '*/target/site/jacoco/jacoco.xml' | sort)
            fi
            echo "$count"
          }
          linux_modules="$(place_reports coverage-reports/linux jacoco)"
          windows_modules="$(place_reports coverage-reports/windows jacoco-windows)"
          echo "JaCoCo reports placed in their module: linux=$linux_modules windows=$windows_modules"
          if [ "$linux_modules" -eq 0 ]; then
            echo "No Linux JaCoCo report: Verify (ubuntu-24.04) did not produce any." >&2
            exit 1
          fi
          if [ "$windows_modules" -eq 0 ]; then
            echo "::warning::No Windows JaCoCo report: Windows-only code will count as uncovered."
          fi
          chmod +x mvnw
          ./mvnw -B -ntp -DskipTests -Djacoco.skip=true test-compile \
            org.sonarsource.scanner.maven:sonar-maven-plugin:5.1.0.4751:sonar \
            -Dsonar.projectKey=FTurleque_atlas \
            -Dsonar.organization=fturleque \
            -Dsonar.host.url=https://sonarcloud.io \
            "-Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml,target/site/jacoco-windows/jacoco.xml" \
            | tee sonar-scanner.log
          # The scanner does not fail when it finds no report: it reports zero coverage. Count what it imported.
          importing_modules="$(grep -c 'Importing [0-9][0-9]* report(s)' sonar-scanner.log || true)"
          echo "Modules for which the scanner imported coverage: $importing_modules (expected at least $linux_modules)"
          if [ "$importing_modules" -lt "$linux_modules" ]; then
            echo "The scanner imported coverage for $importing_modules module(s), fewer than the $linux_modules with a report." >&2
            exit 1
          fi
