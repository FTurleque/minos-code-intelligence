name: Publish MINOS v1.0.1 one-shot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v1.0.1-one-shot.yml'

permissions:
  actions: read
  contents: write
  issues: write

concurrency:
  group: publish-minos-v1.0.1-one-shot
  cancel-in-progress: false

jobs:
  publish:
    name: Replace legacy release and publish tested v1.0.1
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: '1.0.1'
      RELEASE_TAG: 'v1.0.1'
      RELEASE_COMMIT: 'f762025d66e33c40324c811079f1527d122f90f9'
      LEGACY_TAG_COMMIT: '2de847bdc6bc39e63715f20987a30f07731cc717'
      LEGACY_RELEASE_PUBLISHED_AT: '2026-08-04T12:59:21Z'

    steps:
      - name: Checkout publication trigger
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Report publication start
        shell: pwsh
        run: |
          gh issue comment 106 --repo $env:GITHUB_REPOSITORY --body "## Publication finale v1.0.1 démarrée`n`nRun transactionnel : $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID`n`nCible immuable testée : ``$env:RELEASE_COMMIT``. L'ancienne Release/tag ne sera supprimée qu'après la requalification complète."

      - name: Guard exact tested commit and exact legacy release
        shell: pwsh
        run: |
          $triggerHead = (git rev-parse HEAD).Trim()
          git merge-base --is-ancestor $env:RELEASE_COMMIT $triggerHead
          if ($LASTEXITCODE -ne 0) {
            throw "Tested release commit $env:RELEASE_COMMIT is not an ancestor of publication trigger $triggerHead."
          }

          git fetch origin --tags --force
          $tagLines = @(git ls-remote --tags origin "refs/tags/$env:RELEASE_TAG")
          if ($LASTEXITCODE -ne 0 -or $tagLines.Count -ne 1) {
            throw "Expected exactly one historical $env:RELEASE_TAG tag before replacement; found $($tagLines.Count)."
          }
          $tagCommit = (($tagLines[0] -split '\s+')[0]).Trim()
          if ($tagCommit -ne $env:LEGACY_TAG_COMMIT) {
            throw "Historical tag moved unexpectedly: expected=$env:LEGACY_TAG_COMMIT actual=$tagCommit."
          }

          $releaseJson = gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json name,tagName,targetCommitish,url,isDraft,isPrerelease,createdAt,publishedAt,assets,body
          if ($LASTEXITCODE -ne 0) { throw "Expected legacy GitHub Release $env:RELEASE_TAG is missing." }
          $legacy = $releaseJson | ConvertFrom-Json
          if ($legacy.tagName -ne $env:RELEASE_TAG -or $legacy.publishedAt -ne $env:LEGACY_RELEASE_PUBLISHED_AT) {
            throw "Existing release is not the authorized legacy release; refusing replacement. tag=$($legacy.tagName) publishedAt=$($legacy.publishedAt)"
          }
          if ($legacy.isDraft -or $legacy.isPrerelease) {
            throw 'Authorized legacy release was expected to be a normal published release.'
          }

          $expectedLegacyAssets = @(
            'MINOS-1.0.1-THIRD-PARTY-NOTICES.txt',
            'MINOS-1.0.1-THIRD-PARTY-NOTICES.txt.sha256',
            'MINOS-1.0.1-windows-x64-setup.exe',
            'MINOS-1.0.1-windows-x64-setup.exe.sha256',
            'minos-1.0.1-windows-x64.zip',
            'minos-1.0.1-windows-x64.zip.sha256',
            'minos-1.0.1.cdx.json',
            'minos-1.0.1.cdx.json.sha256',
            'minos-intellij-1.0.1.zip',
            'minos-intellij-1.0.1.zip.sha256'
          )
          $actualLegacyAssets = @($legacy.assets | ForEach-Object { $_.name } | Sort-Object)
          $expectedSorted = @($expectedLegacyAssets | Sort-Object)
          if (($actualLegacyAssets -join "`n") -ne ($expectedSorted -join "`n")) {
            throw "Legacy release assets changed unexpectedly.`nExpected:`n$($expectedSorted -join "`n")`nActual:`n$($actualLegacyAssets -join "`n")"
          }
          Write-Host "Legacy release guard PASS: tag=$tagCommit publishedAt=$($legacy.publishedAt) assets=$($actualLegacyAssets.Count)"

      - name: Back up legacy release metadata and all assets
        shell: pwsh
        run: |
          $backup = Join-Path $env:RUNNER_TEMP 'minos-v1.0.1-legacy-release'
          $assets = Join-Path $backup 'assets'
          New-Item -ItemType Directory -Force -Path $assets | Out-Null
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json name,tagName,targetCommitish,url,isDraft,isPrerelease,createdAt,publishedAt,assets,body | Out-File -LiteralPath (Join-Path $backup 'release.json') -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'Unable to save legacy release metadata.' }
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --dir $assets
          if ($LASTEXITCODE -ne 0) { throw 'Unable to back up all legacy release assets.' }
          $downloaded = @(Get-ChildItem -LiteralPath $assets -File)
          if ($downloaded.Count -ne 10) { throw "Expected 10 legacy assets in backup; found $($downloaded.Count)." }
          Write-Host "Legacy release backup complete: $backup"

      - name: Checkout exact user-tested release commit
        shell: pwsh
        run: |
          git checkout --detach $env:RELEASE_COMMIT
          $head = (git rev-parse HEAD).Trim()
          if ($head -ne $env:RELEASE_COMMIT) {
            throw "Exact release checkout mismatch: expected=$env:RELEASE_COMMIT actual=$head"
          }
          if (@(git status --porcelain=v1 --untracked-files=all).Count -gt 0) {
            throw 'Release checkout is dirty.'
          }

      - name: Set up Java 21 for IntelliJ validation
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.1'
          cache-provider: basic

      - name: IntelliJ unit/build/structure gates
        working-directory: minos-intellij
        shell: pwsh
        run: gradle --no-daemon test buildPlugin verifyPluginProjectConfiguration verifyPluginStructure

      - name: IntelliJ Plugin Verifier
        working-directory: minos-intellij
        shell: pwsh
        run: gradle --no-daemon verifyPlugin

      - name: Prepare IntelliJ release asset and checksum
        shell: pwsh
        run: |
          $pluginZips = @(Get-ChildItem -LiteralPath 'minos-intellij\build\distributions' -Filter '*.zip' -File)
          if ($pluginZips.Count -ne 1) { throw "Expected exactly one IntelliJ plugin ZIP; found $($pluginZips.Count)." }
          $pluginZip = $pluginZips[0]
          if ($pluginZip.Name -ne 'minos-intellij-1.0.1.zip') { throw "Unexpected IntelliJ ZIP name: $($pluginZip.Name)" }
          $sidecar = "$($pluginZip.FullName).sha256"
          $hash = (Get-FileHash -LiteralPath $pluginZip.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($pluginZip.Name)" | Set-Content -LiteralPath $sidecar -Encoding ascii
          "PLUGIN_ZIP=$($pluginZip.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PLUGIN_SHA=$sidecar" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "IntelliJ release asset: $($pluginZip.Name) sha256=$hash"

      - name: Set up Java 24 for MINOS release
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '24'
          cache: maven

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Rebuild and validate exact release candidate before any deletion
        shell: pwsh
        run: |
          .\scripts\release\publish-windows-release.ps1 `
            -Version $env:RELEASE_VERSION `
            -TargetCommit $env:RELEASE_COMMIT `
            -ValidateOnly

      - name: Recheck unchanged legacy state then remove old release and tag
        shell: pwsh
        run: |
          $tagLines = @(git ls-remote --tags origin "refs/tags/$env:RELEASE_TAG")
          if ($LASTEXITCODE -ne 0 -or $tagLines.Count -ne 1) { throw 'Legacy tag disappeared or became ambiguous before replacement.' }
          $tagCommit = (($tagLines[0] -split '\s+')[0]).Trim()
          if ($tagCommit -ne $env:LEGACY_TAG_COMMIT) { throw "Legacy tag changed before replacement: $tagCommit" }

          $legacy = (gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json tagName,publishedAt,assets | ConvertFrom-Json)
          if ($LASTEXITCODE -ne 0 -or $legacy.tagName -ne $env:RELEASE_TAG -or $legacy.publishedAt -ne $env:LEGACY_RELEASE_PUBLISHED_AT) {
            throw 'Legacy release changed before replacement.'
          }
          if (@($legacy.assets).Count -ne 10) { throw 'Legacy release asset count changed before replacement.' }

          gh release delete $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --yes
          if ($LASTEXITCODE -ne 0) { throw 'Unable to delete authorized legacy GitHub Release.' }
          'LEGACY_RELEASE_REMOVED=true' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          git push origin ":refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw 'Unable to delete authorized legacy tag.' }
          'LEGACY_TAG_REMOVED=true' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $remainingTag = @(git ls-remote --tags origin "refs/tags/$env:RELEASE_TAG")
          if ($remainingTag.Count -ne 0) { throw 'v1.0.1 tag still exists after authorized deletion.' }
          $previous = $ErrorActionPreference
          try {
            $ErrorActionPreference = 'Continue'
            gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
            $releaseExists = ($LASTEXITCODE -eq 0)
          }
          finally { $ErrorActionPreference = $previous }
          $global:LASTEXITCODE = 0
          if ($releaseExists) { throw 'v1.0.1 release still exists after authorized deletion.' }
          Write-Host 'Authorized legacy Release and tag removed after full requalification.'

      - name: Publish immutable GitHub Release from validated Windows assets
        shell: pwsh
        run: |
          .\scripts\release\publish-windows-release.ps1 `
            -Version $env:RELEASE_VERSION `
            -TargetCommit $env:RELEASE_COMMIT `
            -SkipBuild

      - name: Add validated IntelliJ plugin assets
        shell: pwsh
        run: |
          gh release upload $env:RELEASE_TAG $env:PLUGIN_ZIP $env:PLUGIN_SHA --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Unable to upload IntelliJ plugin assets to v1.0.1.' }

      - name: Verify final tag release assets and checksums
        shell: pwsh
        run: |
          $tagLines = @(git ls-remote --tags origin "refs/tags/$env:RELEASE_TAG")
          if ($LASTEXITCODE -ne 0 -or $tagLines.Count -ne 1) { throw 'Final v1.0.1 tag is missing or ambiguous.' }
          $tagCommit = (($tagLines[0] -split '\s+')[0]).Trim()
          if ($tagCommit -ne $env:RELEASE_COMMIT) { throw "Final tag mismatch: expected=$env:RELEASE_COMMIT actual=$tagCommit" }

          $release = (gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json name,tagName,url,isDraft,isPrerelease,assets | ConvertFrom-Json)
          if ($LASTEXITCODE -ne 0) { throw 'Final GitHub Release is missing.' }
          if ($release.tagName -ne $env:RELEASE_TAG -or $release.isDraft -or $release.isPrerelease) { throw 'Final release state is invalid.' }

          $expected = @(
            'MINOS-1.0.1-THIRD-PARTY-NOTICES.txt',
            'MINOS-1.0.1-THIRD-PARTY-NOTICES.txt.sha256',
            'MINOS-1.0.1-windows-x64-setup.exe',
            'MINOS-1.0.1-windows-x64-setup.exe.sha256',
            'minos-1.0.1-windows-x64.zip',
            'minos-1.0.1-windows-x64.zip.sha256',
            'minos-1.0.1.cdx.json',
            'minos-1.0.1.cdx.json.sha256',
            'minos-intellij-1.0.1.zip',
            'minos-intellij-1.0.1.zip.sha256'
          ) | Sort-Object
          $actual = @($release.assets | ForEach-Object { $_.name } | Sort-Object)
          if (($expected -join "`n") -ne ($actual -join "`n")) {
            throw "Final release asset set mismatch.`nExpected:`n$($expected -join "`n")`nActual:`n$($actual -join "`n")"
          }

          $verifyDir = Join-Path $env:RUNNER_TEMP 'minos-v1.0.1-final-verification'
          New-Item -ItemType Directory -Force -Path $verifyDir | Out-Null
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --dir $verifyDir
          if ($LASTEXITCODE -ne 0) { throw 'Unable to download final release for checksum verification.' }

          function Assert-ShaSidecar([string] $PayloadName, [string] $SidecarName) {
            $payload = Join-Path $verifyDir $PayloadName
            $sidecar = Join-Path $verifyDir $SidecarName
            if (-not (Test-Path -LiteralPath $payload -PathType Leaf) -or -not (Test-Path -LiteralPath $sidecar -PathType Leaf)) {
              throw "Missing payload/checksum pair: $PayloadName / $SidecarName"
            }
            $expectedHash = ((Get-Content -LiteralPath $sidecar -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
            $actualHash = (Get-FileHash -LiteralPath $payload -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($expectedHash -ne $actualHash) { throw "SHA-256 mismatch for $PayloadName expected=$expectedHash actual=$actualHash" }
          }

          Assert-ShaSidecar 'MINOS-1.0.1-windows-x64-setup.exe' 'MINOS-1.0.1-windows-x64-setup.exe.sha256'
          Assert-ShaSidecar 'minos-1.0.1-windows-x64.zip' 'minos-1.0.1-windows-x64.zip.sha256'
          Assert-ShaSidecar 'minos-1.0.1.cdx.json' 'minos-1.0.1.cdx.json.sha256'
          Assert-ShaSidecar 'MINOS-1.0.1-THIRD-PARTY-NOTICES.txt' 'MINOS-1.0.1-THIRD-PARTY-NOTICES.txt.sha256'
          Assert-ShaSidecar 'minos-intellij-1.0.1.zip' 'minos-intellij-1.0.1.zip.sha256'

          "FINAL_RELEASE_URL=$($release.url)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "FINAL MINOS v1.0.1 RELEASE VERIFIED: $($release.url) tag=$tagCommit assets=$($actual.Count)"

      - name: Report publication success
        shell: pwsh
        run: |
          gh issue comment 106 --repo $env:GITHUB_REPOSITORY --body "## MINOS v1.0.1 publiée et vérifiée ✅`n`n- Tag : ``v1.0.1`` → ``$env:RELEASE_COMMIT```n- Release : $env:FINAL_RELEASE_URL`n- 10 assets vérifiés (Windows + supply-chain + plugin IntelliJ)`n- 5 paires payload/SHA-256 re-téléchargées et vérifiées`n- Run : $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"

      - name: Restore legacy release if replacement fails
        if: failure() && env.LEGACY_RELEASE_REMOVED == 'true'
        shell: pwsh
        run: |
          $backup = Join-Path $env:RUNNER_TEMP 'minos-v1.0.1-legacy-release'
          $metadataPath = Join-Path $backup 'release.json'
          $assetDir = Join-Path $backup 'assets'
          if (-not (Test-Path -LiteralPath $metadataPath -PathType Leaf) -or -not (Test-Path -LiteralPath $assetDir -PathType Container)) {
            throw 'Legacy release backup is missing; automatic restoration cannot proceed.'
          }
          $legacy = Get-Content -LiteralPath $metadataPath -Raw | ConvertFrom-Json

          $previous = $ErrorActionPreference
          try {
            $ErrorActionPreference = 'Continue'
            gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
            $newReleaseExists = ($LASTEXITCODE -eq 0)
          }
          finally { $ErrorActionPreference = $previous }
          $global:LASTEXITCODE = 0
          if ($newReleaseExists) {
            gh release delete $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --yes
            if ($LASTEXITCODE -ne 0) { throw 'Unable to remove incomplete replacement release before legacy restoration.' }
          }

          $remoteTag = @(git ls-remote --tags origin "refs/tags/$env:RELEASE_TAG")
          if ($remoteTag.Count -gt 0) {
            if ($remoteTag.Count -ne 1) { throw 'Ambiguous v1.0.1 tag during legacy restoration.' }
            $currentTag = (($remoteTag[0] -split '\s+')[0]).Trim()
            if ($currentTag -ne $env:RELEASE_COMMIT -and $currentTag -ne $env:LEGACY_TAG_COMMIT) {
              throw "Refusing to delete unexpected v1.0.1 tag during restoration: $currentTag"
            }
            git push origin ":refs/tags/$env:RELEASE_TAG"
            if ($LASTEXITCODE -ne 0) { throw 'Unable to clear v1.0.1 tag before legacy restoration.' }
          }

          git push origin "$($env:LEGACY_TAG_COMMIT):refs/tags/$($env:RELEASE_TAG)"
          if ($LASTEXITCODE -ne 0) { throw 'Unable to restore legacy v1.0.1 tag.' }

          $bodyPath = Join-Path $backup 'legacy-body.md'
          [System.IO.File]::WriteAllText($bodyPath, [string]$legacy.body, [System.Text.UTF8Encoding]::new($false))
          $assetPaths = @(Get-ChildItem -LiteralPath $assetDir -File | ForEach-Object { $_.FullName })
          if ($assetPaths.Count -ne 10) { throw "Legacy backup asset count changed: $($assetPaths.Count)" }
          & gh release create $env:RELEASE_TAG @assetPaths --repo $env:GITHUB_REPOSITORY --verify-tag --title ([string]$legacy.name) --notes-file $bodyPath
          if ($LASTEXITCODE -ne 0) { throw 'Unable to restore legacy GitHub Release after replacement failure.' }
          gh issue comment 106 --repo $env:GITHUB_REPOSITORY --body "⚠️ Publication finale v1.0.1 échouée après suppression de l'ancien état. L'ancienne Release et son tag ont été restaurés automatiquement sur ``$env:LEGACY_TAG_COMMIT``. Run : $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"

      - name: Report failure before destructive replacement
        if: failure() && env.LEGACY_RELEASE_REMOVED != 'true'
        shell: pwsh
        run: |
          gh issue comment 106 --repo $env:GITHUB_REPOSITORY --body "❌ Publication finale v1.0.1 arrêtée **avant toute suppression de l'ancienne Release/tag**. Aucun état publié n'a été modifié. Run : $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"

      - name: Preserve publication evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: minos-1.0.1-publication-transaction
          retention-days: 30
          if-no-files-found: warn
          path: |
            target/dist/MINOS-1.0.1-windows-x64-setup.exe
            target/dist/MINOS-1.0.1-windows-x64-setup.exe.sha256
            target/dist/minos-1.0.1-windows-x64.zip
            target/dist/minos-1.0.1-windows-x64.zip.sha256
            target/dist/minos-1.0.1.cdx.json
            target/dist/minos-1.0.1.cdx.json.sha256
            target/dist/MINOS-1.0.1-THIRD-PARTY-NOTICES.txt
            target/dist/MINOS-1.0.1-THIRD-PARTY-NOTICES.txt.sha256
            minos-intellij/build/distributions/*.zip
            minos-intellij/build/distributions/*.sha256
            minos-intellij/build/reports/**
            minos-intellij/build/test-results/**
            ${{ runner.temp }}/minos-v1.0.1-legacy-release/**
            ${{ runner.temp }}/minos-v1.0.1-final-verification/**
