name: Publish MINOS v1.0.1 one-shot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v1.0.1-one-shot.yml'

permissions:
  contents: write

concurrency:
  group: publish-minos-v1.0.1-one-shot
  cancel-in-progress: false

jobs:
  publish:
    name: Replace legacy tag and publish tested v1.0.1
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: '1.0.1'
      RELEASE_TAG: 'v1.0.1'
      RELEASE_COMMIT: 'f762025d66e33c40324c811079f1527d122f90f9'
      LEGACY_TAG_COMMIT: '2de847bdc6bc39e63715f20987a30f07731cc717'

    steps:
      - name: Checkout publication trigger
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Guard exact tested commit and legacy tag
        shell: pwsh
        run: |
          $triggerHead = (git rev-parse HEAD).Trim()
          git merge-base --is-ancestor $env:RELEASE_COMMIT $triggerHead
          if ($LASTEXITCODE -ne 0) {
            throw "Tested release commit $env:RELEASE_COMMIT is not an ancestor of publication trigger $triggerHead."
          }

          git fetch origin --tags --force
          $tagLines = @(git ls-remote --tags origin "refs/tags/$env:RELEASE_TAG")
          if ($LASTEXITCODE -ne 0) { throw "Unable to inspect $env:RELEASE_TAG." }
          if ($tagLines.Count -ne 1) {
            throw "Expected exactly one historical $env:RELEASE_TAG tag before replacement; found $($tagLines.Count)."
          }
          $tagCommit = (($tagLines[0] -split '\s+')[0]).Trim()
          if ($tagCommit -ne $env:LEGACY_TAG_COMMIT) {
            throw "Historical tag moved unexpectedly: expected=$env:LEGACY_TAG_COMMIT actual=$tagCommit."
          }

          $previous = $ErrorActionPreference
          try {
            $ErrorActionPreference = 'Continue'
            gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
            $releaseProbe = $LASTEXITCODE
          }
          finally { $ErrorActionPreference = $previous }
          if ($releaseProbe -eq 0) {
            throw "GitHub Release $env:RELEASE_TAG already exists; refusing replacement."
          }
          $global:LASTEXITCODE = 0
          Write-Host "Publication guard PASS: tested commit=$env:RELEASE_COMMIT legacy tag=$tagCommit release absent."

      - name: Checkout exact user-tested release commit
        shell: pwsh
        run: |
          git checkout --detach $env:RELEASE_COMMIT
          $head = (git rev-parse HEAD).Trim()
          if ($head -ne $env:RELEASE_COMMIT) {
            throw "Exact release checkout mismatch: expected=$env:RELEASE_COMMIT actual=$head"
          }
          if (@(git status --porcelain=v1 --untracked-files=all).Count -gt 0) {
            throw 'Release checkout is dirty.'
          }

      - name: Set up Java 21 for IntelliJ validation
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.1'
          cache-provider: basic

      - name: IntelliJ unit/build/structure gates
        working-directory: minos-intellij
        shell: pwsh
        run: gradle --no-daemon test buildPlugin verifyPluginProjectConfiguration verifyPluginStructure

      - name: IntelliJ Plugin Verifier
        working-directory: minos-intellij
        shell: pwsh
        run: gradle --no-daemon verifyPlugin

      - name: Set up Java 24 for MINOS release
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '24'
          cache: maven

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Rebuild and validate exact release candidate before tag replacement
        shell: pwsh
        run: |
          .\scripts\release\publish-windows-release.ps1 `
            -Version $env:RELEASE_VERSION `
            -TargetCommit $env:RELEASE_COMMIT `
            -ValidateOnly

      - name: Replace only the known historical v1.0.1 tag
        shell: pwsh
        run: |
          $tagLines = @(git ls-remote --tags origin "refs/tags/$env:RELEASE_TAG")
          if ($LASTEXITCODE -ne 0 -or $tagLines.Count -ne 1) {
            throw "Historical tag disappeared or became ambiguous before replacement."
          }
          $tagCommit = (($tagLines[0] -split '\s+')[0]).Trim()
          if ($tagCommit -ne $env:LEGACY_TAG_COMMIT) {
            throw "Historical tag changed before replacement: expected=$env:LEGACY_TAG_COMMIT actual=$tagCommit."
          }
          git push origin ":refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw "Unable to delete historical $env:RELEASE_TAG." }
          'LEGACY_TAG_REMOVED=true' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Removed historical $env:RELEASE_TAG at $env:LEGACY_TAG_COMMIT after full release validation."

      - name: Publish immutable GitHub Release from validated assets
        shell: pwsh
        run: |
          .\scripts\release\publish-windows-release.ps1 `
            -Version $env:RELEASE_VERSION `
            -TargetCommit $env:RELEASE_COMMIT `
            -SkipBuild

      - name: Restore historical tag if publication failed before creating the release
        if: failure() && env.LEGACY_TAG_REMOVED == 'true'
        shell: pwsh
        run: |
          $previous = $ErrorActionPreference
          try {
            $ErrorActionPreference = 'Continue'
            gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
            $releaseExists = ($LASTEXITCODE -eq 0)
          }
          finally { $ErrorActionPreference = $previous }
          $global:LASTEXITCODE = 0
          if ($releaseExists) {
            Write-Host "Release $env:RELEASE_TAG exists; historical tag will not be restored."
            exit 0
          }
          $remoteTag = @(git ls-remote --tags origin "refs/tags/$env:RELEASE_TAG")
          if ($remoteTag.Count -eq 0) {
            git push origin "$($env:LEGACY_TAG_COMMIT):refs/tags/$($env:RELEASE_TAG)"
            if ($LASTEXITCODE -ne 0) { throw "Failed to restore historical $env:RELEASE_TAG after publication failure." }
            Write-Host "Restored historical $env:RELEASE_TAG at $env:LEGACY_TAG_COMMIT."
          }

      - name: Preserve release assets in workflow run
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: minos-1.0.1-one-shot-publication
          retention-days: 30
          if-no-files-found: warn
          path: |
            target/dist/MINOS-1.0.1-windows-x64-setup.exe
            target/dist/MINOS-1.0.1-windows-x64-setup.exe.sha256
            target/dist/minos-1.0.1-windows-x64.zip
            target/dist/minos-1.0.1-windows-x64.zip.sha256
            target/dist/minos-1.0.1.cdx.json
            target/dist/minos-1.0.1.cdx.json.sha256
            target/dist/MINOS-1.0.1-THIRD-PARTY-NOTICES.txt
            target/dist/MINOS-1.0.1-THIRD-PARTY-NOTICES.txt.sha256
            minos-intellij/build/distributions/*.zip
            minos-intellij/build/reports/**
            minos-intellij/build/test-results/**
