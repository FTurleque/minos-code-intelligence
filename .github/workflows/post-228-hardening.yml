name: Post-228 Hardening Invariants

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: post-228-hardening-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-hardening:
    name: Verify post-228 static hardening
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Assert exact candidate HEAD
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Current documentation consistency
        run: python scripts/docs/check-current-docs.py

      - name: Post-228 static invariants
        run: python scripts/remediation/check-post228-hardening.py
