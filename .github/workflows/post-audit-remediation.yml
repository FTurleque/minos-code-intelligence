name: Post-audit remediation

on:
  pull_request:
    branches: [develop]
    paths:
      - '.github/workflows/post-audit-remediation.yml'
      - 'scripts/remediation/post-audit-provenance.env'

permissions:
  contents: write

concurrency:
  group: post-audit-remediation-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: false

jobs:
  provenance:
    name: Capture immutable supply-chain provenance
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      REMEDIATION_BRANCH: ${{ github.event.pull_request.head.ref }}
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact pull request head without third-party actions
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git config core.autocrlf false
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${SOURCE_SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"

      - name: Capture release asset SHA-256 values
        shell: bash
        run: |
          set -euo pipefail
          work="${RUNNER_TEMP}/minos-remediation-digests"
          mkdir -p "$work" scripts/remediation
          output='scripts/remediation/post-audit-provenance.env'
          : > "$output"

          fetch_hash() {
            local key="$1"
            local name="$2"
            local url="$3"
            curl --fail --silent --show-error --location --retry 3 --retry-all-errors --output "$work/$name" "$url"
            local digest
            digest="$(sha256sum "$work/$name" | awk '{print $1}')"
            [[ "$digest" =~ ^[0-9a-f]{64}$ ]] || { echo "Invalid digest for $key" >&2; exit 1; }
            printf '%s=%s\n' "$key" "$digest" >> "$output"
          }

          fetch_hash COURSIER_WINDOWS_SHA256 coursier-windows.exe \
            'https://github.com/coursier/coursier/releases/download/v2.1.18/cs-x86_64-pc-win32.exe'
          fetch_hash COURSIER_LINUX_SHA256 coursier-linux.gz \
            'https://github.com/coursier/coursier/releases/download/v2.1.18/cs-x86_64-pc-linux.gz'
          fetch_hash SCIP_CLANG_LINUX_SHA256 scip-clang \
            'https://github.com/sourcegraph/scip-clang/releases/download/v0.4.0/scip-clang-x86_64-linux'
          fetch_hash RUST_ANALYZER_LINUX_GZ_SHA256 rust-analyzer.gz \
            'https://github.com/rust-lang/rust-analyzer/releases/download/2026-07-27/rust-analyzer-x86_64-unknown-linux-gnu.gz'

      - name: Capture OCI RepoDigests
        shell: bash
        run: |
          set -euo pipefail
          output='scripts/remediation/post-audit-provenance.env'
          resolve_image() {
            local key="$1"
            local tag="$2"
            docker pull --quiet "$tag" >/dev/null
            local digest
            digest="$(docker image inspect "$tag" --format '{{index .RepoDigests 0}}')"
            [[ "$digest" =~ @sha256:[0-9a-f]{64}$ ]] || { echo "No immutable RepoDigest for $tag: $digest" >&2; exit 1; }
            printf '%s=%s\n' "$key" "$digest" >> "$output"
          }
          resolve_image RUST_BASE_IMAGE 'rust:1.97.1-bookworm'
          resolve_image GO_BASE_IMAGE 'golang:1.26.5-bookworm'
          resolve_image DOTNET_BASE_IMAGE 'mcr.microsoft.com/dotnet/sdk:10.0.302-noble'
          resolve_image TEMURIN_BASE_IMAGE 'eclipse-temurin:24-jdk'

      - name: Capture immutable GitHub Action refs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess

          pattern = re.compile(r'\buses:\s*([A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+)@([^\s#]+)')
          refs = set()
          for file in Path('.github/workflows').glob('*.y*ml'):
              for match in pattern.finditer(file.read_text(encoding='utf-8')):
                  repo, ref = match.groups()
                  if not re.fullmatch(r'[0-9a-fA-F]{40}', ref):
                      refs.add((repo, ref))

          rows = []
          for repo, ref in sorted(refs):
              url = f'https://github.com/{repo}.git'
              names = [f'refs/tags/{ref}^{{}}', f'refs/tags/{ref}', f'refs/heads/{ref}']
              proc = subprocess.run(['git', 'ls-remote', url, *names], text=True, capture_output=True, check=True)
              found = {}
              for line in proc.stdout.splitlines():
                  if line.strip():
                      sha, name = line.split()[:2]
                      found[name] = sha
              sha = found.get(f'refs/tags/{ref}^{{}}') or found.get(f'refs/tags/{ref}') or found.get(f'refs/heads/{ref}')
              if sha is None or not re.fullmatch(r'[0-9a-fA-F]{40}', sha):
                  raise SystemExit(f'Unable to resolve {repo}@{ref}')
              rows.append(f'ACTION_PIN::{repo}@{ref}={sha.lower()}')

          with Path('scripts/remediation/post-audit-provenance.env').open('a', encoding='utf-8') as out:
              for row in rows:
                  out.write(row + '\n')
          PY
          printf '%s\n' 'INNOSETUP_CHOCO_VERSION=6.7.1' >> scripts/remediation/post-audit-provenance.env
          cat scripts/remediation/post-audit-provenance.env

      - name: Commit provenance snapshot to exact source branch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'MINOS Remediation Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/remediation/post-audit-provenance.env
          if git diff --cached --quiet; then
            echo 'Provenance is already current.'
            exit 0
          fi
          git commit -m 'build: pin post-audit supply-chain provenance'
          git push origin "HEAD:refs/heads/${REMEDIATION_BRANCH}"
