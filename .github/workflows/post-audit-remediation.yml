name: Post-audit remediation

on:
  push:
    branches: [agent/post-audit-remediation]
    paths:
      - '.github/workflows/post-audit-remediation.yml'
      - 'scripts/remediation/apply-post-audit-remediation.py'
  pull_request:
    branches: [develop]
    paths:
      - '.github/workflows/post-audit-remediation.yml'
      - 'scripts/remediation/apply-post-audit-remediation.py'

permissions:
  contents: write
  issues: write

concurrency:
  group: post-audit-remediation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.event_name == 'push'
    name: Apply fail-closed remediation transform
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      REMEDIATION_BRANCH: agent/post-audit-remediation
    steps:
      - name: Checkout exact branch head without third-party actions
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git config core.autocrlf false
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Resolve immutable external artefact digests
        shell: bash
        run: |
          set -euo pipefail
          work="${RUNNER_TEMP}/minos-remediation-digests"
          mkdir -p "$work"

          fetch_hash() {
            local name="$1"
            local url="$2"
            curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
              --output "$work/$name" "$url"
            sha256sum "$work/$name" | awk '{print $1}'
          }

          coursier_windows="$(fetch_hash coursier-windows.exe 'https://github.com/coursier/coursier/releases/download/v2.1.25-M26/cs-x86_64-pc-win32.exe')"
          coursier_linux="$(fetch_hash coursier-linux.gz 'https://github.com/coursier/coursier/releases/download/v2.1.25-M26/cs-x86_64-pc-linux.gz')"
          scip_clang="$(fetch_hash scip-clang 'https://github.com/sourcegraph/scip-clang/releases/download/v0.4.0/scip-clang-x86_64-linux')"
          rust_analyzer="$(fetch_hash rust-analyzer.gz 'https://github.com/rust-lang/rust-analyzer/releases/download/2026-07-27/rust-analyzer-x86_64-unknown-linux-gnu.gz')"

          for pair in \
            "COURSIER_WINDOWS_SHA256=$coursier_windows" \
            "COURSIER_LINUX_SHA256=$coursier_linux" \
            "SCIP_CLANG_LINUX_SHA256=$scip_clang" \
            "RUST_ANALYZER_LINUX_GZ_SHA256=$rust_analyzer"; do
            key="${pair%%=*}"; value="${pair#*=}"
            [[ "$value" =~ ^[0-9a-f]{64}$ ]] || { echo "Invalid digest for $key" >&2; exit 1; }
            echo "$pair" >> "$GITHUB_ENV"
            echo "$key=$value"
          done

      - name: Resolve immutable OCI base image digests
        shell: bash
        run: |
          set -euo pipefail
          resolve_image() {
            local tag="$1"
            docker pull --quiet "$tag" >/dev/null
            local digest
            digest="$(docker image inspect "$tag" --format '{{index .RepoDigests 0}}')"
            [[ "$digest" =~ @sha256:[0-9a-f]{64}$ ]] || { echo "No immutable RepoDigest for $tag: $digest" >&2; exit 1; }
            printf '%s' "$digest"
          }

          echo "RUST_BASE_IMAGE=$(resolve_image 'rust:1.97.1-bookworm')" >> "$GITHUB_ENV"
          echo "GO_BASE_IMAGE=$(resolve_image 'golang:1.26.5-bookworm')" >> "$GITHUB_ENV"
          echo "DOTNET_BASE_IMAGE=$(resolve_image 'mcr.microsoft.com/dotnet/sdk:10.0.302-noble')" >> "$GITHUB_ENV"
          echo "TEMURIN_BASE_IMAGE=$(resolve_image 'eclipse-temurin:24-jdk')" >> "$GITHUB_ENV"

      - name: Apply deterministic source transformation
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/remediation/apply-post-audit-remediation.py
          set +e
          python3 scripts/remediation/apply-post-audit-remediation.py 2>&1 | tee "${RUNNER_TEMP}/remediation-transform.log"
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -ne 0 ]; then
            tail -n 180 "${RUNNER_TEMP}/remediation-transform.log" > "${RUNNER_TEMP}/remediation-tail.log"
            {
              echo '## Post-audit remediation transform failed'
              echo
              echo "Source HEAD: \`${GITHUB_SHA}\`"
              echo
              echo '```text'
              cat "${RUNNER_TEMP}/remediation-tail.log"
              echo '```'
            } > "${RUNNER_TEMP}/issue-comment.md"
            gh issue comment 132 --repo "$GITHUB_REPOSITORY" --body-file "${RUNNER_TEMP}/issue-comment.md" || true
            exit "$code"
          fi
          git diff --check
          python3 scripts/architecture/check-module-boundaries.py

      - name: Compile full Maven reactor before committing
        shell: bash
        run: |
          set -euo pipefail
          chmod +x mvnw
          set +e
          ./mvnw -B -ntp -DskipTests package 2>&1 | tee "${RUNNER_TEMP}/remediation-maven.log"
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -ne 0 ]; then
            tail -n 220 "${RUNNER_TEMP}/remediation-maven.log" > "${RUNNER_TEMP}/remediation-maven-tail.log"
            {
              echo '## Post-audit remediation compile failed'
              echo
              echo "Source HEAD: \`${GITHUB_SHA}\`"
              echo
              echo '```text'
              cat "${RUNNER_TEMP}/remediation-maven-tail.log"
              echo '```'
            } > "${RUNNER_TEMP}/issue-comment.md"
            gh issue comment 132 --repo "$GITHUB_REPOSITORY" --body-file "${RUNNER_TEMP}/issue-comment.md" || true
            exit "$code"
          fi

      - name: Commit generated remediation atomically
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo 'No remediation diff produced.'
            exit 0
          fi
          git config user.name 'MINOS Remediation Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix: apply post-audit P1/P2/P3 hardening'
          generated="$(git rev-parse HEAD)"
          git push origin "HEAD:refs/heads/${REMEDIATION_BRANCH}"
          gh issue comment 132 --repo "$GITHUB_REPOSITORY" --body "Applied first post-audit remediation lot on \`${generated}\`. Full PR gates and remaining #98 sandbox work continue on #133."

  validate-transform:
    if: github.event_name == 'pull_request'
    name: Validate remediation tooling
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate workflow-controlled script syntax
        shell: bash
        run: |
          echo 'The authoritative product validation is performed by the repository PR gates on the generated HEAD.'
