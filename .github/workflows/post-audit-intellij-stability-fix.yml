name: Post-audit IntelliJ process stability fix

on:
  push:
    branches: [fix/post-audit-remediation-20260814]
    paths: [.github/workflows/post-audit-intellij-stability-fix.yml]

permissions:
  contents: write

jobs:
  fix-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/post-audit-remediation-20260814
          fetch-depth: 0
      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          gradle-version: '9.6.1'
          cache-provider: basic
      - name: Remove child-process noise from cancellation-isolation fixture
        shell: python
        run: |
          from pathlib import Path
          p = Path('minos-intellij/src/test/java/com/minos/intellij/protocol/MinosProcessSupervisorTest.java')
          text = p.read_text(encoding='utf-8')
          old = '''        if (isWindows()) {\n            return List.of("cmd", "/d", "/c", "ping -n 3600 127.0.0.1 > nul");\n        }\n'''
          new = '''        if (isWindows()) {\n            // This test verifies cancellation isolation between A and B, not descendant cleanup.\n            // Use ping.exe directly so no unobserved cmd -> ping child race can contaminate the invariant.\n            return List.of("ping.exe", "-n", "3600", "127.0.0.1");\n        }\n'''
          if text.count(old) != 1:
              raise SystemExit(f'longRunningCommand match count={text.count(old)}')
          p.write_text(text.replace(old, new), encoding='utf-8')
      - name: Full plugin suite first pass
        working-directory: minos-intellij
        run: gradle --no-daemon test buildPlugin verifyPluginProjectConfiguration verifyPluginStructure --rerun-tasks
      - name: Full plugin suite second pass
        working-directory: minos-intellij
        run: gradle --no-daemon test --rerun-tasks
      - name: Commit only after repeated green suite
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add minos-intellij/src/test/java/com/minos/intellij/protocol/MinosProcessSupervisorTest.java
          git commit -m 'test: make IntelliJ process ownership fixtures deterministic'
          git push origin HEAD:fix/post-audit-remediation-20260814
