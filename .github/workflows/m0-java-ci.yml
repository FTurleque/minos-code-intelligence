name: M0 Java CI

on:
  push:
    branches:
      - m0/bootstrap-scip-baseline
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Java 25 / Maven verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Installer Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Afficher la toolchain
        run: |
          java -version
          mvn -version

      - name: Vérifier le projet
        id: maven-verify
        shell: bash
        run: |
          mkdir -p target
          set +e
          mvn --batch-mode --no-transfer-progress verify 2>&1 | tee target/m0-ci.log
          status=${PIPESTATUS[0]}
          echo "$status" > target/m0-ci.exit
          exit "$status"

      - name: Publier les diagnostics Maven
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: m0-java-ci-diagnostics
          if-no-files-found: warn
          retention-days: 7
          path: |
            target/m0-ci.log
            target/m0-ci.exit
            target/surefire-reports/
