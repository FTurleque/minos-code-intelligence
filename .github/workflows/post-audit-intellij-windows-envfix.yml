name: Post-audit IntelliJ Windows environment fix

on:
  push:
    branches: [fix/post-audit-remediation-20260814]
    paths: [.github/workflows/post-audit-intellij-windows-envfix.yml]

permissions:
  contents: write

jobs:
  fix-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/post-audit-remediation-20260814
          fetch-depth: 0
      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          gradle-version: '9.6.1'
          cache-provider: basic
      - name: Apply Windows environment validation fix
        shell: python
        run: |
          from pathlib import Path
          p = Path('minos-intellij/src/main/java/com/minos/intellij/protocol/MinosStrongProcessLauncher.java')
          text = p.read_text(encoding='utf-8')
          old = """            if (entry.getKey().isEmpty() || entry.getKey().indexOf('=') >= 0\n                    || entry.getKey().indexOf('\\0') >= 0 || entry.getValue().indexOf('\\0') >= 0) {\n                throw new IOException(\"invalid environment entry for Windows ownership launcher\");\n            }\n"""
          new = """            if (!validWindowsEnvironmentKey(entry.getKey())\n                    || entry.getValue().indexOf('\\0') >= 0) {\n                throw new IOException(\"invalid environment entry for Windows ownership launcher: \"\n                        + entry.getKey());\n            }\n"""
          if text.count(old) != 1:
              raise SystemExit(f'environment validation match count={text.count(old)}')
          text = text.replace(old, new)
          anchor = """    private static Path resolveWindowsExecutable(String executable) throws IOException {\n"""
          helper = """    private static boolean validWindowsEnvironmentKey(String key) {\n        if (key == null || key.isEmpty() || key.indexOf('\\0') >= 0) return false;\n        if (key.length() == 3 && key.charAt(0) == '='\n                && Character.isLetter(key.charAt(1)) && key.charAt(2) == ':') {\n            return true;\n        }\n        return key.indexOf('=') < 0;\n    }\n\n"""
          if text.count(anchor) != 1:
              raise SystemExit('resolve executable anchor mismatch')
          p.write_text(text.replace(anchor, helper + anchor), encoding='utf-8')
      - name: Run immediate-detach ownership regression
        working-directory: minos-intellij
        run: gradle --no-daemon test --tests 'com.minos.intellij.protocol.MinosStrongProcessLauncherTest.immediateDetachedChildCannotEscapeWindowsJobObject'
      - name: Run full plugin tests and structure
        working-directory: minos-intellij
        run: gradle --no-daemon test buildPlugin verifyPluginProjectConfiguration verifyPluginStructure
      - name: Commit validated fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add minos-intellij/src/main/java/com/minos/intellij/protocol/MinosStrongProcessLauncher.java
          git commit -m 'fix: preserve Windows drive environment entries for CLI ownership'
          git push origin HEAD:fix/post-audit-remediation-20260814
