name: Publish MINOS 1.0.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v1.0.0.yml'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: minos-production-release-v1.0.0
  cancel-in-progress: false

jobs:
  publish:
    name: Build, verify and publish MINOS 1.0.0
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      MINOS_RELEASE_VERSION: '1.0.0'

    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Guard production ref and immutable version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/main') {
            throw "Production release must run from refs/heads/main; got $env:GITHUB_REF"
          }

          $head = (git rev-parse HEAD).Trim()
          if ($head -ne $env:GITHUB_SHA) {
            throw "Checkout HEAD $head differs from GITHUB_SHA $env:GITHUB_SHA"
          }

          git fetch --tags --force
          if (git tag --list 'v1.0.0') {
            throw 'Immutable tag v1.0.0 already exists; refusing to move or recreate it.'
          }

          gh release view v1.0.0 --repo $env:GITHUB_REPOSITORY *> $null
          $releaseExists = ($LASTEXITCODE -eq 0)
          $global:LASTEXITCODE = 0
          if ($releaseExists) {
            throw 'GitHub Release v1.0.0 already exists; refusing to overwrite it.'
          }

          Write-Host "Production release candidate: $head"
          Write-Host 'Immutable tag/release guard: PASS (v1.0.0 absent)'

      - name: Set up Java 24
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '24'
          cache: maven

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          $iscc = @(
            (Get-Command ISCC.exe -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source -ErrorAction SilentlyContinue),
            'C:\Program Files (x86)\Inno Setup 7\ISCC.exe',
            'C:\Program Files\Inno Setup 7\ISCC.exe',
            'C:\Program Files (x86)\Inno Setup 6\ISCC.exe',
            'C:\Program Files\Inno Setup 6\ISCC.exe',
            'C:\ProgramData\chocolatey\bin\ISCC.exe'
          ) | Where-Object { $_ -and (Test-Path -LiteralPath $_) } | Select-Object -First 1
          if (-not $iscc) {
            throw 'Inno Setup installation did not expose ISCC.exe.'
          }
          Write-Host "ISCC: $iscc"

      - name: Show release toolchain
        shell: pwsh
        run: |
          java -version
          .\mvnw.cmd -version
          python --version
          gh --version
          git rev-parse HEAD
          Write-Host "Release version: $env:MINOS_RELEASE_VERSION"

      - name: Verify native MCP client integration lifecycle
        shell: powershell
        run: |
          .\scripts\install\verify-mcp-client-integration.ps1

      - name: Build, smoke test and publish stable release
        shell: pwsh
        run: |
          .\scripts\release\publish-windows-release.ps1 `
            -Version $env:MINOS_RELEASE_VERSION `
            -TargetCommit $env:GITHUB_SHA

      - name: Verify immutable tag and GitHub Release
        shell: pwsh
        run: |
          git fetch origin --tags --force
          $tagCommit = (git rev-list -n 1 v1.0.0).Trim()
          if ($tagCommit -ne $env:GITHUB_SHA) {
            throw "v1.0.0 points to $tagCommit instead of release SHA $env:GITHUB_SHA"
          }

          $releaseJson = gh release view v1.0.0 `
            --repo $env:GITHUB_REPOSITORY `
            --json tagName,name,isDraft,isPrerelease,targetCommitish,url,assets
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to read GitHub Release v1.0.0 after publication.'
          }

          $release = $releaseJson | ConvertFrom-Json
          if ($release.tagName -ne 'v1.0.0') { throw "Unexpected tag: $($release.tagName)" }
          if ($release.isDraft) { throw 'v1.0.0 release is unexpectedly draft.' }
          if ($release.isPrerelease) { throw 'v1.0.0 release is unexpectedly marked prerelease.' }

          $expected = @(
            'MINOS-1.0.0-windows-x64-setup.exe',
            'MINOS-1.0.0-windows-x64-setup.exe.sha256',
            'minos-1.0.0-windows-x64.zip',
            'minos-1.0.0-windows-x64.zip.sha256',
            'minos-1.0.0.cdx.json',
            'minos-1.0.0.cdx.json.sha256',
            'MINOS-1.0.0-THIRD-PARTY-NOTICES.txt',
            'MINOS-1.0.0-THIRD-PARTY-NOTICES.txt.sha256'
          )
          $actual = @($release.assets | ForEach-Object { $_.name })
          $missing = @($expected | Where-Object { $_ -notin $actual })
          if ($missing.Count -gt 0) {
            throw "Release is missing expected assets: $($missing -join ', ')"
          }

          Write-Host 'MINOS 1.0.0 PRODUCTION RELEASE SUCCESS'
          Write-Host "Tag target: $tagCommit"
          Write-Host "Release: $($release.url)"

      - name: Record successful production release
        if: success()
        shell: pwsh
        run: |
          $releaseJson = gh release view v1.0.0 --repo $env:GITHUB_REPOSITORY --json url,assets
          $release = $releaseJson | ConvertFrom-Json
          $assetLines = @($release.assets | ForEach-Object { "- ``$($_.name)``" }) -join "`n"
          $body = @"
          ## MINOS 1.0.0 production release — SUCCESS

          Version: 1.0.0
          Tag: v1.0.0
          Target SHA: $env:GITHUB_SHA
          Workflow: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID

          Publication performed by the authoritative Windows release script after build, supply-chain generation, setup/ZIP smoke tests and uninstall smoke test.

          Assets:
          $assetLines

          Release: $($release.url)
          "@
          gh issue comment 93 --repo $env:GITHUB_REPOSITORY --body $body

      - name: Record release failure
        if: failure()
        shell: pwsh
        run: |
          $body = @"
          ## MINOS 1.0.0 production release — FAILED

          The one-shot production publication did not complete successfully.

          Candidate SHA: $env:GITHUB_SHA
          Workflow: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID

          No successful release claim should be made until the failing gate is diagnosed and replayed on the exact candidate SHA.
          "@
          gh issue comment 93 --repo $env:GITHUB_REPOSITORY --body $body

      - name: Preserve Windows release assets in the workflow run
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: minos-1.0.0-windows-x64
          if-no-files-found: warn
          retention-days: 30
          path: |
            target/dist/MINOS-1.0.0-windows-x64-setup.exe
            target/dist/MINOS-1.0.0-windows-x64-setup.exe.sha256
            target/dist/minos-1.0.0-windows-x64.zip
            target/dist/minos-1.0.0-windows-x64.zip.sha256
            target/dist/minos-1.0.0.cdx.json
            target/dist/minos-1.0.0.cdx.json.sha256
            target/dist/MINOS-1.0.0-THIRD-PARTY-NOTICES.txt
            target/dist/MINOS-1.0.0-THIRD-PARTY-NOTICES.txt.sha256
