name: Post-audit documentation reconciliation

on:
  push:
    branches: [fix/post-audit-remediation-20260814]
    paths: [.github/workflows/post-audit-docs-remediation.yml]

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/post-audit-remediation-20260814
          fetch-depth: 0

      - name: Reconcile authoritative documentation
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected one match for {old!r}, got {text.count(old)}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          status = Path('docs/STATUS.md')
          text = status.read_text(encoding='utf-8')
          text = text.replace('Dernière mise à jour : **9 août 2026**.', 'Dernière mise à jour : **14 août 2026**.', 1)
          marker = '## Synthèse\n\n'
          section = '''## Réconciliation post-audit — 14 août 2026\n\nAprès le merge de la PR #182, `develop@20440b353d6a89e40b949cc1e56214d550dbdca6` a été relu intégralement. Cette campagne de correction ferme les écarts découverts lors de ce réaudit :\n\n- composition M25 restaurée entre `StrongProcessOwnershipIndexerExecutor` et les sandboxes workers Linux/Windows via une capability explicite, sans nesting de frontières OS ;\n- plugin IntelliJ lancé derrière une autorité d'ownership établie avant le CLI : Job Object Windows avec création suspendue, scope systemd/cgroup sous Linux, absence de fallback silencieux ;\n- build Docker provider-complete aligné sur les lockfiles npm v3 possédés par le dépôt et `npm ci --ignore-scripts` pour `scip-typescript` et `scip-python` ;\n- documentation et registre des risques réconciliés avec ces garanties et leurs limitations d'exploitation.\n\nLes protections `ProcessHandle`/PID-start-time et les trackers Java restent des défenses en profondeur ; elles ne sont plus présentées comme autorité kernel-backed. Les plateformes sans frontière forte qualifiée restent fail-closed.\n\n'''
          if text.count(marker) != 1:
              raise SystemExit('STATUS synthesis marker mismatch')
          text = text.replace(marker, section + marker, 1)
          status.write_text(text, encoding='utf-8')

          risk = Path('docs/architecture/risks/register.md')
          text = risk.read_text(encoding='utf-8')
          text = text.replace(
              'Dernière réconciliation : **9 août 2026**, campagne post-audit #132 / PR #135.',
              'Dernière réconciliation : **14 août 2026**, réaudit complet de `develop` après PR #182.', 1)
          old = '| R-10 | Dérive future de provenance supply-chain | Faible | Élevé | Moyenne | Équipe MINOS | Mitigé / surveillé | GitHub Actions épinglées par SHA, images OCI par digest, providers binaires par checksum attendu, gate `check-workflow-pins.py`. |'
          new = '| R-10 | Dérive future de provenance supply-chain | Faible | Élevé | Moyenne | Équipe MINOS | Mitigé / surveillé | GitHub Actions épinglées par SHA, images OCI par digest, providers binaires par checksum attendu ; le Docker provider-complete consomme les lockfiles npm v3 du dépôt via `npm ci --ignore-scripts`, comme le runtime natif. Gate `check-workflow-pins.py`. |'
          if old not in text:
              raise SystemExit('R-10 row not found')
          text = text.replace(old, new, 1)
          anchor = new + '\n'
          extra = '| R-12 | Disponibilité de la frontière forte du CLI IntelliJ selon la plateforme | Faible | Moyen | Faible | Équipe MINOS / opérateur | Mitigé / capability-honest | Windows utilise un Job Object établi avant reprise du CLI ; Linux exige un user manager systemd capable de créer un scope transitoire. Une plateforme non qualifiée ou sans primitive disponible échoue fermée au lieu de revenir au polling `ProcessHandle`. |\n'
          text = text.replace(anchor, anchor + extra, 1)
          risk.write_text(text, encoding='utf-8')

          guide = Path('docs/user/intellij-plugin.md')
          text = guide.read_text(encoding='utf-8')
          old = 'Le plugin et le moteur sont volontairement séparés : le plugin s\'exécute en Java 21 avec la JVM IntelliJ, tandis que MINOS reste un processus local Java 24 indépendant.\n'
          new = old + '''\n### Ownership OS des commandes CLI\n\nLe plugin ne lance plus le CLI sous une simple supervision PID. La frontière d'ownership doit être disponible **avant** l'exécution du CLI :\n\n- **Windows** : Job Object `KILL_ON_JOB_CLOSE`, processus CLI créé suspendu, assigné/vérifié dans le job puis repris ;\n- **Linux** : scope utilisateur systemd/cgroup transitoire ; un user manager systemd opérationnel est requis ;\n- **autres plateformes** : aucune garantie forte n'est annoncée et les commandes du plugin restent fail-closed tant qu'une primitive équivalente n'est pas qualifiée.\n\nLe polling `ProcessHandle` reste actif uniquement comme défense en profondeur et protection PID-reuse.\n'''
          if old not in text:
              raise SystemExit('IntelliJ guide insertion anchor missing')
          guide.write_text(text.replace(old, new, 1), encoding='utf-8')

      - name: Commit documentation reconciliation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs
          git commit -m 'docs: reconcile post-audit guarantees and risks'
          git push origin HEAD:fix/post-audit-remediation-20260814
