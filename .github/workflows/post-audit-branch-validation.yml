name: Temporary post-audit branch validation

on:
  push:
    branches: [fix/post-audit-p2-followup-20260814]

permissions:
  contents: read

concurrency:
  group: post-audit-branch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Set up Java 24
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '24'
          cache: maven
      - name: Set up Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Quality and architecture preflight
        run: |
          python scripts/quality/check-workflow-pins.py
          python scripts/remediation/check-p0-p2.py
          python scripts/remediation/check-minos-01.py
          python scripts/architecture/check-module-boundaries.py
      - name: Install and authorize Linux sandbox runtime
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap util-linux apparmor apparmor-profiles
          profile='/usr/share/apparmor/extra-profiles/bwrap-userns-restrict'
          test -f "$profile"
          sudo cp "$profile" /etc/apparmor.d/minos-bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/minos-bwrap-userns-restrict
      - name: Delegate cgroup v2
        run: bash scripts/ci/delegate-linux-cgroup.sh
      - name: Prepare Maven Wrapper
        run: chmod +x mvnw
      - name: Maven clean verify full reactor with PostgreSQL required
        run: ./mvnw -B -ntp -Dminos.postgresql.tests.required=true clean verify
      - name: Targeted JaCoCo gate
        run: python scripts/quality/check-jacoco.py
      - name: Product facts consistency
        run: python scripts/docs/product-facts.py --check
      - name: Reject stale snapshot API and unmanaged SCIP process call-sites
        run: |
          if git grep -n 'activeSnapshotId(UUID' -- '*.java'; then exit 1; fi
          if git grep -n 'new ProcessIndexerExecutor(' -- \
            minos-provider-scip/src/main/java/com/minos/adapter/scip/runtime/ManagedScipProviderRuntimeManager.java \
            minos-provider-scip/src/main/java/com/minos/adapter/scip/runtime/ManagedScipPythonRuntimeManager.java \
            minos-provider-scip/src/main/java/com/minos/adapter/scip/runtime/ManagedPolyglotScipRuntimeManager.java; then exit 1; fi

  full-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout exact branch HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Set up Java 24
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '24'
          cache: maven
      - name: Set up Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Quality and architecture preflight
        shell: pwsh
        run: |
          python scripts/quality/check-workflow-pins.py
          python scripts/remediation/check-p0-p2.py
          python scripts/remediation/check-minos-01.py
          python scripts/architecture/check-module-boundaries.py
      - name: Maven clean verify full reactor
        shell: pwsh
        run: .\mvnw.cmd -B -ntp clean verify
      - name: Targeted JaCoCo gate
        run: python scripts/quality/check-jacoco.py --skip-scope m30-postgresql-pgvector
      - name: Product facts consistency
        run: python scripts/docs/product-facts.py --check
