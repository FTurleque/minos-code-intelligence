name: Update M27 durability gate

on:
  push:
    branches: [fix/audit-remediation-20260815]
    paths:
      - '.github/workflows/update-m27-durability-gate.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/audit-remediation-20260815
          fetch-depth: 0

      - name: Strengthen M27 durable-persistence assertion
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/m27/check-hosted.py')
          text = path.read_text(encoding='utf-8')
          old = '"GCMParameterSpec(GCM_TAG_BITS", "ATOMIC_MOVE", "FileLock", "DEFAULT_MAX_TENANT_BYTES",'
          new = '"GCMParameterSpec(GCM_TAG_BITS", "DurableAtomicFile.replace", "DurableAtomicFile.publish",\n                "FileLock", "DEFAULT_MAX_TENANT_BYTES",'
          if text.count(old) != 1:
              raise SystemExit('unexpected M27 durability assertion shape')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          rm .github/workflows/update-m27-durability-gate.yml
          git add -A
          git config user.name 'MINOS audit remediation'
          git config user.email 'actions@github.com'
          git commit -m 'test: align M27 gate with durable atomic primitive'
          git push origin HEAD:fix/audit-remediation-20260815
