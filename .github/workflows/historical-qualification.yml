name: Historical Qualification Replay

on:
  workflow_dispatch:
    inputs:
      qualification:
        description: Qualification suite to replay
        required: true
        type: choice
        options:
          - m28
          - m15
      git_ref:
        description: Commit SHA, tag or branch to qualify (immutable SHA recommended)
        required: true
        default: develop
        type: string

permissions:
  contents: read

concurrency:
  group: historical-qualification-${{ inputs.qualification }}-${{ inputs.git_ref }}
  cancel-in-progress: false

jobs:
  m28-linux:
    name: M28 Linux qualification replay
    if: inputs.qualification == 'm28'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout requested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.git_ref }}
          fetch-depth: 0
      - name: Record qualified HEAD
        run: git rev-parse HEAD
      - name: Set up Java 24
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '24'
          cache: maven
      - name: Set up Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install and authorize Linux worker sandbox runtime
        timeout-minutes: 10
        shell: bash
        run: bash scripts/ci/install-linux-sandbox-toolchain.sh
      - name: Delegate a cgroup v2 job boundary to the worker sandbox
        shell: bash
        run: bash scripts/ci/delegate-linux-cgroup.sh
      - name: Prepare Maven Wrapper
        run: chmod +x mvnw
      - name: Run complete M28 Linux qualification
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci/delegate-linux-cgroup.sh --attach-pid $$
          bash scripts/remediation/run-final.sh "" 1000
      - name: Upload M28 Linux diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: m28-linux-replay-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 30
          path: |
            target/qualification/m28/**
            target/site/jacoco-aggregate/**
            **/target/surefire-reports/**
            **/target/failsafe-reports/**

  m28-windows:
    name: M28 Windows qualification replay
    if: inputs.qualification == 'm28'
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Checkout requested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.git_ref }}
          fetch-depth: 0
      - name: Record qualified HEAD
        shell: powershell
        run: git rev-parse HEAD
      - name: Set up Java 24
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '24'
          cache: maven
      - name: Set up Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Run complete M28 Windows qualification
        shell: powershell
        run: .\scripts\remediation\run-final.ps1 -ProgramGraphFiles 1000
      - name: Upload M28 Windows diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: m28-windows-replay-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 30
          path: |
            target/qualification/m28/**
            target/site/jacoco-aggregate/**
            **/target/surefire-reports/**
            **/target/failsafe-reports/**

  m15-windows:
    name: M15 Windows qualification replay
    if: inputs.qualification == 'm15'
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Checkout requested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.git_ref }}
          fetch-depth: 0
      - name: Record qualified HEAD
        shell: powershell
        run: git rev-parse HEAD
      - name: Set up Java 24
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '24'
          cache: maven
      - name: Set up Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Run complete M15 qualification
        shell: powershell
        run: .\scripts\m15\run-final.ps1
      - name: Upload M15 diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: m15-replay-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 30
          path: |
            target/m15-baseline/**
            target/m15-final/**
            target/m15-quality/**
            target/site/jacoco-aggregate/**
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
