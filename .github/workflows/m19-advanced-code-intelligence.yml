name: M19 Advanced Code Intelligence Validation

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'minos-domain/**'
      - 'minos-application/**'
      - 'minos-api/**'
      - 'minos-mcp/**'
      - 'docs/roadmap/M19_EXECUTION.md'
      - 'docs/adr/0028-capability-honest-program-graph-and-bounded-advanced-analysis.md'
      - 'docs/developer/public-surfaces.md'
      - 'docs/user/mcp.md'
      - 'docs/generated/product-facts.md'
      - 'scripts/m19/**'
      - '.github/workflows/m19-advanced-code-intelligence.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m19-advanced-code-intelligence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  java:
    name: M19 Java 24 qualification
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Java 24
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '24'

      - name: Set up Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Install and authorize Linux worker sandbox runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            bubblewrap util-linux apparmor apparmor-profiles
          command -v bwrap
          command -v prlimit
          command -v unshare
          command -v setpriv
          profile='/usr/share/apparmor/extra-profiles/bwrap-userns-restrict'
          test -f "$profile"
          sudo cp "$profile" /etc/apparmor.d/minos-bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/minos-bwrap-userns-restrict

      - name: Prepare Maven Wrapper
        shell: bash
        run: chmod +x mvnw

      - name: Product facts
        run: python scripts/docs/product-facts.py --check

      - name: Maven verification
        run: ./mvnw -B -ntp clean verify

      - name: JaCoCo gates
        run: python scripts/quality/check-jacoco.py

  m19-final-windows:
    name: M19 final Windows exact-head gate
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/m19-advanced-code-intelligence'
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout exact M19 head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Java 24
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '24'

      - name: Set up Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Run complete M19 exact-head qualification
        shell: powershell
        run: .\scripts\m19\run-final.ps1 -ExpectedHead '${{ github.event.pull_request.head.sha }}'

      - name: Upload M19 diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: m19-final-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 30
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
            target/site/jacoco-aggregate/**
