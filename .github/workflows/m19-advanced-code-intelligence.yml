name: M19 Advanced Code Intelligence Validation

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'minos-domain/**'
      - 'minos-application/**'
      - 'minos-api/**'
      - 'minos-mcp/**'
      - 'docs/roadmap/M19_EXECUTION.md'
      - 'docs/adr/0028-capability-honest-program-graph-and-bounded-advanced-analysis.md'
      - 'docs/developer/public-surfaces.md'
      - 'docs/user/mcp.md'
      - 'docs/generated/product-facts.md'
      - 'scripts/m19/**'
      - '.github/workflows/m19-advanced-code-intelligence.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m19-advanced-code-intelligence-${{ github.event.pull_request.number || github.ref }}
  # Never cancel a push-triggered run on develop/main: only a duplicate PR run is obsolete.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  java:
    name: M19 Java 24 qualification
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Java 24
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '24'

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      # The helper bounds each apt attempt and falls back to a pinned mirror if the runner's
      # mirrorlist stalls; timeout-minutes is the outer backstop.
      - name: Install and authorize Linux worker sandbox runtime
        timeout-minutes: 10
        shell: bash
        run: |
          bash scripts/ci/install-linux-sandbox-toolchain.sh

      - name: Delegate a cgroup v2 job boundary to the worker sandbox
        shell: bash
        run: bash scripts/ci/delegate-linux-cgroup.sh

      - name: Prepare Maven Wrapper
        shell: bash
        run: chmod +x mvnw

      - name: Product facts
        run: python scripts/docs/product-facts.py --check

      # --attach-pid keeps the privileged cgroup migration in the provisioning helper instead of
      # granting the MINOS account root cgroup.procs access; each `run:` block is its own shell, so
      # the attach must happen in the same step as the workload.
      - name: Maven verification
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci/delegate-linux-cgroup.sh --attach-pid $$
          ./mvnw -B -ntp clean verify

      - name: JaCoCo gates
        run: python scripts/quality/check-jacoco.py
