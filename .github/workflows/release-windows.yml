name: Publish Windows Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version SemVer à qualifier/publier, par exemple 1.0.1 ou 1.0.2-rc1'
        required: true
        default: '1.0.1'
        type: string

# The default token is read-only for every job. Only the publish job, which does nothing but
# download already-built and already-verified artifacts and create the GitHub Release, escalates
# to contents: write. Build, test and qualification never run with a privileged token.
permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  # Untrusted/external values (workflow_dispatch input, commit SHA) cross the GitHub Actions ->
  # PowerShell boundary ONLY through env vars, never through direct ${{ }} interpolation inside a
  # run: block. GitHub Actions substitutes ${{ }} into the script text before PowerShell parses it,
  # so a value containing a quote could otherwise close the surrounding string and inject arbitrary
  # PowerShell -- the [ValidatePattern] checks inside the release scripts are a second line of
  # defense, not a substitute for this boundary. See scripts/quality/check-workflow-pins.py, which
  # fails the build if a future change reintroduces ${{ inputs.* }}/${{ github.* }} inside a run:
  # block.
  RELEASE_VERSION: ${{ inputs.version }}
  TARGET_COMMIT: ${{ github.sha }}
  INNO_SETUP_VERSION: '6.7.1'

jobs:
  build:
    name: Build, MCP smoke test and qualify Windows x64 (read-only)
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Preflight exact ref and immutable tag
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $version = $env:RELEASE_VERSION
          $tag = "v$version"
          $head = (git rev-parse HEAD).Trim()
          if ($head -ne $env:TARGET_COMMIT) { throw "Exact-head mismatch before release: checkout=$head expected=$env:TARGET_COMMIT" }
          git fetch origin --tags --force
          $existingTag = @(git ls-remote --tags origin "refs/tags/$tag")
          if ($LASTEXITCODE -ne 0) { throw "Unable to inspect remote tag $tag." }
          if ($existingTag.Count -gt 0) { throw "Git tag $tag already exists on origin. Resolve the existing tag explicitly before publication; the release workflow will never move or overwrite it." }
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { throw "GitHub Release $tag already exists. Releases are immutable; publish a different version instead." }
          $global:LASTEXITCODE = 0
          Write-Host "Release preflight PASS: main@$head, $tag absent."

      - name: Require Windows installer and in-place upgrade CI success at this exact commit
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $head = (git rev-parse HEAD).Trim()
          if ($head -ne $env:TARGET_COMMIT) { throw "Exact-head mismatch before CI gate: checkout=$head expected=$env:TARGET_COMMIT" }
          # Both gated workflows are path-filtered (packaging/windows/**, scripts/install/**, ...)
          # for their automatic push trigger, so a release commit that does not itself touch those
          # paths -- the common case -- never produces a push-triggered run to find here. Accepting
          # a workflow_dispatch run too lets a maintainer manually re-run either workflow against
          # this exact commit before publishing when nothing installer-related changed; the gate
          # still fails closed on "no run" or "run did not succeed" either way.
          foreach ($workflow in @('windows-installer.yml', 'windows-in-place-upgrade.yml')) {
            $runsJson = gh run list --repo $env:GITHUB_REPOSITORY --workflow $workflow --branch main --json headSha,status,conclusion,databaseId,event --limit 20
            if ($LASTEXITCODE -ne 0) { throw "Unable to list CI runs for $workflow." }
            $runs = @($runsJson | ConvertFrom-Json)
            $matching = @($runs | Where-Object {
                $_.headSha -eq $head -and $_.status -eq 'completed' -and $_.conclusion -eq 'success' -and
                $_.event -in @('push', 'workflow_dispatch')
            })
            if ($matching.Count -eq 0) {
              throw "No successful '$workflow' run found on main (push or workflow_dispatch) for exact head $head. The Windows release certification chain requires this workflow to have passed for this exact commit before qualifying a release -- if this commit does not touch installer-related paths, manually dispatch the workflow against this commit first."
            }
            Write-Host "CI exact-head gate PASS for $workflow (run id $($matching[0].databaseId))"
          }

      - name: Set up Java 21 for IntelliJ validation
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          gradle-version: '9.6.1'
          cache-provider: basic

      - name: IntelliJ unit/build/structure gates
        working-directory: minos-intellij
        shell: pwsh
        run: gradle --no-daemon test buildPlugin verifyPluginProjectConfiguration verifyPluginStructure

      - name: IntelliJ Plugin Verifier
        working-directory: minos-intellij
        shell: pwsh
        run: gradle --no-daemon verifyPlugin

      - name: Set up Java 24 for MINOS release
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '24'
          cache: maven

      - name: Installer Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Installer Inno Setup
        shell: pwsh
        run: |
          $installOutput = (choco install innosetup --version=$env:INNO_SETUP_VERSION --yes --no-progress 2>&1 | Out-String)
          Write-Host $installOutput
          if ($LASTEXITCODE -ne 0) { throw "choco install innosetup --version=$env:INNO_SETUP_VERSION failed (exit=$LASTEXITCODE):`n$installOutput" }

          # Resolve the exact binary the choco package above just installed -- do NOT search PATH or
          # any other Inno Setup install location. A stray pre-existing Inno Setup 7 (or any other
          # ISCC.exe reachable via PATH/chocolatey shim) must never be able to silently take over
          # compilation of the release setup.exe just because it happened to be found first.
          $isccPath = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $isccPath -PathType Leaf)) {
            throw "Expected ISCC.exe was not installed by 'choco install innosetup --version=$env:INNO_SETUP_VERSION' at $isccPath."
          }

          # ISCC.exe itself exposes no trustworthy version signal: its FileVersion/ProductVersion PE
          # resources are both unset (observed as 0.0.0.0), and its bare-invocation usage banner
          # omits the minor/patch version (only an actual compile run prints the full versioned
          # banner). Verify against Chocolatey's own installed-package record instead -- the nuspec
          # it writes for every package -- cross-checked against Chocolatey's own install-time
          # confirmation message captured above.
          $nuspecPath = 'C:\ProgramData\chocolatey\lib\innosetup\innosetup.nuspec'
          if (-not (Test-Path -LiteralPath $nuspecPath -PathType Leaf)) {
            throw "Chocolatey package metadata not found at $nuspecPath; cannot verify the installed Inno Setup version."
          }
          [xml]$nuspec = Get-Content -LiteralPath $nuspecPath -Raw
          $installedVersion = $nuspec.package.metadata.version
          if ($installedVersion -ne $env:INNO_SETUP_VERSION) {
            throw "Chocolatey innosetup package metadata at $nuspecPath reports version '$installedVersion', expected $env:INNO_SETUP_VERSION."
          }
          if ($installOutput -notmatch [regex]::Escape($env:INNO_SETUP_VERSION)) {
            throw "Chocolatey's own install output did not confirm version $env:INNO_SETUP_VERSION:`n$installOutput"
          }
          Write-Host "Qualified ISCC: $isccPath (chocolatey innosetup package version=$installedVersion)"
          "ISCC_PATH=$isccPath" >> $env:GITHUB_ENV

      - name: Afficher la toolchain
        shell: pwsh
        run: |
          java -version
          .\mvnw.cmd -version
          python --version
          gh --version
          git rev-parse HEAD
          Write-Host "Ref: $env:GITHUB_REF"

      - name: Construire et qualifier la distribution Windows
        shell: pwsh
        run: .\scripts\release\publish-windows-release.ps1 -Version $env:RELEASE_VERSION -TargetCommit $env:TARGET_COMMIT -IsccPath $env:ISCC_PATH -RequiredIsccVersion $env:INNO_SETUP_VERSION -ValidateOnly

      - name: Publier les artefacts vérifiés pour le job de publication
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: minos-${{ inputs.version }}-windows-release-assets
          if-no-files-found: error
          retention-days: 1
          path: |
            target/dist/MINOS-${{ inputs.version }}-windows-x64-setup.exe
            target/dist/MINOS-${{ inputs.version }}-windows-x64-setup.exe.sha256
            target/dist/minos-${{ inputs.version }}-windows-x64.zip
            target/dist/minos-${{ inputs.version }}-windows-x64.zip.sha256
            target/dist/minos-${{ inputs.version }}.cdx.json
            target/dist/minos-${{ inputs.version }}.cdx.json.sha256
            target/dist/MINOS-${{ inputs.version }}-THIRD-PARTY-NOTICES.txt
            target/dist/MINOS-${{ inputs.version }}-THIRD-PARTY-NOTICES.txt.sha256

      - name: Conserver une copie des assets dans le run
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: minos-${{ inputs.version }}-windows-x64
          if-no-files-found: warn
          retention-days: 14
          path: |
            target/dist/MINOS-${{ inputs.version }}-windows-x64-setup.exe
            target/dist/MINOS-${{ inputs.version }}-windows-x64-setup.exe.sha256
            target/dist/minos-${{ inputs.version }}-windows-x64.zip
            target/dist/minos-${{ inputs.version }}-windows-x64.zip.sha256
            target/dist/minos-${{ inputs.version }}.cdx.json
            target/dist/minos-${{ inputs.version }}.cdx.json.sha256
            target/dist/MINOS-${{ inputs.version }}-THIRD-PARTY-NOTICES.txt
            target/dist/MINOS-${{ inputs.version }}-THIRD-PARTY-NOTICES.txt.sha256
            minos-intellij/build/distributions/*.zip
            minos-intellij/build/reports/**
            minos-intellij/build/test-results/**

  publish:
    name: Publish verified Windows x64 release
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Télécharger les artefacts déjà construits et vérifiés
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: minos-${{ inputs.version }}-windows-release-assets
          path: target/dist

      - name: Publier la GitHub Release
        shell: pwsh
        run: .\scripts\release\publish-windows-release.ps1 -Version $env:RELEASE_VERSION -TargetCommit $env:TARGET_COMMIT -PublishOnly
