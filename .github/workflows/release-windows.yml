name: Publish Windows Release

on:
  # Politique du dépôt : la publication reste une action explicite. Une fois
  # déclenché depuis main, le workflow construit, valide et publie les assets.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version SemVer à publier, par exemple 0.2.0 ou 0.2.0-rc1'
        required: true
        default: '0.2.0-rc1'
        type: string

permissions:
  contents: write

concurrency:
  group: windows-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build, smoke test and publish Windows x64
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Refuser une publication hors de main
        shell: pwsh
        run: |
          if ('${{ github.ref }}' -ne 'refs/heads/main') {
            throw 'MINOS releases must be published from the main branch.'
          }

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Installer Java 24
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '24'
          cache: maven

      - name: Afficher la toolchain
        shell: pwsh
        run: |
          java -version
          .\mvnw.cmd -version
          gh --version
          git rev-parse HEAD

      - name: Construire, valider et publier la GitHub Release
        shell: pwsh
        run: |
          .\scripts\release\publish-windows-release.ps1 `
            -Version '${{ inputs.version }}' `
            -TargetCommit '${{ github.sha }}'

      - name: Conserver une copie des assets dans le run
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: minos-${{ inputs.version }}-windows-x64
          if-no-files-found: warn
          retention-days: 14
          path: |
            target/dist/minos-${{ inputs.version }}-windows-x64.zip
            target/dist/minos-${{ inputs.version }}-windows-x64.zip.sha256
