name: Publish Windows Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version SemVer à qualifier/publier, par exemple 1.0.1 ou 1.0.2-rc1'
        required: true
        default: '1.0.1'
        type: string

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build, MCP smoke test and publish Windows x64
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Preflight exact ref and immutable tag
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $version = '${{ inputs.version }}'
          $tag = "v$version"
          $head = (git rev-parse HEAD).Trim()
          if ($head -ne '${{ github.sha }}') { throw "Exact-head mismatch before release: checkout=$head expected=${{ github.sha }}" }
          git fetch origin --tags --force
          $existingTag = @(git ls-remote --tags origin "refs/tags/$tag")
          if ($LASTEXITCODE -ne 0) { throw "Unable to inspect remote tag $tag." }
          if ($existingTag.Count -gt 0) { throw "Git tag $tag already exists on origin. Resolve the existing tag explicitly before publication; the release workflow will never move or overwrite it." }
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { throw "GitHub Release $tag already exists. Releases are immutable; publish a different version instead." }
          $global:LASTEXITCODE = 0
          Write-Host "Release preflight PASS: main@$head, $tag absent."

      - name: Set up Java 21 for IntelliJ validation
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          gradle-version: '9.6.1'
          cache-provider: basic

      - name: IntelliJ unit/build/structure gates
        working-directory: minos-intellij
        shell: pwsh
        run: gradle --no-daemon test buildPlugin verifyPluginProjectConfiguration verifyPluginStructure

      - name: IntelliJ Plugin Verifier
        working-directory: minos-intellij
        shell: pwsh
        run: gradle --no-daemon verifyPlugin

      - name: Set up Java 24 for MINOS release
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '24'
          cache: maven

      - name: Installer Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Installer Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --version=6.7.1 --yes --no-progress
          $iscc = @(
            (Get-Command ISCC.exe -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source -ErrorAction SilentlyContinue),
            'C:\Program Files (x86)\Inno Setup 7\ISCC.exe',
            'C:\Program Files\Inno Setup 7\ISCC.exe',
            'C:\Program Files (x86)\Inno Setup 6\ISCC.exe',
            'C:\Program Files\Inno Setup 6\ISCC.exe',
            'C:\ProgramData\chocolatey\bin\ISCC.exe'
          ) | Where-Object { $_ -and (Test-Path -LiteralPath $_) } | Select-Object -First 1
          if (-not $iscc) { throw 'Inno Setup installation did not expose ISCC.exe.' }
          Write-Host "ISCC: $iscc"

      - name: Afficher la toolchain
        shell: pwsh
        run: |
          java -version
          .\mvnw.cmd -version
          python --version
          gh --version
          git rev-parse HEAD
          Write-Host "Ref: $env:GITHUB_REF"

      - name: Construire et qualifier la distribution Windows
        if: github.ref != 'refs/heads/main'
        shell: pwsh
        run: .\scripts\release\publish-windows-release.ps1 -Version '${{ inputs.version }}' -TargetCommit '${{ github.sha }}' -ValidateOnly

      - name: Construire, qualifier et publier la GitHub Release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: .\scripts\release\publish-windows-release.ps1 -Version '${{ inputs.version }}' -TargetCommit '${{ github.sha }}'

      - name: Conserver une copie des assets dans le run
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: minos-${{ inputs.version }}-windows-x64
          if-no-files-found: warn
          retention-days: 14
          path: |
            target/dist/MINOS-${{ inputs.version }}-windows-x64-setup.exe
            target/dist/MINOS-${{ inputs.version }}-windows-x64-setup.exe.sha256
            target/dist/minos-${{ inputs.version }}-windows-x64.zip
            target/dist/minos-${{ inputs.version }}-windows-x64.zip.sha256
            target/dist/minos-${{ inputs.version }}.cdx.json
            target/dist/minos-${{ inputs.version }}.cdx.json.sha256
            target/dist/MINOS-${{ inputs.version }}-THIRD-PARTY-NOTICES.txt
            target/dist/MINOS-${{ inputs.version }}-THIRD-PARTY-NOTICES.txt.sha256
            minos-intellij/build/distributions/*.zip
            minos-intellij/build/reports/**
            minos-intellij/build/test-results/**
