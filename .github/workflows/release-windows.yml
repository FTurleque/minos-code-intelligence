name: Publish Windows Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version SemVer à qualifier/publier, par exemple 1.0.1 ou 1.0.2-rc1'
        required: true
        default: '1.0.1'
        type: string

# The default token is read-only for every job. Only the publish job, which does nothing but
# download already-built and already-verified artifacts and create the GitHub Release, escalates
# to contents: write. Build, test and qualification never run with a privileged token.
permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  # Untrusted/external values (workflow_dispatch input, commit SHA) cross the GitHub Actions ->
  # PowerShell boundary ONLY through env vars, never through direct ${{ }} interpolation inside a
  # run: block. GitHub Actions substitutes ${{ }} into the script text before PowerShell parses it,
  # so a value containing a quote could otherwise close the surrounding string and inject arbitrary
  # PowerShell -- the [ValidatePattern] checks inside the release scripts are a second line of
  # defense, not a substitute for this boundary. See scripts/quality/check-workflow-pins.py, which
  # fails the build if a future change reintroduces ${{ inputs.* }}/${{ github.* }} inside a run:
  # block.
  RELEASE_VERSION: ${{ inputs.version }}
  TARGET_COMMIT: ${{ github.sha }}
  INNO_SETUP_VERSION: '6.7.1'

jobs:
  build:
    name: Build, MCP smoke test and qualify Windows x64 (read-only)
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Preflight exact ref and immutable tag
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $version = $env:RELEASE_VERSION
          $tag = "v$version"
          $head = (git rev-parse HEAD).Trim()
          if ($head -ne $env:TARGET_COMMIT) { throw "Exact-head mismatch before release: checkout=$head expected=$env:TARGET_COMMIT" }
          git fetch origin --tags --force
          $existingTag = @(git ls-remote --tags origin "refs/tags/$tag")
          if ($LASTEXITCODE -ne 0) { throw "Unable to inspect remote tag $tag." }
          if ($existingTag.Count -gt 0) { throw "Git tag $tag already exists on origin. Resolve the existing tag explicitly before publication; the release workflow will never move or overwrite it." }
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { throw "GitHub Release $tag already exists. Releases are immutable; publish a different version instead." }
          $global:LASTEXITCODE = 0
          Write-Host "Release preflight PASS: main@$head, $tag absent."

      - name: Set up Java 21 for IntelliJ validation
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          gradle-version: '9.6.1'
          cache-provider: basic

      - name: IntelliJ unit/build/structure gates
        working-directory: minos-intellij
        shell: pwsh
        run: gradle --no-daemon test buildPlugin verifyPluginProjectConfiguration verifyPluginStructure

      - name: IntelliJ Plugin Verifier
        working-directory: minos-intellij
        shell: pwsh
        run: gradle --no-daemon verifyPlugin

      - name: Set up Java 24 for MINOS release
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '24'
          cache: maven

      - name: Installer Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Installer Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --version=$env:INNO_SETUP_VERSION --yes --no-progress
          # Resolve the exact binary the choco package above just installed -- do NOT search PATH or
          # any other Inno Setup install location. A stray pre-existing Inno Setup 7 (or any other
          # ISCC.exe reachable via PATH/chocolatey shim) must never be able to silently take over
          # compilation of the release setup.exe just because it happened to be found first.
          $isccPath = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $isccPath -PathType Leaf)) {
            throw "Expected ISCC.exe was not installed by 'choco install innosetup --version=$env:INNO_SETUP_VERSION' at $isccPath."
          }
          # Inno Setup's ISCC.exe does not reliably stamp FileVersion (observed as 0.0.0.0 on the
          # 6.7.1 chocolatey package); ProductVersion is what actually carries the release number,
          # so check both and accept either.
          $versionInfo = (Get-Item -LiteralPath $isccPath).VersionInfo
          $reportedVersions = @($versionInfo.ProductVersion, $versionInfo.FileVersion) | Where-Object { $_ }
          if (-not ($reportedVersions | Where-Object { $_ -like "$($env:INNO_SETUP_VERSION)*" })) {
            throw "ISCC.exe at $isccPath reports ProductVersion='$($versionInfo.ProductVersion)' FileVersion='$($versionInfo.FileVersion)', expected $env:INNO_SETUP_VERSION. Refusing to build the release setup with an unverified Inno Setup compiler."
          }
          Write-Host "Qualified ISCC: $isccPath (ProductVersion=$($versionInfo.ProductVersion) FileVersion=$($versionInfo.FileVersion))"
          "ISCC_PATH=$isccPath" >> $env:GITHUB_ENV

      - name: Afficher la toolchain
        shell: pwsh
        run: |
          java -version
          .\mvnw.cmd -version
          python --version
          gh --version
          git rev-parse HEAD
          Write-Host "Ref: $env:GITHUB_REF"

      - name: Construire et qualifier la distribution Windows
        shell: pwsh
        run: .\scripts\release\publish-windows-release.ps1 -Version $env:RELEASE_VERSION -TargetCommit $env:TARGET_COMMIT -IsccPath $env:ISCC_PATH -RequiredIsccVersion $env:INNO_SETUP_VERSION -ValidateOnly

      - name: Publier les artefacts vérifiés pour le job de publication
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: minos-${{ inputs.version }}-windows-release-assets
          if-no-files-found: error
          retention-days: 1
          path: |
            target/dist/MINOS-${{ inputs.version }}-windows-x64-setup.exe
            target/dist/MINOS-${{ inputs.version }}-windows-x64-setup.exe.sha256
            target/dist/minos-${{ inputs.version }}-windows-x64.zip
            target/dist/minos-${{ inputs.version }}-windows-x64.zip.sha256
            target/dist/minos-${{ inputs.version }}.cdx.json
            target/dist/minos-${{ inputs.version }}.cdx.json.sha256
            target/dist/MINOS-${{ inputs.version }}-THIRD-PARTY-NOTICES.txt
            target/dist/MINOS-${{ inputs.version }}-THIRD-PARTY-NOTICES.txt.sha256

      - name: Conserver une copie des assets dans le run
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: minos-${{ inputs.version }}-windows-x64
          if-no-files-found: warn
          retention-days: 14
          path: |
            target/dist/MINOS-${{ inputs.version }}-windows-x64-setup.exe
            target/dist/MINOS-${{ inputs.version }}-windows-x64-setup.exe.sha256
            target/dist/minos-${{ inputs.version }}-windows-x64.zip
            target/dist/minos-${{ inputs.version }}-windows-x64.zip.sha256
            target/dist/minos-${{ inputs.version }}.cdx.json
            target/dist/minos-${{ inputs.version }}.cdx.json.sha256
            target/dist/MINOS-${{ inputs.version }}-THIRD-PARTY-NOTICES.txt
            target/dist/MINOS-${{ inputs.version }}-THIRD-PARTY-NOTICES.txt.sha256
            minos-intellij/build/distributions/*.zip
            minos-intellij/build/reports/**
            minos-intellij/build/test-results/**

  publish:
    name: Publish verified Windows x64 release
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Télécharger les artefacts déjà construits et vérifiés
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: minos-${{ inputs.version }}-windows-release-assets
          path: target/dist

      - name: Publier la GitHub Release
        shell: pwsh
        run: .\scripts\release\publish-windows-release.ps1 -Version $env:RELEASE_VERSION -TargetCommit $env:TARGET_COMMIT -PublishOnly
