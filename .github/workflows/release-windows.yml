name: Publish Windows Release

on:
  # Publication volontaire uniquement. Ce workflow n'est jamais déclenché par
  # un push ou une pull request. Sur main il publie; sur une autre branche il
  # qualifie seulement les artefacts demandés.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version SemVer à qualifier/publier, par exemple 1.0.1 ou 1.0.2-rc1'
        required: true
        default: '1.0.1'
        type: string

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build, MCP smoke test and publish Windows x64
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Installer Java 24
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '24'
          cache: maven

      - name: Installer Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Installer Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          $iscc = @(
            (Get-Command ISCC.exe -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source -ErrorAction SilentlyContinue),
            'C:\Program Files (x86)\Inno Setup 7\ISCC.exe',
            'C:\Program Files\Inno Setup 7\ISCC.exe',
            'C:\Program Files (x86)\Inno Setup 6\ISCC.exe',
            'C:\Program Files\Inno Setup 6\ISCC.exe',
            'C:\ProgramData\chocolatey\bin\ISCC.exe'
          ) | Where-Object { $_ -and (Test-Path -LiteralPath $_) } | Select-Object -First 1
          if (-not $iscc) {
            throw 'Inno Setup installation did not expose ISCC.exe.'
          }
          Write-Host "ISCC: $iscc"

      - name: Afficher la toolchain
        shell: pwsh
        run: |
          java -version
          .\mvnw.cmd -version
          python --version
          gh --version
          git rev-parse HEAD
          Write-Host "Ref: $env:GITHUB_REF"

      - name: Construire et qualifier la distribution Windows
        if: github.ref != 'refs/heads/main'
        shell: pwsh
        run: |
          .\scripts\release\publish-windows-release.ps1 `
            -Version '${{ inputs.version }}' `
            -TargetCommit '${{ github.sha }}' `
            -ValidateOnly

      - name: Construire, qualifier et publier la GitHub Release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          .\scripts\release\publish-windows-release.ps1 `
            -Version '${{ inputs.version }}' `
            -TargetCommit '${{ github.sha }}'

      - name: Conserver une copie des assets dans le run
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: minos-${{ inputs.version }}-windows-x64
          if-no-files-found: warn
          retention-days: 14
          path: |
            target/dist/MINOS-${{ inputs.version }}-windows-x64-setup.exe
            target/dist/MINOS-${{ inputs.version }}-windows-x64-setup.exe.sha256
            target/dist/minos-${{ inputs.version }}-windows-x64.zip
            target/dist/minos-${{ inputs.version }}-windows-x64.zip.sha256
            target/dist/minos-${{ inputs.version }}.cdx.json
            target/dist/minos-${{ inputs.version }}.cdx.json.sha256
            target/dist/MINOS-${{ inputs.version }}-THIRD-PARTY-NOTICES.txt
            target/dist/MINOS-${{ inputs.version }}-THIRD-PARTY-NOTICES.txt.sha256
