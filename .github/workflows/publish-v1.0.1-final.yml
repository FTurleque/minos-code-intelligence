name: Publish MINOS v1.0.1 final

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v1.0.1-final.yml'

permissions:
  actions: read
  contents: write
  issues: write

concurrency:
  group: publish-minos-v1.0.1-final
  cancel-in-progress: false

jobs:
  publish:
    name: Publish tested MINOS v1.0.1 and replace legacy release
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: '1.0.1'
      RELEASE_TAG: 'v1.0.1'
      RELEASE_COMMIT: 'f762025d66e33c40324c811079f1527d122f90f9'
      LEGACY_TAG_COMMIT: '2de847bdc6bc39e63715f20987a30f07731cc717'
      LEGACY_RELEASE_PUBLISHED_AT: '2026-08-04T12:59:21Z'

    steps:
      - name: Checkout publication trigger
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Report start
        shell: pwsh
        run: |
          gh issue comment 106 --repo $env:GITHUB_REPOSITORY --body "## Publication finale v1.0.1 — tentative corrigée`n`nRun : $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID`n`nLe plugin IntelliJ est cette fois construit explicitement avec ``-PminosVersion=1.0.1``. Aucun état legacy ne sera supprimé avant la requalification complète."

      - name: Guard and back up exact legacy release
        shell: pwsh
        run: |
          $triggerHead = (git rev-parse HEAD).Trim()
          git merge-base --is-ancestor $env:RELEASE_COMMIT $triggerHead
          if ($LASTEXITCODE -ne 0) { throw "Tested commit is not an ancestor of publication trigger: $env:RELEASE_COMMIT" }

          git fetch origin --tags --force
          $tag = @(git ls-remote --tags origin "refs/tags/$env:RELEASE_TAG")
          if ($LASTEXITCODE -ne 0 -or $tag.Count -ne 1) { throw 'Expected exactly one legacy v1.0.1 tag.' }
          $tagSha = (($tag[0] -split '\s+')[0]).Trim()
          if ($tagSha -ne $env:LEGACY_TAG_COMMIT) { throw "Legacy tag mismatch: expected=$env:LEGACY_TAG_COMMIT actual=$tagSha" }

          $legacyJson = gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json name,tagName,targetCommitish,url,isDraft,isPrerelease,createdAt,publishedAt,assets,body
          if ($LASTEXITCODE -ne 0) { throw 'Expected legacy GitHub Release is missing.' }
          $legacy = $legacyJson | ConvertFrom-Json
          if ($legacy.tagName -ne $env:RELEASE_TAG -or $legacy.publishedAt -ne $env:LEGACY_RELEASE_PUBLISHED_AT -or $legacy.isDraft -or $legacy.isPrerelease) {
            throw "Legacy release identity mismatch. tag=$($legacy.tagName) publishedAt=$($legacy.publishedAt)"
          }

          $expected = @(
            'MINOS-1.0.1-THIRD-PARTY-NOTICES.txt',
            'MINOS-1.0.1-THIRD-PARTY-NOTICES.txt.sha256',
            'MINOS-1.0.1-windows-x64-setup.exe',
            'MINOS-1.0.1-windows-x64-setup.exe.sha256',
            'minos-1.0.1-windows-x64.zip',
            'minos-1.0.1-windows-x64.zip.sha256',
            'minos-1.0.1.cdx.json',
            'minos-1.0.1.cdx.json.sha256',
            'minos-intellij-1.0.1.zip',
            'minos-intellij-1.0.1.zip.sha256'
          ) | Sort-Object
          $actual = @($legacy.assets | ForEach-Object { $_.name } | Sort-Object)
          if (($expected -join "`n") -ne ($actual -join "`n")) { throw 'Legacy release asset set changed; refusing replacement.' }

          $backup = Join-Path $env:RUNNER_TEMP 'minos-v1.0.1-legacy-release'
          $assetDir = Join-Path $backup 'assets'
          New-Item -ItemType Directory -Force -Path $assetDir | Out-Null
          $legacyJson | Out-File -LiteralPath (Join-Path $backup 'release.json') -Encoding utf8
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --dir $assetDir
          if ($LASTEXITCODE -ne 0) { throw 'Unable to back up legacy release assets.' }
          if (@(Get-ChildItem -LiteralPath $assetDir -File).Count -ne 10) { throw 'Legacy asset backup is incomplete.' }
          Write-Host "Legacy release backup complete: $backup"

      - name: Checkout exact user-tested release commit
        shell: pwsh
        run: |
          git checkout --detach $env:RELEASE_COMMIT
          if ((git rev-parse HEAD).Trim() -ne $env:RELEASE_COMMIT) { throw 'Exact release checkout mismatch.' }
          if (@(git status --porcelain=v1 --untracked-files=all).Count -gt 0) { throw 'Release checkout is dirty.' }

      - name: Set up Java 21 for IntelliJ release build
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.1'
          cache-provider: basic

      - name: Build and verify IntelliJ plugin at release version
        working-directory: minos-intellij
        shell: pwsh
        run: |
          gradle --no-daemon "-PminosVersion=$env:RELEASE_VERSION" test buildPlugin verifyPluginProjectConfiguration verifyPluginStructure
          if ($LASTEXITCODE -ne 0) { throw 'IntelliJ release build/structure verification failed.' }
          gradle --no-daemon "-PminosVersion=$env:RELEASE_VERSION" verifyPlugin
          if ($LASTEXITCODE -ne 0) { throw 'IntelliJ Plugin Verifier failed.' }

      - name: Prepare IntelliJ plugin ZIP and SHA-256
        shell: pwsh
        run: |
          $zips = @(Get-ChildItem -LiteralPath 'minos-intellij\build\distributions' -Filter '*.zip' -File)
          if ($zips.Count -ne 1) { throw "Expected exactly one IntelliJ plugin ZIP; found $($zips.Count)." }
          $zip = $zips[0]
          if ($zip.Name -ne 'minos-intellij-1.0.1.zip') { throw "Unexpected IntelliJ ZIP name: $($zip.Name)" }
          $sha = "$($zip.FullName).sha256"
          $hash = (Get-FileHash -LiteralPath $zip.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($zip.Name)" | Set-Content -LiteralPath $sha -Encoding ascii
          "PLUGIN_ZIP=$($zip.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PLUGIN_SHA=$sha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "IntelliJ asset ready: $($zip.Name) sha256=$hash"

      - name: Set up Java 24 for MINOS release
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '24'
          cache: maven

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Rebuild and validate Windows release before any deletion
        shell: pwsh
        run: |
          .\scripts\release\publish-windows-release.ps1 -Version $env:RELEASE_VERSION -TargetCommit $env:RELEASE_COMMIT -ValidateOnly

      - name: Recheck legacy state and remove only authorized legacy release
        shell: pwsh
        run: |
          $tag = @(git ls-remote --tags origin "refs/tags/$env:RELEASE_TAG")
          if ($LASTEXITCODE -ne 0 -or $tag.Count -ne 1) { throw 'Legacy tag disappeared or became ambiguous.' }
          $tagSha = (($tag[0] -split '\s+')[0]).Trim()
          if ($tagSha -ne $env:LEGACY_TAG_COMMIT) { throw "Legacy tag changed before replacement: $tagSha" }

          $legacy = gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json tagName,publishedAt,assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $legacy.tagName -ne $env:RELEASE_TAG -or $legacy.publishedAt -ne $env:LEGACY_RELEASE_PUBLISHED_AT -or @($legacy.assets).Count -ne 10) {
            throw 'Legacy release changed before replacement.'
          }

          gh release delete $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --yes
          if ($LASTEXITCODE -ne 0) { throw 'Unable to delete authorized legacy release.' }
          'LEGACY_RELEASE_REMOVED=true' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          git push origin ":refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw 'Unable to delete authorized legacy tag.' }
          'LEGACY_TAG_REMOVED=true' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          if (@(git ls-remote --tags origin "refs/tags/$env:RELEASE_TAG").Count -ne 0) { throw 'Legacy v1.0.1 tag still exists.' }

      - name: Publish validated Windows release
        shell: pwsh
        run: |
          .\scripts\release\publish-windows-release.ps1 -Version $env:RELEASE_VERSION -TargetCommit $env:RELEASE_COMMIT -SkipBuild

      - name: Add validated IntelliJ plugin assets
        shell: pwsh
        run: |
          gh release upload $env:RELEASE_TAG $env:PLUGIN_ZIP $env:PLUGIN_SHA --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Unable to upload IntelliJ plugin assets.' }

      - name: Verify final release tag assets and checksums
        shell: pwsh
        run: |
          $tag = @(git ls-remote --tags origin "refs/tags/$env:RELEASE_TAG")
          if ($LASTEXITCODE -ne 0 -or $tag.Count -ne 1) { throw 'Final v1.0.1 tag is missing.' }
          $tagSha = (($tag[0] -split '\s+')[0]).Trim()
          if ($tagSha -ne $env:RELEASE_COMMIT) { throw "Final tag mismatch: expected=$env:RELEASE_COMMIT actual=$tagSha" }

          $release = gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json tagName,url,isDraft,isPrerelease,assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $release.tagName -ne $env:RELEASE_TAG -or $release.isDraft -or $release.isPrerelease) { throw 'Final release state is invalid.' }

          $expected = @(
            'MINOS-1.0.1-THIRD-PARTY-NOTICES.txt',
            'MINOS-1.0.1-THIRD-PARTY-NOTICES.txt.sha256',
            'MINOS-1.0.1-windows-x64-setup.exe',
            'MINOS-1.0.1-windows-x64-setup.exe.sha256',
            'minos-1.0.1-windows-x64.zip',
            'minos-1.0.1-windows-x64.zip.sha256',
            'minos-1.0.1.cdx.json',
            'minos-1.0.1.cdx.json.sha256',
            'minos-intellij-1.0.1.zip',
            'minos-intellij-1.0.1.zip.sha256'
          ) | Sort-Object
          $actual = @($release.assets | ForEach-Object { $_.name } | Sort-Object)
          if (($expected -join "`n") -ne ($actual -join "`n")) { throw 'Final release does not contain the exact 10 expected assets.' }

          $verify = Join-Path $env:RUNNER_TEMP 'minos-v1.0.1-final-verification'
          New-Item -ItemType Directory -Force -Path $verify | Out-Null
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --dir $verify
          if ($LASTEXITCODE -ne 0) { throw 'Unable to download final release assets.' }

          function Assert-Sha([string]$payloadName,[string]$sidecarName) {
            $payload = Join-Path $verify $payloadName
            $sidecar = Join-Path $verify $sidecarName
            $expectedHash = ((Get-Content -LiteralPath $sidecar -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
            $actualHash = (Get-FileHash -LiteralPath $payload -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($expectedHash -ne $actualHash) { throw "SHA-256 mismatch for $payloadName expected=$expectedHash actual=$actualHash" }
          }
          Assert-Sha 'MINOS-1.0.1-windows-x64-setup.exe' 'MINOS-1.0.1-windows-x64-setup.exe.sha256'
          Assert-Sha 'minos-1.0.1-windows-x64.zip' 'minos-1.0.1-windows-x64.zip.sha256'
          Assert-Sha 'minos-1.0.1.cdx.json' 'minos-1.0.1.cdx.json.sha256'
          Assert-Sha 'MINOS-1.0.1-THIRD-PARTY-NOTICES.txt' 'MINOS-1.0.1-THIRD-PARTY-NOTICES.txt.sha256'
          Assert-Sha 'minos-intellij-1.0.1.zip' 'minos-intellij-1.0.1.zip.sha256'
          "FINAL_RELEASE_URL=$($release.url)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Report success
        shell: pwsh
        run: |
          gh issue comment 106 --repo $env:GITHUB_REPOSITORY --body "## MINOS v1.0.1 publiée et vérifiée ✅`n`n- Tag : ``v1.0.1`` → ``$env:RELEASE_COMMIT```n- Release : $env:FINAL_RELEASE_URL`n- 10 assets présents`n- 5 paires payload/SHA-256 re-téléchargées et vérifiées`n- Plugin IntelliJ construit en version finale 1.0.1 et passé au Plugin Verifier`n- Run : $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"

      - name: Restore exact legacy release on failure after deletion
        if: failure() && env.LEGACY_RELEASE_REMOVED == 'true'
        shell: pwsh
        run: |
          $backup = Join-Path $env:RUNNER_TEMP 'minos-v1.0.1-legacy-release'
          $metaPath = Join-Path $backup 'release.json'
          $assetDir = Join-Path $backup 'assets'
          if (-not (Test-Path -LiteralPath $metaPath -PathType Leaf) -or @(Get-ChildItem -LiteralPath $assetDir -File).Count -ne 10) { throw 'Legacy backup unavailable for restoration.' }
          $legacy = Get-Content -LiteralPath $metaPath -Raw | ConvertFrom-Json

          $previous = $ErrorActionPreference
          try {
            $ErrorActionPreference = 'Continue'
            gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
            $replacementExists = ($LASTEXITCODE -eq 0)
          }
          finally { $ErrorActionPreference = $previous }
          $global:LASTEXITCODE = 0
          if ($replacementExists) { gh release delete $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --yes }

          $remoteTag = @(git ls-remote --tags origin "refs/tags/$env:RELEASE_TAG")
          if ($remoteTag.Count -gt 0) {
            if ($remoteTag.Count -ne 1) { throw 'Ambiguous tag during restoration.' }
            $current = (($remoteTag[0] -split '\s+')[0]).Trim()
            if ($current -ne $env:RELEASE_COMMIT -and $current -ne $env:LEGACY_TAG_COMMIT) { throw "Unexpected v1.0.1 tag during restoration: $current" }
            git push origin ":refs/tags/$env:RELEASE_TAG"
            if ($LASTEXITCODE -ne 0) { throw 'Unable to clear tag before restoration.' }
          }
          git push origin "$($env:LEGACY_TAG_COMMIT):refs/tags/$($env:RELEASE_TAG)"
          if ($LASTEXITCODE -ne 0) { throw 'Unable to restore legacy tag.' }

          $bodyFile = Join-Path $backup 'legacy-body.md'
          [System.IO.File]::WriteAllText($bodyFile,[string]$legacy.body,[System.Text.UTF8Encoding]::new($false))
          $assetPaths = @(Get-ChildItem -LiteralPath $assetDir -File | ForEach-Object { $_.FullName })
          & gh release create $env:RELEASE_TAG @assetPaths --repo $env:GITHUB_REPOSITORY --verify-tag --title ([string]$legacy.name) --notes-file $bodyFile
          if ($LASTEXITCODE -ne 0) { throw 'Unable to restore legacy GitHub Release.' }
          gh issue comment 106 --repo $env:GITHUB_REPOSITORY --body "⚠️ La tentative de remplacement v1.0.1 a échoué après suppression ; l'ancienne Release et ses 10 assets ont été restaurés automatiquement sur ``$env:LEGACY_TAG_COMMIT``. Run : $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"

      - name: Report safe failure before deletion
        if: failure() && env.LEGACY_RELEASE_REMOVED != 'true'
        shell: pwsh
        run: |
          gh issue comment 106 --repo $env:GITHUB_REPOSITORY --body "❌ Publication v1.0.1 arrêtée avant toute suppression de l'état legacy. Tag/Release existants inchangés. Run : $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"

      - name: Preserve transaction evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: minos-1.0.1-final-publication
          retention-days: 30
          if-no-files-found: warn
          path: |
            target/dist/MINOS-1.0.1-windows-x64-setup.exe
            target/dist/MINOS-1.0.1-windows-x64-setup.exe.sha256
            target/dist/minos-1.0.1-windows-x64.zip
            target/dist/minos-1.0.1-windows-x64.zip.sha256
            target/dist/minos-1.0.1.cdx.json
            target/dist/minos-1.0.1.cdx.json.sha256
            target/dist/MINOS-1.0.1-THIRD-PARTY-NOTICES.txt
            target/dist/MINOS-1.0.1-THIRD-PARTY-NOTICES.txt.sha256
            minos-intellij/build/distributions/*.zip
            minos-intellij/build/distributions/*.sha256
            minos-intellij/build/reports/**
            minos-intellij/build/test-results/**
            ${{ runner.temp }}/minos-v1.0.1-legacy-release/**
            ${{ runner.temp }}/minos-v1.0.1-final-verification/**
