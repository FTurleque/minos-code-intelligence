name: Post-audit final Linux IntelliJ validation

on:
  push:
    branches: [fix/post-audit-remediation-20260814]
    paths: [.github/workflows/post-audit-intellij-linux-final.yml]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/post-audit-remediation-20260814
          fetch-depth: 0
      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          gradle-version: '9.6.1'
          cache-provider: basic
      - name: Full plugin suite and structure
        working-directory: minos-intellij
        run: gradle --no-daemon test buildPlugin verifyPluginProjectConfiguration verifyPluginStructure --rerun-tasks
      - name: Assert production strong launch contract
        shell: bash
        run: |
          grep -F 'MinosStrongProcessLauncher.start(builder, settings.minosHome)' minos-intellij/src/main/java/com/minos/intellij/protocol/MinosCliClient.java
          if grep -F 'new MinosProcessSupervisor(builder.start())' minos-intellij/src/main/java/com/minos/intellij/protocol/MinosCliClient.java; then
            exit 1
          fi
