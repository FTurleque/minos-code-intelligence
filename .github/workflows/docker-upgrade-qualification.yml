name: Docker A-to-B Upgrade Qualification

on:
  workflow_dispatch:
    inputs:
      previous_ref:
        description: 'Previous MINOS commit/ref to install as candidate A; blank uses the first parent of the selected candidate.'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: docker-upgrade-qualification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  real-windows-docker-upgrade:
    name: Real Windows Docker Desktop A -> B upgrade
    runs-on: [self-hosted, Windows, X64, minos-docker]
    timeout-minutes: 180

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Java 24
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '24'
          cache: maven

      - name: Assert exact candidate HEAD
        shell: powershell
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:EXPECTED_SHA) {
            throw "Exact-head mismatch: actual=$actual expected=$env:EXPECTED_SHA"
          }

      - name: Run real Docker A-to-B upgrade qualification
        shell: powershell
        env:
          EXPECTED_SHA: ${{ github.sha }}
          PREVIOUS_REF: ${{ inputs.previous_ref }}
        run: |
          .\scripts\ci\qualify-docker-upgrade.ps1 `
            -CandidateRef $env:EXPECTED_SHA `
            -PreviousRef $env:PREVIOUS_REF

      - name: Upload Docker upgrade qualification evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: docker-upgrade-${{ github.sha }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 30
          path: target/qualification/docker-upgrade/**
