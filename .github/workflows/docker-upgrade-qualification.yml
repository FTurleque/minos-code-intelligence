name: Docker A-to-B Upgrade Qualification

# Manual/ad-hoc entry point for the real Docker A -> B upgrade qualification. The automatic path
# used by the develop -> main promotion gate is embedded directly in release-promotion-gate.yml
# (one workflow, sequential jobs) rather than triggered from here, so this workflow intentionally
# has no pull_request trigger: it must never run twice for the same promotion candidate.
#
# Runs on a standard GitHub-hosted ubuntu-24.04 runner: no privately-registered runner, no personal
# machine, no private infrastructure repository - this repository is public and qualification here
# must not depend on infrastructure this project doesn't control or disclose.

on:
  workflow_dispatch:
    inputs:
      previous_ref:
        description: 'Previous MINOS commit/ref to install as candidate A; blank uses the merge-base with origin/develop, then first-parent fallback.'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: docker-upgrade-qualification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  real-docker-upgrade:
    name: Real Docker A -> B upgrade (GitHub-hosted)
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      # Docker Hub limits anonymous pulls per runner address (429 toomanyrequests on 2026-10-09 stopped base images,
      # pgvector for the PostgreSQL tests, and the Docker qualifications). With the repository secrets
      # DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (a read-only access token), pulls are authenticated, Testcontainers
      # included; without them (forks, secrets not created) this step is skipped and pulls stay anonymous.
      - name: Log in to Docker Hub (when the secrets exist)
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Java 24
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '24'
          cache: maven

      - name: Assert exact candidate HEAD
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SHA"

      - name: Verify Docker Engine and Compose are available
        shell: bash
        run: |
          set -euo pipefail
          docker version --format '{{.Server.Version}}'
          docker compose version

      - name: Run real Docker A-to-B upgrade qualification
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ github.sha }}
          PREVIOUS_REF: ${{ inputs.previous_ref }}
        run: |
          ./scripts/ci/qualify-docker-upgrade.ps1 `
            -CandidateRef $env:EXPECTED_SHA `
            -PreviousRef $env:PREVIOUS_REF

      - name: Upload Docker upgrade qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-upgrade-${{ github.sha }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 30
          path: target/qualification/docker-upgrade/**
