name: Post-audit remediation source patch v3

on:
  push:
    branches: [fix/post-audit-remediation-20260814]
    paths: [.github/workflows/post-audit-remediation-source-v3.yml]

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/post-audit-remediation-20260814
          fetch-depth: 0

      - name: Set up Java 24
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '24'
          cache: maven

      - name: Apply corrected source patch
        shell: python
        run: |
          from pathlib import Path
          workflow = Path('.github/workflows/post-audit-remediation-source.yml').read_text(encoding='utf-8')
          start = workflow.index('          from pathlib import Path\n')
          end = workflow.index('\n\n      - name: Targeted Maven tests', start)
          block = workflow[start:end]
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines())
          script = script.replace(
              'new IndexerSelection(Language.JAVA, descriptor, List.of())',
              'new IndexerSelection(Language.JAVA, descriptor)')
          script = script.replace(
              'Path root = Path.of("..").toAbsolutePath().normalize();',
              'Path root = Path.of(".").toAbsolutePath().normalize();')
          exec(compile(script, '<post-audit-source-patch>', 'exec'), {})

      - name: Targeted Maven tests
        shell: bash
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp -pl minos-runtime-local,minos-app -am -Dtest=StrongOwnershipRemoteSandboxCompositionTest,M29DockerNpmLockContractTest -Dsurefire.failIfNoSpecifiedTests=false test

      - name: Module boundary and remediation gates
        run: |
          python scripts/architecture/check-module-boundaries.py
          python scripts/remediation/check-p0-p2.py

      - name: Commit source corrections
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add minos-runtime-local minos-app docker
          git commit -m 'fix: restore remote sandbox composition and lock docker npm providers'
          git push origin HEAD:fix/post-audit-remediation-20260814
