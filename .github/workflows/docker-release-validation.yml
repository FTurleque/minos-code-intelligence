name: Docker Release Validation

on:
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'scripts/history/**'
  push:
    branches: [main, develop]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'scripts/history/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-release-validation-${{ github.event.pull_request.number || github.ref }}
  # Never cancel a push-triggered run on develop/main: only a duplicate PR run is obsolete.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  provider-complete-image:
    name: Provider-complete image exact-head gate
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      # Docker Hub limits anonymous pulls per runner address (429 toomanyrequests on 2026-10-09 stopped base images,
      # pgvector for the PostgreSQL tests, and the Docker qualifications). With the repository secrets
      # DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (a read-only access token), the base images are pulled authenticated;
      # without them (forks, secrets not created) this step is skipped and pulls stay anonymous.
      - name: Log in to Docker Hub (when the secrets exist)
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # AUD-DEP-13: the qualification builds only from the FROM images of docker/Dockerfile.mcp.release, all pinned by
      # digest (check-image-pins.py); `docker build` finds them in the local store. They are pulled while logged in,
      # then the credentials leave the runner before any script of the repository runs (check-workflow-pins.py).
      - name: Pull the pinned base images, then log out of Docker Hub
        shell: bash
        run: |
          set -euo pipefail
          sed -nE 's/^FROM[[:space:]]+(--platform=[^[:space:]]+[[:space:]]+)?([^[:space:]]+@sha256:[0-9a-f]{64}).*$/\2/p' \
            docker/Dockerfile.mcp.release | sort -u | xargs -r -n 1 docker pull --quiet
          docker logout

      - name: Assert exact candidate HEAD
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SHA"

      - name: Set up Java 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Run real provider-complete Docker release qualification
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/ci/qualify-docker-release.sh "$EXPECTED_SHA"

      - name: Upload Docker release qualification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docker-release-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 30
          path: target/qualification/docker-release/**
