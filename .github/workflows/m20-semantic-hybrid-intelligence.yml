name: M20 Semantic Hybrid Code Intelligence Validation

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'minos-domain/**'
      - 'minos-storage-local/**'
      - 'minos-application/**'
      - 'minos-api/**'
      - 'minos-mcp/**'
      - 'minos-nexus/**'
      - 'docs/roadmap/M20_EXECUTION.md'
      - 'docs/adr/0029-optional-rebuildable-semantic-layer-and-hybrid-ranking.md'
      - 'docs/adr/README.md'
      - 'docs/developer/**'
      - 'docs/user/**'
      - 'docs/generated/product-facts.md'
      - 'scripts/m20/**'
      - '.github/workflows/m20-semantic-hybrid-intelligence.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m20-semantic-hybrid-intelligence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  java:
    name: M20 Java 24 qualification
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Java 24
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '24'

      - name: Set up Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Prepare Maven Wrapper
        shell: bash
        run: chmod +x mvnw

      - name: Product facts
        run: python scripts/docs/product-facts.py --check

      - name: Maven verification
        run: ./mvnw -B -ntp clean verify

      - name: JaCoCo gates
        run: python scripts/quality/check-jacoco.py

  m20-final-windows:
    name: M20 final Windows exact-head gate
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/m20-semantic-hybrid-intelligence'
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout exact M20 head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Java 24
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '24'

      - name: Set up Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Run complete M20 exact-head qualification
        shell: powershell
        run: .\scripts\m20\run-final.ps1 -ExpectedHead '${{ github.event.pull_request.head.sha }}'

      - name: Upload M20 diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: m20-final-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 30
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
            target/site/jacoco-aggregate/**
