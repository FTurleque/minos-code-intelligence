# AUD-DEP-04. OSV-Scanner applies this file to the lockfiles of this directory only (gradle/ has its own copy for
# verification-metadata.xml). minos-intellij/gradle.lockfile, what the plugin ships, locks no undertow-core.
#
# undertow-core is on the classpath of the plugin's build script (buildscript-gradle.lockfile), brought by a Gradle
# plugin of the build; MINOS does not ship it, and its advisory has no fixed version, so no constraint can raise it
# (Jackson and jsoup are raised in build.gradle.kts). Only the exact locked version is covered, and the exception
# expires: re-evaluate it then (docs/developer/supply-chain.md).

[[PackageOverrides]]
name = "io.undertow:undertow-core"
version = "2.4.3.Final"
ecosystem = "Maven"
vulnerability.ignore = true
effectiveUntil = 2027-01-15
reason = "Build tool dependency of a Gradle plugin of the build, not shipped by MINOS; no fixed version (AUD-DEP-04)"
